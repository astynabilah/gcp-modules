nt-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">drop — corr 0.97 w/ total_charges</text><line x1="22" y1="268" x2="918" y2="268" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="22" y="294" width="896" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="32" y="311.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">customer_id</text><text x="288" y="311.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.0</text><text x="380" y="311.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">7,043</text><text x="502" y="311.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.004</text><text x="522" y="311.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">drop — an identifier, not a feature</text><line x1="22" y1="294" x2="918" y2="294" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="32" y="337.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">gender</text><text x="288" y="337.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.0</text><text x="380" y="337.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">2</text><text x="502" y="337.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">-0.009</text><text x="522" y="337.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">drop — no signal</text><line x1="22" y1="320" x2="918" y2="320" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="22" y="346" width="896" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="32" y="363.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">phone_service</text><text x="288" y="363.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.0</text><text x="380" y="363.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">2</text><text x="502" y="363.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.012</text><text x="522" y="363.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">drop — no signal</text><line x1="22" y1="346" x2="918" y2="346" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="22" y="392" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why each filter exists</text><rect x="22" y="410" width="4" height="18" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="36" y="423" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Null rate</text><text x="198" y="423" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A column that is 90% null carries little and complicates serving.</text><rect x="22" y="436" width="4" height="18" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="36" y="449" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Cardinality = 1</text><text x="198" y="449" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Constant. Contributes nothing, and hides broken pipelines.</text><rect x="22" y="462" width="4" height="18" fill="#d93025" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="36" y="475" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Cardinality = row count</text><text x="198" y="475" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">An identifier. Trees will happily memorise it.</text><rect x="22" y="488" width="4" height="18" fill="#e37400" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="36" y="501" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Pairwise correlation</text><text x="198" y="501" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Near-duplicates split credit and destroy importance readings.</text><rect x="22" y="524" width="896" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="22" y="524" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="38" y="544" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">None of this needs a model. Correlation with the label is a screen, not a decision — a feature</text><text x="38" y="560" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">with near-zero linear correlation can still matter enormously inside an interaction, which is</text><text x="38" y="576" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">why you drop on structural grounds (identifier, constant, duplicate) and only screen on signal.</text></svg>