<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Configuring a nightly scheduled query for batch scoring"><title>Configuring a nightly scheduled query for batch scoring</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><rect x="1" y="1" width="938" height="47" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="18" y1="18.0" x2="34" y2="18.0" stroke="#5f6368" stroke-width="1.8" opacity="1.0"/><line x1="18" y1="23.5" x2="34" y2="23.5" stroke="#5f6368" stroke-width="1.8" opacity="1.0"/><line x1="18" y1="29.0" x2="34" y2="29.0" stroke="#5f6368" stroke-width="1.8" opacity="1.0"/><text x="46" y="29" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Google Cloud</text><rect x="160" y="12" width="224" height="25" fill="#f8f9fa" stroke="#dadce0" stroke-width="1" rx="13" opacity="1.0"/><text x="174" y="28.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">qwiklabs-gcp-04-7c1e9b2a</text><path d="M 370 21 l 4.5 5.5 l 4.5 -5.5" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="400" y="12" width="360" height="25" fill="#f8f9fa" stroke="none" stroke-width="1" rx="13" opacity="1.0"/><circle cx="416" cy="24" r="4.6" fill="none" stroke="#5f6368" stroke-width="1.5" opacity="1.0"/><line x1="419.4" y1="27.4" x2="422.6" y2="30.6" stroke="#5f6368" stroke-width="1.5" opacity="1.0"/><text x="432" y="28.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Search (/) for resources, docs, products, and more</text><circle cx="912" cy="24" r="12" fill="#c5221f" stroke="none" stroke-width="1" opacity="1.0"/><text x="912" y="28.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="500" text-anchor="middle" opacity="1.0">S</text><line x1="1" y1="48" x2="939" y2="48" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="18" y="76" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="16.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">BigQuery</text><text x="88.8" y="76" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Scheduled queries</text><line x1="1" y1="92" x2="939" y2="92" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="22" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="16" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">New scheduled query</text><line x1="22" y1="138" x2="918" y2="138" stroke="#dadce0" stroke-width="1" opacity="1.0"/><rect x="22" y="172" width="340" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="31" y="166" width="28.0" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="174.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Name</text><text x="34" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nightly-churn-scoring</text><rect x="382" y="172" width="260" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="391" y="166" width="44.5" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="394" y="174.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Repeats</text><text x="394" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Days</text><path d="M 620 187.0 l 5 6 l 5 -6" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="662" y="172" width="254" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="671" y="166" width="77.5" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="674" y="174.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">At time (UTC)</text><text x="674" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">03:00</text><rect x="22" y="224" width="340" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="31" y="218" width="94.0" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="226.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Schedule options</text><text x="34" y="245.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Start now, no end date</text><path d="M 340 239.0 l 5 6 l 5 -6" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="382" y="224" width="260" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="391" y="218" width="88.5" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="394" y="226.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Service account</text><text x="394" y="245.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">bq-scheduler@…</text><path d="M 620 239.0 l 5 6 l 5 -6" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="662" y="224" width="254" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="671" y="218" width="50.0" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="674" y="226.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Location</text><text x="674" y="245.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">US</text><path d="M 894 239.0 l 5 6 l 5 -6" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="22" y="288" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Destination</text><rect x="22" y="300" width="15" height="15" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="2.5" opacity="1.0"/><text x="45" y="311.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Set a destination table for query results</text><text x="62" y="336" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Not needed — the query is a MERGE, so it writes its own target.</text><text x="22" y="378" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Notifications</text><rect x="22" y="390" width="15" height="15" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><path d="M 25.5 397.6 l 3.2 3.3 l 5.0 -5.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="45" y="401.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Send email notifications on failure</text><rect x="22" y="438" width="56.8" height="30" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><text x="50.4" y="457.2" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="500" text-anchor="middle" opacity="1.0">SAVE</text><rect x="90.8" y="438" width="71.2" height="30" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><text x="126.4" y="457.2" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a73e8" font-weight="500" text-anchor="middle" opacity="1.0">Cancel</text><rect x="22" y="488" width="896" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="22" y="488" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="38" y="508" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A scheduled query is the cheapest production ML service there is: no endpoint, no container,</text><text x="38" y="524" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">no autoscaling, nothing running between executions. If your consumers read a table or a</text><text x="38" y="540" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">dashboard rather than calling an API, stop here — you do not need an endpoint at all.</text></svg>