 Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Same images, same table, no training — but now the output columns are the ones you declared.</text><text x="38" y="479" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Coming from Python this is the zero-shot VLM pattern: you replaced a labelled dataset and a</text><text x="38" y="495" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">training loop with a prompt and a schema. What you gave up is a measurable training curve.</text></svg>