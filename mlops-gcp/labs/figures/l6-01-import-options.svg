<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="Six ways to read BigQuery data into a notebook"><title>Six ways to read BigQuery data into a notebook</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Six ways to get BigQuery data into a notebook</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">They are not interchangeable — each one is right at a different scale.</text><rect x="24" y="82" width="892" height="32" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="82" width="892" height="272" fill="none" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><text x="36" y="103" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Method</text><text x="304" y="103" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Moves data?</text><line x1="292" y1="82" x2="292" y2="354" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="454" y="103" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Good up to</text><line x1="442" y1="82" x2="442" y2="354" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="584" y="103" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Use it for</text><line x1="572" y1="82" x2="572" y2="354" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="114" x2="916" y2="114" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="36" y="139" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">%%bigquery magic</text><text x="304" y="139" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">yes</text><text x="454" y="139" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~100k rows</text><text x="584" y="139" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">quick look, one cell</text><rect x="24" y="154" width="892" height="40" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="154" x2="916" y2="154" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="179" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">client.query().to_dataframe()</text><text x="304" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">yes</text><text x="454" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~1M rows</text><text x="584" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">scripted pulls, full control</text><line x1="24" y1="194" x2="916" y2="194" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="219" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">+ BigQuery Storage API</text><text x="304" y="219" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#12a4af" font-weight="600" text-anchor="start" opacity="1.0">yes, fast</text><text x="454" y="219" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~10M rows</text><text x="584" y="219" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">same, 10-30x faster download</text><rect x="24" y="234" width="892" height="40" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="234" x2="916" y2="234" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="259" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">pandas_gbq / read_gbq</text><text x="304" y="259" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">yes</text><text x="454" y="259" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~1M rows</text><text x="584" y="259" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">familiar pandas entry point</text><line x1="24" y1="274" x2="916" y2="274" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="274" width="892" height="40" fill="#188038" stroke="none" stroke-width="1" rx="0" opacity="0.08"/><rect x="24" y="274" width="4" height="40" fill="#188038" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="36" y="299" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">bigframes (BigQuery DataFrames)</text><text x="304" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">NO — pushes down</text><text x="454" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">any size</text><text x="584" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the default for exploration</text><rect x="24" y="314" width="892" height="40" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="314" x2="916" y2="314" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="339" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">EXPORT DATA to GCS -&gt; read</text><text x="304" y="339" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">yes, in bulk</text><text x="454" y="339" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">unbounded</text><text x="584" y="339" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">handing data to another system</text><rect x="24" y="374" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="374" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="394" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&#x27;Good up to&#x27; is about your notebook&#x27;s RAM, not BigQuery&#x27;s limits — BigQuery will happily</text><text x="40" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">return more than your kernel can hold. The free Colab runtime has roughly 12 GB, and a</text><text x="40" y="426" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">DataFrame typically needs several times the bytes BigQuery reports for the same data.</text></svg>