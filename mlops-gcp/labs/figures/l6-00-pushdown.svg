<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-label="Push-down versus pull-down when exploring BigQuery data"><title>Push-down versus pull-down when exploring BigQuery data</title><rect width="940" height="430" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="429" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The only question that matters: where does the computation happen?</text><rect x="24" y="62" width="436" height="250" fill="#fff8f7" stroke="#d93025" stroke-width="1.4" rx="10" opacity="1.0"/><text x="44" y="86" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">PULL DOWN — move data to the code</text><rect x="44" y="104" width="130" height="54" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="109.0" y="126.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery</text><text x="109.0" y="143.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">1.7M rows</text><rect x="300" y="104" width="140" height="54" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="370.0" y="126.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Notebook RAM</text><text x="370.0" y="143.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">12 GB, free tier</text><line x1="174" y1="131" x2="293.0" y2="131.0" stroke="#d93025" stroke-width="1.6" opacity="1.0"/><path d="M 300.0 131.0 L 291.8 134.7 L 291.8 127.3 Z" fill="#d93025" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="237.0" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">every row crosses</text><text x="56" y="190" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">df = client.query(&#x27;SELECT * ...&#x27;).to_dataframe()</text><text x="44" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Works fine until it doesn&#x27;t. The failure is</text><text x="44" y="239" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">abrupt: the kernel dies with no useful error</text><text x="44" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">at whatever size exceeds your RAM.</text><text x="44" y="292" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">Good for: &lt; ~1M rows, final plotting</text><rect x="480" y="62" width="436" height="250" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="10" opacity="1.0"/><text x="500" y="86" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">PUSH DOWN — move the code to the data</text><rect x="500" y="104" width="130" height="54" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="565.0" y="126.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery</text><text x="565.0" y="143.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">does the work</text><rect x="756" y="104" width="140" height="54" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="826.0" y="126.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Notebook RAM</text><text x="826.0" y="143.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">results only</text><line x1="630" y1="131" x2="749.0" y2="131.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 756.0 131.0 L 747.8 134.7 L 747.8 127.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="693.0" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">a few KB</text><text x="512" y="190" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">df = bpd.read_gbq(&#x27;...&#x27;); df.describe()</text><text x="500" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">bigframes gives you the pandas API but runs</text><text x="500" y="239" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">it as SQL. Nothing is downloaded until you</text><text x="500" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">ask for it with .to_pandas().</text><text x="500" y="292" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">Good for: any size, all aggregation</text><rect x="24" y="334" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="334" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="354" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Coming from pandas, the instinct is to load the table and then explore. In a warehouse that</text><text x="40" y="370" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">instinct is backwards: explore with SQL or bigframes, and pull down only the small result you</text><text x="40" y="386" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">actually want to plot. The rule of thumb — if the answer fits on a screen, don&#x27;t move a table.</text></svg>