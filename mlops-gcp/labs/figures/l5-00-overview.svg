<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="The four stages of feature work"><title>The four stages of feature work</title><rect width="940" height="380" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="379" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Lab 5 — the four things people mean by “feature engineering”</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">They are different jobs with different tools, and only one of them needs a model to exist first.</text><rect x="28" y="86" width="206" height="180" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="28" y="86" width="206" height="40" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="28" y="116" width="206" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="131.0" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Transformation</text><text x="131.0" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">types, joins,</text><text x="131.0" y="167" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">windows</text><line x1="48" y1="190" x2="214" y2="190" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="131.0" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">raw tables -&gt; one row</text><text x="131.0" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">per prediction unit</text><line x1="236" y1="176" x2="247.0" y2="176.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 254.0 176.0 L 245.8 179.7 L 245.8 172.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="256" y="86" width="206" height="180" fill="#ffffff" stroke="#12a4af" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="256" y="86" width="206" height="40" fill="#12a4af" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="256" y="116" width="206" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="359.0" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Extraction</text><text x="359.0" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">derive new signal</text><text x="359.0" y="167" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">from what you have</text><line x1="276" y1="190" x2="442" y2="190" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="359.0" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">ratios, bands, counts,</text><text x="359.0" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">embeddings</text><line x1="464" y1="176" x2="475.0" y2="176.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 482.0 176.0 L 473.8 179.7 L 473.8 172.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="484" y="86" width="206" height="180" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="484" y="86" width="206" height="40" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="484" y="116" width="206" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="587.0" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Selection</text><text x="587.0" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">drop what does not</text><text x="587.0" y="167" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">earn its place</text><line x1="504" y1="190" x2="670" y2="190" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="587.0" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">cardinality, correlation,</text><text x="587.0" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">leakage</text><line x1="692" y1="176" x2="703.0" y2="176.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 710.0 176.0 L 701.8 179.7 L 701.8 172.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="712" y="86" width="206" height="180" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="712" y="86" width="206" height="40" fill="#8430ce" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="712" y="116" width="206" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="815.0" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Importance</text><text x="815.0" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">explain what the</text><text x="815.0" y="167" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">model actually used</text><line x1="732" y1="190" x2="898" y2="190" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="815.0" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">needs a trained model</text><rect x="24" y="288" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="288" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="308" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The loop runs backwards too: importance tells you what to drop, which sends you back to</text><text x="40" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">selection, and a feature that turns out to be leakage sends you back to transformation.</text><text x="40" y="340" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Only importance requires a trained model — the other three happen before any CREATE MODEL.</text></svg>