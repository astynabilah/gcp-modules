<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Three kinds of feature importance compared"><title>Three kinds of feature importance compared</title><rect width="940" height="470" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="469" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Three kinds of “feature importance” — they answer different questions</text><rect x="28" y="66" width="288" height="300" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="28" y="66" width="288" height="52" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="28" y="108" width="288" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="172.0" y="90" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">ML.FEATURE_IMPORTANCE</text><text x="172.0" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="middle" opacity="1.0">split-based (gain)</text><text x="46" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">How much each feature</text><text x="46" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">improved the trees&#x27;</text><text x="46" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">splits during training.</text><text x="46" y="193" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="46" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Trees only. Free — it</text><text x="46" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">falls out of training.</text><text x="46" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="46" y="261" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Biased toward high-</text><text x="46" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">cardinality columns.</text><rect x="328" y="66" width="288" height="300" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="328" y="66" width="288" height="52" fill="#8430ce" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="328" y="108" width="288" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="472.0" y="90" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">ML.GLOBAL_EXPLAIN</text><text x="472.0" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="middle" opacity="1.0">attribution to predictions</text><text x="346" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Mean absolute contri-</text><text x="346" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">bution to the model&#x27;s</text><text x="346" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">outputs.</text><text x="346" y="193" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="346" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Needs ENABLE_GLOBAL_</text><text x="346" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">EXPLAIN at training.</text><text x="346" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="346" y="261" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Correlated features</text><text x="346" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">split the credit.</text><rect x="628" y="66" width="288" height="300" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="628" y="66" width="288" height="52" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="628" y="108" width="288" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="772.0" y="90" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Drop-column test</text><text x="772.0" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">retrain without it</text><text x="646" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Retrain with the column</text><text x="646" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">removed, compare AUC.</text><text x="646" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="646" y="193" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The only one that</text><text x="646" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">answers &#x27;do I still need</text><text x="646" y="227" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">this?&#x27;</text><text x="646" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="646" y="261" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Costs one training run</text><text x="646" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">per feature.</text><rect x="28" y="386" width="888" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="28" y="386" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="44" y="406" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The trap is using the first two for feature selection. Both are descriptions of one fitted</text><text x="44" y="422" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">model, not statements about the world: drop a feature that shares its signal with another and</text><text x="44" y="438" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">accuracy may not move at all. Only the drop-column test answers the selection question — and</text><text x="44" y="454" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">importance ranking is never evidence of causation, however much a stakeholder wants it to be.</text></svg>