<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="Three tiers of computer vision on Google Cloud"><title>Three tiers of computer vision on Google Cloud</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="36" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Three tiers of computer vision on GCP — and what each replaces</text><text x="24" y="58" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Only the third one is &#x27;training a model&#x27;. Two of the three need no labelled data at all.</text><rect x="24" y="82" width="896" height="44" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="82" width="896" height="306" fill="none" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><text x="36" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0"></text><text x="172" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#12a4af" font-weight="600" text-anchor="start" opacity="1.0">Pretrained API</text><text x="172" y="117" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">ML.ANNOTATE_IMAGE</text><line x1="160" y1="82" x2="160" y2="388" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="390" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">Foundation model</text><text x="390" y="117" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">AI.GENERATE / AI.EMBED</text><line x1="378" y1="82" x2="378" y2="388" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="644" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">Custom training</text><text x="644" y="117" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">AutoML or Vertex custom</text><line x1="632" y1="82" x2="632" y2="388" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="126" x2="920" y2="126" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="36" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">You supply</text><text x="172" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nothing</text><text x="390" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a prompt + output schema</text><text x="644" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">labelled images (100s–1000s)</text><rect x="24" y="168" width="896" height="42" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="168" x2="920" y2="168" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Setup</text><text x="172" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">one remote model</text><text x="390" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">one function call</text><text x="644" y="193.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">dataset, budget, hours of training</text><line x1="24" y1="210" x2="920" y2="210" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Cost, 40 images</text><text x="172" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">free tier</text><text x="390" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a few cents</text><text x="644" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">node-hours — dollars, minimum</text><rect x="24" y="252" width="896" height="42" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="252" x2="920" y2="252" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="277.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Output</text><text x="172" y="277.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">fixed generic vocabulary</text><text x="390" y="277.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">any schema you declare</text><text x="644" y="277.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">exactly your classes</text><line x1="24" y1="294" x2="920" y2="294" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="319.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Python analogue</text><text x="172" y="319.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">calling a hosted API</text><text x="390" y="319.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">zero-shot CLIP / VLM prompting</text><text x="644" y="319.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">fine-tuning a ResNet</text><rect x="24" y="336" width="896" height="52" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="336" x2="920" y2="336" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="366.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Reach for it when</text><text x="172" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">generic labels, OCR,</text><text x="172" y="371" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">faces are enough</text><text x="390" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">you need custom attributes</text><text x="390" y="371" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">and have no labels</text><text x="644" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">fixed taxonomy, high volume,</text><text x="644" y="371" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">accuracy you must prove</text><rect x="24" y="404" width="896" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="404" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">This lab builds tiers 1 and 2 and skips tier 3 deliberately: AutoML image training has a</text><text x="40" y="440" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">minimum node-hour budget and takes hours, which buys you nothing you cannot already see.</text><text x="40" y="456" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Know what it costs, and reach for it only when a prompt genuinely stops being good enough.</text></svg>