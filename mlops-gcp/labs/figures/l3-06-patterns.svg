<svg xmlns="http://www.w3.org/2000/svg" width="940" height="476" viewBox="0 0 940 476" role="img" aria-label="Comparison of the three serving patterns"><title>Comparison of the three serving patterns</title><rect width="940" height="476" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="475" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="36" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Choosing a serving pattern</text><text x="24" y="58" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The pattern is decided by how the consumer reads the prediction, not by how good the model is.</text><rect x="24" y="78" width="896" height="30" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="78" width="896" height="250" fill="none" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><text x="36" y="98" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0"></text><text x="162" y="98" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">Batch (scheduled query)</text><line x1="150" y1="78" x2="150" y2="328" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="424" y="98" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">Online (endpoint)</text><line x1="412" y1="78" x2="412" y2="328" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="674" y="98" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">In-SQL (remote model)</text><line x1="662" y1="78" x2="662" y2="328" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="108" x2="920" y2="108" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="36" y="135" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Latency</text><text x="162" y="135" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">hours — whenever it last ran</text><text x="424" y="135" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">~30 ms per request</text><text x="674" y="135" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">seconds per query</text><rect x="24" y="152" width="896" height="44" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="152" x2="920" y2="152" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Cost when idle</text><text x="162" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">zero</text><text x="424" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">per node-hour, always</text><text x="674" y="179" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">zero</text><line x1="24" y1="196" x2="920" y2="196" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Setup</text><text x="162" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">one scheduled query</text><text x="424" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">endpoint + machine type</text><text x="674" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">endpoint + CREATE MODEL</text><rect x="24" y="240" width="896" height="44" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="240" x2="920" y2="240" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="267" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Scales to</text><text x="162" y="267" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">millions of rows</text><text x="424" y="267" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">requests per second</text><text x="674" y="267" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">millions of rows</text><line x1="24" y1="284" x2="920" y2="284" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="311" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Use when</text><text x="162" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">dashboards, CRM lists,</text><text x="162" y="319" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nightly campaigns</text><text x="424" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">app decides at click time</text><text x="424" y="319" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">(checkout, login, chat)</text><text x="674" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">analysts need the live</text><text x="674" y="319" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">model inside a join</text><rect x="24" y="346" width="896" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="346" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Most churn work never needs an endpoint. A nightly scheduled query feeding a table costs</text><text x="40" y="382" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nothing between runs and serves dashboards and campaign lists perfectly well. Reach for an</text><text x="40" y="398" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">endpoint only when something has to decide inside a user-facing request.</text></svg>