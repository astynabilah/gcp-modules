<svg xmlns="http://www.w3.org/2000/svg" width="940" height="494" viewBox="0 0 940 494" role="img" aria-label="Notebook environment options ranked by cost"><title>Notebook environment options ranked by cost</title><rect width="940" height="494" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="493" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Where to run the notebook — cheapest first</text><rect x="24" y="62" width="892" height="78" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="62" width="6" height="78" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="88" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Colab (colab.research.google.com)</text><rect x="292.29999999999995" y="75" width="42.36" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="301.29999999999995" y="88.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">FREE</text><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Free CPU runtime, no GCP billing for the notebook itself.</text><text x="44" y="127" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Idle timeouts, no VPC, not for sensitive data. This lab uses it.</text><rect x="24" y="148" width="892" height="78" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="148" width="6" height="78" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="174" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">BigQuery Studio notebooks</text><rect x="235.5" y="161" width="103.25999999999999" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="244.5" y="174.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">runtime billed</text><text x="44" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Notebooks inside the BigQuery console, Colab Enterprise runtime underneath.</text><text x="44" y="213" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Nice when you already live in BigQuery. You pay for the runtime while it runs.</text><rect x="24" y="234" width="892" height="78" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="234" width="6" height="78" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="260" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Colab Enterprise</text><rect x="171.6" y="247" width="103.25999999999999" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="180.6" y="260.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">runtime billed</text><text x="44" y="280" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Managed Colab in your project: VPC, IAM, private data.</text><text x="44" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The compliance answer. Costs per runtime-hour.</text><rect x="24" y="320" width="892" height="78" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="320" width="6" height="78" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Vertex AI Workbench</text><rect x="192.9" y="333" width="170.25" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="201.9" y="346.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">VM billed 24/7 if left on</text><text x="44" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A full managed JupyterLab VM you control.</text><text x="44" y="385" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Most flexible, most expensive. Idle VMs are the classic surprise bill.</text><rect x="24" y="410" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="410" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="430" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">In every case the BigQuery bill is separate and identical: you pay for bytes scanned by your</text><text x="40" y="446" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">queries (1 TB/month free), no matter which notebook issued them. Choosing free Colab saves</text><text x="40" y="462" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the compute, not the query cost — which is why the habits in this lab matter more than the venue.</text></svg>