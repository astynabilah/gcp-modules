="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Nothing is downloaded and nothing is trained. The images stay in Cloud Storage; the object</text><text x="40" y="358" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">table is a pointer with metadata, and all three inference paths are function calls in SQL.</text></svg>