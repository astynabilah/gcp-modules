="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Min replicas</text><text x="460" y="355.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">1</text><rect x="598" y="334" width="130" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="607" y="328" width="72.0" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="610" y="336.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Max replicas</text><text x="610" y="355.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">3</text><text x="208" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Traffic split</text><rect x="208" y="412" width="130" height="34" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><rect x="217" y="406" width="61.0" height="12" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="220" y="414.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">This model</text><text x="220" y="433.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">100 %</text><text x="358" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Set below 100 to canary a new version against the current one.</text><rect x="208" y="470" width="15" height="15" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><path d="M 211.5 477.6 l 3.2 3.3 l 5.0 -5.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="231" y="481.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Enable prediction logging to BigQuery  (required for monitoring)</text><rect x="208" y="508" width="71.2" height="30" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><text x="243.6" y="527.2" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="500" text-anchor="middle" opacity="1.0">DEPLOY</text><rect x="208" y="554" width="710" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="208" y="554" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="224" y="574" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Min replicas = 1 means one node runs 24/7 and bills per node-hour whether or not a single</text><text x="224" y="590" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">prediction arrives. This is the line item that surprises people. Use min replicas = 0 for a</text><text x="224" y="606" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">lab or dev endpoint so it scales to nothing when idle, and undeploy it when you finish.</text></svg>