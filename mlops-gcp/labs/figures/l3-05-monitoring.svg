Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">OK</text><line x1="524" y1="316" x2="860" y2="316" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="22" y="382" width="896" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="22" y="382" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="38" y="402" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Categorical features use L-infinity distance; numerical features use Jensen-Shannon divergence.</text><text x="38" y="418" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Drift is not automatically a bug: two features moving together usually means the business changed</text><text x="38" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">— here a payment-method migration shifted the mix, which also shifted contract types. The model</text><text x="38" y="450" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">is not broken; the world it trained on moved. Retrain on recent data and re-check Lab 2 metrics.</text></svg>