"226" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="22" y="256" width="896" height="30" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="32" y="275.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">+ hyperparameter tuning</text><text x="434" y="275.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">29</text><text x="544" y="275.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.876</text><text x="644" y="275.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">0.769</text><text x="664" y="275.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">+0.045</text><line x1="22" y1="256" x2="918" y2="256" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="32" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Leaky version (cancellation_reason)</text><text x="434" y="305.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">30</text><text x="544" y="305.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#d93025" font-weight="400" text-anchor="end" opacity="1.0">0.991</text><text x="644" y="305.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#d93025" font-weight="400" text-anchor="end" opacity="1.0">0.982</text><text x="664" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">+0.160  ⚠</text><line x1="22" y1="286" x2="918" y2="286" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="22" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">Read the last row carefully</text><text x="22" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.991 AUC is not a breakthrough. cancellation_reason only has a value because the customer already churned,</text><text x="22" y="363" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">so the model is reading the answer. In production that column is null for everyone you actually want to score,</text><text x="22" y="380" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">and the model collapses to worse than the baseline rule.</text><rect x="22" y="410" width="896" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="22" y="410" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="38" y="430" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Feature engineering bought +0.038 AUC here; hyperparameter tuning bought +0.007. That ratio</text><text x="38" y="446" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">is typical and it is the argument for spending your next hour on features, not on a search</text><text x="38" y="462" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">space. It is also why ablation belongs in your workflow: without it you are guessing.</text></svg>