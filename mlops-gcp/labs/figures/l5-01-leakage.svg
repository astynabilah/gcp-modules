<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-label="Point-in-time correctness and feature leakage"><title>Point-in-time correctness and feature leakage</title><rect width="940" height="440" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="439" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Point-in-time correctness — the bug that makes a model look brilliant</text><line x1="60" y1="150" x2="880" y2="150" stroke="#5f6368" stroke-width="1.6" opacity="1.0"/><line x1="142.0" y1="142" x2="142.0" y2="158" stroke="#5f6368" stroke-width="1.6" opacity="1.0"/><text x="142.0" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">signup</text><line x1="404.4" y1="142" x2="404.4" y2="158" stroke="#5f6368" stroke-width="1.6" opacity="1.0"/><text x="404.4" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">cutoff</text><text x="404.4" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">(features end here)</text><line x1="568.4" y1="142" x2="568.4" y2="158" stroke="#5f6368" stroke-width="1.6" opacity="1.0"/><text x="568.4" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">label window opens</text><line x1="830.8" y1="142" x2="830.8" y2="158" stroke="#5f6368" stroke-width="1.6" opacity="1.0"/><text x="830.8" y="176" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">churn observed</text><rect x="142.0" y="106" width="262.4" height="26" fill="#1a73e8" stroke="none" stroke-width="1" rx="5" opacity="0.2"/><text x="273.20000000000005" y="124" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a73e8" font-weight="600" text-anchor="middle" opacity="1.0">features may use this</text><rect x="568.4" y="106" width="262.4" height="26" fill="#d93025" stroke="none" stroke-width="1" rx="5" opacity="0.18"/><text x="699.6" y="124" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="600" text-anchor="middle" opacity="1.0">label lives here — features must NOT</text><rect x="404.4" y="58" width="2.5" height="84" fill="#e37400" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="404.4" y="50" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">prediction time</text><rect x="60" y="232" width="820" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="60" y="232" width="820" height="163" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="70" y="249.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Feature</text><text x="350" y="249.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Verdict</text><line x1="340" y1="232" x2="340" y2="395" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="460" y="249.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Why</text><line x1="450" y1="232" x2="450" y2="395" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="60" y1="260" x2="880" y2="260" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="70" y="277.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tenure_months (at cutoff)</text><text x="350" y="277.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">safe</text><text x="460" y="277.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">known before the prediction is made</text><rect x="60" y="287" width="820" height="27" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="70" y="304.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">support_tickets_last_30d</text><text x="350" y="304.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">safe</text><text x="460" y="304.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">windowed to end at the cutoff</text><line x1="60" y1="287" x2="880" y2="287" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="70" y="331.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">total_charges (lifetime, today)</text><text x="350" y="331.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">LEAKAGE</text><text x="460" y="331.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">includes billing after the cutoff</text><line x1="60" y1="314" x2="880" y2="314" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="60" y="341" width="820" height="27" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="70" y="358.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cancellation_reason</text><text x="350" y="358.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">LEAKAGE</text><text x="460" y="358.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">only exists because they churned</text><line x1="60" y1="341" x2="880" y2="341" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="70" y="385.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">last_login_date (today)</text><text x="350" y="385.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">LEAKAGE</text><text x="460" y="385.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">updated after the label window opened</text><line x1="60" y1="368" x2="880" y2="368" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="60" y="386" width="820" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="60" y="386" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="76" y="406" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Leakage does not throw an error. It shows up as a suspiciously excellent model that collapses</text><text x="76" y="422" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">in production — the tell is an AUC that jumps far above your baseline for no clear reason.</text></svg>