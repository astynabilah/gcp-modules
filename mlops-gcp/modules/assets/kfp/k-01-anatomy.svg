<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Anatomy of a Vertex AI Pipelines run"><title>Anatomy of a Vertex AI Pipelines run</title><rect width="940" height="470" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="469" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">What actually happens when you &#x27;run a pipeline&#x27;</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Your Python never runs on Vertex. It runs once, locally, to produce a YAML description of a DAG.</text><rect x="24" y="80" width="400" height="300" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.3" rx="10" opacity="0.9"/><text x="40" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">YOUR MACHINE  (or Cloud Shell)</text><text x="44" y="132" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">@dsl.component</text><text x="44" y="148" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1967d2" font-weight="400" text-anchor="start" opacity="1.0">def</text><text x="62.3" y="148" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"> train(data: Input[Dataset],</text><text x="44" y="164" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">          model: Output[Model]):</text><text x="44" y="180" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">    </text><text x="68.4" y="180" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#9aa0a6" font-weight="400" text-anchor="start" opacity="1.0"># plain python</text><text x="44" y="196" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="44" y="212" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">@dsl.pipeline</text><text x="44" y="228" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1967d2" font-weight="400" text-anchor="start" opacity="1.0">def</text><text x="62.3" y="228" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"> churn_pipeline():</text><text x="44" y="244" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">    d = extract()</text><text x="44" y="260" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">    m = train(data=d.outputs[</text><text x="220.89999999999998" y="260" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#0d652d" font-weight="400" text-anchor="start" opacity="1.0">&#x27;out&#x27;</text><text x="251.39999999999998" y="260" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">])</text><rect x="44" y="296" width="168" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="128.0" y="322.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">compiler.compile()</text><rect x="236" y="296" width="168" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="320.0" y="313.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">pipeline.yaml</text><text x="320.0" y="330.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the IR — a DAG spec</text><line x1="212" y1="318" x2="229.0" y2="318.0" stroke="#1a73e8" stroke-width="1.6" opacity="1.0"/><path d="M 236.0 318.0 L 227.8 321.7 L 227.8 314.3 Z" fill="#1a73e8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="452" y="80" width="464" height="300" fill="#faf5ff" stroke="#8430ce" stroke-width="1.3" rx="10" opacity="0.9"/><text x="468" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">VERTEX AI PIPELINES  (Agent Platform)</text><line x1="424" y1="318" x2="445.0" y2="318.0" stroke="#8430ce" stroke-width="1.6" opacity="1.0"/><path d="M 452.0 318.0 L 443.8 321.7 L 443.8 314.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="438" y="300" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">submit</text><rect x="476" y="132" width="124" height="52" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="538.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">extract</text><text x="538.0" y="170.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">one container</text><rect x="616" y="132" width="124" height="52" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="678.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">train</text><text x="678.0" y="170.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">one container</text><rect x="756" y="132" width="124" height="52" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="818.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">evaluate</text><text x="818.0" y="170.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">one container</text><line x1="600" y1="158" x2="609.0" y2="158.0" stroke="#8430ce" stroke-width="1.6" opacity="1.0"/><path d="M 616.0 158.0 L 607.8 161.7 L 607.8 154.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="740" y1="158" x2="749.0" y2="158.0" stroke="#8430ce" stroke-width="1.6" opacity="1.0"/><path d="M 756.0 158.0 L 747.8 161.7 L 747.8 154.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="494" y="214" width="88" height="34" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.16"/><text x="538" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">artifact</text><line x1="538" y1="186" x2="538.0" y2="205.0" stroke="#e37400" stroke-width="1.3" opacity="1.0"/><path d="M 538.0 212.0 L 534.3 203.8 L 541.7 203.8 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="634" y="214" width="88" height="34" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.16"/><text x="678" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">artifact</text><line x1="678" y1="186" x2="678.0" y2="205.0" stroke="#e37400" stroke-width="1.3" opacity="1.0"/><path d="M 678.0 212.0 L 674.3 203.8 L 681.7 203.8 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="774" y="214" width="88" height="34" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.16"/><text x="818" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">artifact</text><line x1="818" y1="186" x2="818.0" y2="205.0" stroke="#e37400" stroke-width="1.3" opacity="1.0"/><path d="M 818.0 212.0 L 814.3 203.8 L 821.7 203.8 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="476" y="276" width="404" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="678" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML Metadata — lineage, params, artifacts, cached runs</text><text x="678" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">every run recorded and comparable</text><line x1="538" y1="248" x2="538" y2="276" stroke="#188038" stroke-width="1.2" stroke-dasharray="3 3" opacity="1.0"/><line x1="678" y1="248" x2="678" y2="276" stroke="#188038" stroke-width="1.2" stroke-dasharray="3 3" opacity="1.0"/><line x1="818" y1="248" x2="818" y2="276" stroke="#188038" stroke-width="1.2" stroke-dasharray="3 3" opacity="1.0"/><rect x="24" y="396" width="892" height="48" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="396" width="3.5" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="416" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Each component becomes its own container on its own machine. That is the source of both the</text><text x="40" y="432" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">power (independent scaling, any language, cached steps) and the friction (cold starts, everything crossing a boundary must be serialisable).</text></svg>