<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-label="Parameters versus artifacts in KFP"><title>Parameters versus artifacts in KFP</title><rect width="940" height="430" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="429" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Parameters vs. Artifacts — the distinction that trips everyone up</text><rect x="24" y="66" width="436" height="250" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="24" y="66" width="436" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="24" y="104" width="436" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="44" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Parameter</text><text x="44" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">small values, by value</text><text x="44" y="138" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">int, float, str, bool,</text><text x="44" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">list, dict</text><text x="44" y="172" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="44" y="189" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Stored in ML Metadata.</text><text x="44" y="206" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Visible in the run UI.</text><text x="44" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Comparable across runs.</text><text x="44" y="240" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="44" y="257" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Use for: config, dates,</text><text x="44" y="274" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">thresholds, table names.</text><rect x="476" y="66" width="436" height="250" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="476" y="66" width="436" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="476" y="104" width="436" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="496" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Artifact</text><text x="496" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">big things, by reference</text><text x="496" y="138" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Dataset, Model, Metrics,</text><text x="496" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">HTML, Markdown</text><text x="496" y="172" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="496" y="189" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Stored in Cloud Storage.</text><text x="496" y="206" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Passed as a PATH, not</text><text x="496" y="223" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">as the bytes.</text><text x="496" y="240" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="496" y="257" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Use for: files, model</text><text x="496" y="274" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">weights, dataframes.</text><rect x="486" y="208" width="200" height="26" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="500" y="226" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">src: str            # parameter</text><text x="500" y="244" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">out: Output[Dataset] # artifact</text><rect x="24" y="336" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="336" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The rule: a parameter is passed BY VALUE and shows up in the run comparison UI; an artifact is</text><text x="40" y="372" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">passed BY REFERENCE and you read/write its .path. Returning a 2 GB DataFrame as a parameter is</text><text x="40" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the single most common KFP mistake — it serialises through metadata and the run falls over.</text></svg>