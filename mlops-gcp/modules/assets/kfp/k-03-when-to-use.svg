<svg xmlns="http://www.w3.org/2000/svg" width="940" height="578" viewBox="0 0 940 578" role="img" aria-label="Choosing an orchestrator on Google Cloud"><title>Choosing an orchestrator on Google Cloud</title><rect width="940" height="578" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="577" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Do you need a pipeline at all? — pick the lightest thing that works</text><rect x="24" y="66" width="892" height="96" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="66" width="6" height="96" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="92" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Scheduled query</text><text x="167.0" y="92" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">BigQuery</text><text x="44" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">One SQL statement on a timer.</text><text x="44" y="132" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">+  Zero infrastructure. Free between runs.</text><text x="44" y="150" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">−  No branching, no non-SQL steps, no lineage.</text><rect x="24" y="172" width="892" height="96" fill="#ffffff" stroke="#12a4af" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="172" width="6" height="96" fill="#12a4af" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="198" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Workflows</text><text x="122.60000000000001" y="198" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="600" text-anchor="start" opacity="1.0">Cloud Workflows</text><text x="44" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A few API calls in sequence, with retries.</text><text x="44" y="238" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">+  Serverless, cheap, YAML.</text><text x="44" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">−  Not ML-aware: no artifacts, no caching, no experiment tracking.</text><rect x="24" y="278" width="892" height="96" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="278" width="6" height="96" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Vertex AI Pipelines</text><text x="196.6" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">managed KFP</text><text x="44" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">ML DAG: training, evaluation, conditional deploy.</text><text x="44" y="344" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">+  Artifact lineage, step caching, run comparison, per-step machines.</text><text x="44" y="362" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">−  Python and containers. ~$0.03/run + compute. Cold starts per step.</text><rect x="24" y="384" width="892" height="96" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="384" width="6" height="96" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="44" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Cloud Composer</text><text x="159.60000000000002" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">managed Airflow</text><text x="44" y="430" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Broad data orchestration across many systems.</text><text x="44" y="450" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">+  Huge operator ecosystem, mature scheduling.</text><text x="44" y="468" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">−  A cluster that runs — and bills — 24/7.</text><rect x="24" y="494" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="494" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="514" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Read top to bottom and stop at the first row that fits. Most teams reach for row 3 when row 1</text><text x="40" y="530" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">would have done — a pipeline is worth its overhead when you have real branching, expensive</text><text x="40" y="546" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">steps worth caching, or a compliance need to prove which data produced which model.</text></svg>