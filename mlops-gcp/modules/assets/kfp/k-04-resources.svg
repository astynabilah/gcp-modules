<svg xmlns="http://www.w3.org/2000/svg" width="940" height="648" viewBox="0 0 940 648" role="img" aria-label="Where per-step machine resources are configured in KFP"><title>Where per-step machine resources are configured in KFP</title><rect width="940" height="648" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="647" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Where machine resources are configured — and where they are not</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Three places look plausible. Only one of them accepts resource settings.</text><rect x="24" y="78" width="892" height="118" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="78" width="6" height="118" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="104" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">@dsl.component(...)</text><rect x="844" y="92" width="30.18" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="853" y="105.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">NO</text><text x="46" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Defines WHAT runs: base_image, packages_to_install, target_image.</text><text x="46" y="150" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">There is no gpu_limit, gpu_type or accelerator argument here.</text><text x="46" y="165" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The decorator describes the component; resources belong to the task.</text><rect x="24" y="208" width="892" height="118" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="208" width="6" height="118" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="234" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">task = train(...)   inside @dsl.pipeline</text><rect x="844" y="222" width="36.269999999999996" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="853" y="235.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">YES</text><text x="46" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The DAG node. This is where per-step resources live.</text><text x="46" y="280" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">.set_cpu_limit(&#x27;8&#x27;)          .set_memory_limit(&#x27;32G&#x27;)</text><text x="46" y="295" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">.set_accelerator_type(&#x27;NVIDIA_TESLA_T4&#x27;)   .set_accelerator_limit(1)</text><text x="46" y="310" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">.set_retry(...)   .set_caching_options(...)   .set_env_variable(...)</text><rect x="24" y="338" width="892" height="118" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="338" width="6" height="118" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="364" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">aiplatform.PipelineJob(...)</text><rect x="844" y="352" width="30.18" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="853" y="365.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">NO</text><text x="46" y="386" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Submission-level only: parameter_values, enable_caching, service_account, labels.</text><text x="46" y="410" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">There is no machine_spec parameter, and nothing global for resources.</text><text x="46" y="425" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Per-step sizing is the whole point — a global setting would defeat it.</text><rect x="24" y="468" width="892" height="84" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="468" width="6" height="84" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="494" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">create_custom_training_job_from_component(...)</text><rect x="790" y="482" width="127.62" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="799" y="495.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">when you need MORE</text><text x="46" y="516" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Wraps a component as a Vertex custom training job.</text><text x="46" y="536" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Use for an EXACT machine_type, reservations, TPUs, or a custom service account.</text><rect x="24" y="564" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="564" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="584" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">set_cpu_limit / set_memory_limit express a MINIMUM — Vertex picks a machine that satisfies</text><text x="40" y="600" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">them. If you must land on a specific machine type, that is the one thing the chained methods</text><text x="40" y="616" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cannot do, and the reason the custom-training wrapper exists.</text></svg>