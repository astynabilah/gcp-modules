<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-label="Feature attribution and sliced metrics are not bias detection"><title>Feature attribution and sliced metrics are not bias detection</title><rect width="940" height="640" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="639" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Three things that sound like fairness measurement — one is</text><rect x="24" y="66" width="892" height="152" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="66" width="6" height="152" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="94" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Feature attribution</text><rect x="724" y="81" width="127.62" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="733" y="94.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">NOT bias detection</text><text x="46" y="116" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">How much each feature contributed to a prediction.</text><text x="46" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Per-prediction importance, not group comparison. A high attribution for &#x27;region&#x27; means the</text><text x="46" y="160" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">model USES region — which may be entirely legitimate. And a model can discriminate with</text><text x="46" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">region attribution near zero, via proxies like postcode. Wrong instrument.</text><rect x="24" y="226" width="892" height="152" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="226" width="6" height="152" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="254" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Sliced evaluation metrics</text><rect x="724" y="241" width="97.17" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="733" y="254.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">CLOSE, NOT IT</text><text x="46" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">ModelEvaluationClassificationOp with slicing_specs.</text><text x="46" y="302" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Gives you accuracy, precision and recall per slice — genuinely useful, and the raw material</text><text x="46" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">for fairness. But they are PERFORMANCE metrics; you would still compute the fairness</text><text x="46" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">differences yourself, by hand, and defend your definitions.</text><rect x="24" y="386" width="892" height="152" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="386" width="6" height="152" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="414" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Bias detection components</text><rect x="724" y="401" width="66.72" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="733" y="414.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">THIS ONE</text><text x="46" y="436" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">DetectDataBiasOp and DetectModelBiasOp.</text><text x="46" y="462" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Purpose-built, standardised bias metrics computed across the slices you name in BiasConfig.</text><text x="46" y="480" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Standardised matters for a regulator: you are reporting a defined metric rather than an</text><text x="46" y="498" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">in-house calculation you have to justify.</text><rect x="24" y="552" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="552" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="572" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The distinction that matters: bias is a property of OUTCOMES ACROSS GROUPS, not of how much</text><text x="40" y="588" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a feature mattered. Any method that never compares two slices to each other is measuring</text><text x="40" y="604" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">something else, however reasonable it sounds in a meeting.</text></svg>