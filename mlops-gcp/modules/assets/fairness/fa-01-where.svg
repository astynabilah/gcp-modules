<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="DetectDataBiasOp before training, DetectModelBiasOp after prediction"><title>DetectDataBiasOp before training, DetectModelBiasOp after prediction</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Two bias checks, two places in the pipeline</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">They answer different questions, and you want both — one cannot substitute for the other.</text><rect x="30" y="96" width="138" height="50" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="99.0" y="125.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Training data</text><line x1="168" y1="121" x2="179.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 186.0 121.0 L 177.8 124.7 L 177.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="224" y="96" width="138" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="293.0" y="125.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Train model</text><line x1="362" y1="121" x2="373.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 380.0 121.0 L 371.8 124.7 L 371.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="418" y="96" width="138" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="487.0" y="125.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Batch predict</text><line x1="556" y1="121" x2="567.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 574.0 121.0 L 565.8 124.7 L 565.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="612" y="96" width="138" height="50" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="681.0" y="125.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Deploy</text><line x1="750" y1="121" x2="761.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 768.0 121.0 L 759.8 124.7 L 759.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="782" y="96" width="134" height="50" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="8" opacity="1.0"/><text x="849.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Monitor</text><text x="849.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">drift / skew</text><line x1="746" y1="121" x2="775.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 782.0 121.0 L 773.8 124.7 L 773.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="24" y="186" width="440" height="200" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="212" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">DetectDataBiasOp</text><text x="44" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Runs BEFORE training, on the raw data and true labels.</text><line x1="99" y1="146" x2="99" y2="184" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="4 4" opacity="1.0"/><text x="44" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">Asks: is the DATA already unbalanced?</text><text x="44" y="273" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="44" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Compares slices in the data itself — group sizes,</text><text x="44" y="307" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">and the rate of positive outcomes in the TRUE labels.</text><text x="44" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="44" y="341" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Catches bias you inherited. A model trained on this</text><text x="44" y="358" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">will reproduce it however good the algorithm is.</text><rect x="476" y="186" width="440" height="200" fill="#faf5ff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="212" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">DetectModelBiasOp</text><text x="496" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Runs AFTER batch prediction, on the model&#x27;s output.</text><line x1="487" y1="146" x2="487" y2="184" stroke="#8430ce" stroke-width="1.6" stroke-dasharray="4 4" opacity="1.0"/><text x="496" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">Asks: is the MODEL treating slices differently?</text><text x="496" y="273" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="496" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Compares predicted positive rates and error rates</text><text x="496" y="307" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">across slices — e.g. Difference in Positive</text><text x="496" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Proportions in Predicted Labels, Accuracy Difference.</text><text x="496" y="341" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="496" y="358" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Catches bias the model added, or failed to correct.</text><rect x="24" y="402" width="892" height="40" fill="#188038" stroke="none" stroke-width="1" rx="8" opacity="0.12"/><text x="60" y="427" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">BiasConfig</text><text x="160" y="427" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">— both components take one. It names the SLICE FEATURE: the column whose groups you compare.</text><rect x="24" y="456" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="456" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="476" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Balanced data does not guarantee a fair model, and a biased model is not always the data&#x27;s</text><text x="40" y="492" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">fault. That is why both checks exist and why running only one leaves a real gap: the first</text><text x="40" y="508" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tells you what you inherited, the second tells you what you shipped.</text></svg>