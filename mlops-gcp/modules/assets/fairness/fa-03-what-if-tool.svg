<svg xmlns="http://www.w3.org/2000/svg" width="940" height="715" viewBox="0 0 940 715" role="img" aria-label="What-If Tool threshold optimisation across slices"><title>What-If Tool threshold optimisation across slices</title><rect width="940" height="715" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="714" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The What-If Tool: one threshold, or one per group</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The same trained model, the same scores. Only the cut-off moves - and that is the whole point.</text><rect x="24" y="80" width="440" height="250" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">SINGLE THRESHOLD  -  0.50 everywhere</text><text x="44" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Looks neutral. Is not, if the score distributions differ.</text><text x="184" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region A  hired</text><rect x="194" y="142.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="194" y="142.0" width="162.35999999999999" height="32.0" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="398" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.41</text><text x="184" y="202.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region B  hired</text><rect x="194" y="182.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="194" y="182.0" width="150.48" height="32.0" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="398" y="202.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.38</text><text x="184" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region C  hired</text><rect x="194" y="222.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="194" y="222.0" width="47.519999999999996" height="32.0" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="398" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.12</text><text x="44" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">12% vs 41% - the model is not asked to be fair, so it isn&#x27;t.</text><rect x="476" y="80" width="440" height="250" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="10" opacity="1.0"/><text x="496" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">GROUP THRESHOLDS  -  demographic parity</text><text x="496" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A: 0.52   B: 0.50   C: 0.31   -  set by the tool, not by hand.</text><text x="636" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region A  hired</text><rect x="646" y="142.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="646" y="142.0" width="118.8" height="32.0" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="850" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.30</text><text x="636" y="202.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region B  hired</text><rect x="646" y="182.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="646" y="182.0" width="118.8" height="32.0" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="850" y="202.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.30</text><text x="636" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="end" opacity="1.0">Region C  hired</text><rect x="646" y="222.0" width="198" height="32.0" fill="#f8f9fa" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="646" y="222.0" width="114.83999999999999" height="32.0" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="850" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">0.29</text><text x="496" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">Equal positive rates. No retraining, no new data.</text><text x="24" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The four tabs, and what each is actually for</text><rect x="24" y="384" width="892" height="54" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="384" width="5" height="54" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="405" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Performance &amp; Fairness</text><text x="232" y="405" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Slice by a feature, then optimise thresholds for a fairness constraint.</text><text x="44" y="425" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The only tab that changes group outcomes. Demographic parity, equal opportunity,</text><rect x="24" y="444" width="892" height="54" fill="#ffffff" stroke="#1a73e8" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="444" width="5" height="54" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="465" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Datapoint Editor</text><text x="232" y="465" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Edit one example, re-run inference, watch the prediction move.</text><text x="44" y="485" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Answers &#x27;why this person&#x27;. One row at a time - not a fix for a group-level gap.</text><rect x="24" y="504" width="892" height="54" fill="#ffffff" stroke="#1a73e8" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="504" width="5" height="54" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="525" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Counterfactuals</text><text x="232" y="525" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Find the most-similar example with the opposite prediction.</text><text x="44" y="545" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Shows what would have had to differ. Diagnostic, not a remedy.</text><rect x="24" y="564" width="892" height="54" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="564" width="5" height="54" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="585" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Partial dependence</text><text x="232" y="585" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Plot how the prediction moves as one feature varies.</text><text x="44" y="605" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Reads the model. It cannot remove a feature - the model is already trained.</text><rect x="24" y="630" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="630" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="650" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Different thresholds per group is a real technique with a real cost: two candidates with the</text><text x="40" y="666" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">same score can now get different answers because of their group. That may be defensible or</text><text x="40" y="682" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">may be illegal where you operate. The tool makes the trade-off visible; it does not make it.</text></svg>