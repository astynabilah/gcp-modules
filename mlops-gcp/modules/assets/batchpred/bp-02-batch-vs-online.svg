<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Choosing between batch and online prediction"><title>Choosing between batch and online prediction</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Batch or online — the question is who is waiting</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Not how much data. A million rows nobody is waiting for is batch; one row a user is waiting for is online.</text><rect x="24" y="80" width="440" height="250" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">BATCH PREDICTION</text><text x="44" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Nobody is blocked</text><text x="196" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">a scoring table read tomorrow morning</text><text x="44" y="168" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">No endpoint</text><text x="196" y="168" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">no machine sitting idle, no hourly bill</text><text x="44" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Input</text><text x="196" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cloud Storage JSONL / CSV, or a BigQuery table</text><text x="44" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Output</text><text x="196" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cloud Storage JSONL, or a BigQuery table</text><text x="44" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Scales by</text><text x="196" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">starting_replica_count - max is ignored</text><text x="44" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">You pay</text><text x="196" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">only for the minutes the job runs</text><rect x="476" y="80" width="440" height="250" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="10" opacity="1.0"/><text x="496" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">ONLINE PREDICTION</text><text x="496" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Someone is waiting</text><text x="648" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">a page render, an app screen, a decision</text><text x="496" y="168" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Endpoint required</text><text x="648" y="168" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">a machine is up whether called or not</text><text x="496" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Input</text><text x="648" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">one request, JSON instances</text><text x="496" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Output</text><text x="648" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the response body</text><text x="496" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Scales by</text><text x="648" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">min/max replicas on a duty-cycle target</text><text x="496" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">You pay</text><text x="648" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">per node-hour, around the clock</text><text x="24" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">And the third option people forget</text><rect x="24" y="382" width="892" height="62" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="382" width="5" height="62" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="404" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The model already lives in BigQuery</text><text x="44" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">ML.PREDICT over a table is batch scoring with no job, no export, no region to match. If the data is in BigQuery and the model is BQML, that is the batch story.</text><rect x="24" y="458" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="458" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="478" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Batch prediction is not &quot;online prediction for lots of rows&quot;. It is a different service with</text><text x="40" y="494" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">its own job resource, and it does not need an endpoint at all - which is why it costs nothing</text><text x="40" y="510" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">between runs. Deploying to an endpoint so you can loop over it is the expensive mistake.</text></svg>