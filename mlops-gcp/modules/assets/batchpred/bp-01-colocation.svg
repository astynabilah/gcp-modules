<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-label="Input, model and output must share a region or multi-region"><title>Input, model and output must share a region or multi-region</title><rect width="940" height="620" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="619" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Three things have a location, and they all have to agree</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Input data, the model, and the output destination. A job is only as fast as its worst mismatch.</text><rect x="24" y="78" width="440" height="218" fill="#fff8f7" stroke="#d93025" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">MISMATCHED</text><rect x="44" y="118" width="178" height="50" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="133.0" y="138.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Input JSONL</text><text x="133.0" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-central1</text><rect x="266" y="118" width="178" height="50" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="355.0" y="138.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Model</text><text x="355.0" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-west1</text><rect x="155" y="196" width="178" height="50" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="244.0" y="216.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Output bucket</text><text x="244.0" y="233.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-central1</text><line x1="222" y1="143" x2="259.0" y2="143.0" stroke="#d93025" stroke-width="1.6" opacity="1.0"/><path d="M 266.0 143.0 L 257.8 146.7 L 257.8 139.3 Z" fill="#d93025" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="244" y="274" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">cross-region reads on every batch — slow, and not guaranteed to work</text><rect x="476" y="78" width="440" height="218" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">COLOCATED</text><rect x="496" y="118" width="178" height="50" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="585.0" y="138.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Input JSONL</text><text x="585.0" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-west1</text><rect x="718" y="118" width="178" height="50" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="807.0" y="138.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Model</text><text x="807.0" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-west1</text><rect x="607" y="196" width="178" height="50" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="696.0" y="216.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Output bucket</text><text x="696.0" y="233.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">us-west1  or  US</text><line x1="674" y1="143" x2="711.0" y2="143.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 718.0 143.0 L 709.8 146.7 L 709.8 139.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="696" y="274" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">copy the data to the model, or re-register the model by the data</text><text x="24" y="340" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">What counts as &quot;the same place&quot;</text><rect x="24" y="356" width="896" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="356" width="896" height="106" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="373.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Model is in</text><text x="210" y="373.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Input may be in</text><line x1="200" y1="356" x2="200" y2="462" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="410" y="373.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Output may be in</text><line x1="400" y1="356" x2="400" y2="462" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="670" y="373.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Not</text><line x1="660" y1="356" x2="660" y2="462" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="384" x2="920" y2="384" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="401.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-west1</text><text x="210" y="401.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-west1</text><text x="410" y="401.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-west1  ·  US</text><text x="670" y="401.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-central1, EU, ...</text><rect x="24" y="410" width="896" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="427.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-central1</text><text x="210" y="427.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-central1</text><text x="410" y="427.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-central1  ·  US</text><text x="670" y="427.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">us-west1, europe-west4</text><line x1="24" y1="410" x2="920" y2="410" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="453.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">europe-west4</text><text x="210" y="453.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">europe-west4</text><text x="410" y="453.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">europe-west4  ·  EU</text><text x="670" y="453.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">US, us-central1</text><line x1="24" y1="436" x2="920" y2="436" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="500" width="892" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="500" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="520" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A region is inside its multi-region: a us-west1 model may write to a US bucket. The reverse</text><text x="40" y="536" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">does not hold - US is not inside us-west1 - and two regions in the same continent are still</text><text x="40" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">two regions. The global endpoint is not an escape hatch here: custom-trained models do not</text><text x="40" y="568" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">support it for batch prediction, so there is no &quot;just let Google sort it out&quot; option.</text></svg>