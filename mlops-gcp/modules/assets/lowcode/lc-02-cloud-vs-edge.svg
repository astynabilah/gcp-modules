<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="AutoML Cloud model types versus Edge model types"><title>AutoML Cloud model types versus Edge model types</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The AutoML fork you cannot undo later: Cloud or Edge</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">You choose this BEFORE training. It decides what the model can ever be deployed to.</text><rect x="392" y="78" width="156" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="104.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Labelled data</text><path d="M 470 122 C 470 144 240 142 240 164" fill="none" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 470 122 C 470 144 700 142 700 164" fill="none" stroke="#188038" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="24" y="164" width="440" height="300" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">CLOUD</text><text x="96" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">runs on Google&#x27;s machines</text><text x="44" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Model types</text><text x="44" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">CLOUD</text><text x="268" y="238" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the balanced default</text><text x="44" y="258" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">CLOUD_HIGH_ACCURACY_1</text><text x="268" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">accuracy over latency</text><text x="44" y="278" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">CLOUD_LOW_LATENCY_1</text><text x="268" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">latency over accuracy</text><text x="44" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Deployment</text><rect x="44" y="332" width="190" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="139.0" y="349.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Vertex endpoint</text><text x="139.0" y="366.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">online or batch</text><rect x="252" y="332" width="190" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="8" opacity="0.1"/><text x="347" y="352" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">Cannot be exported</text><text x="347" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#d93025" font-weight="400" text-anchor="middle" opacity="1.0">to an edge device</text><text x="44" y="404" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Choose when inference happens in your datacentre or app backend,</text><text x="44" y="420" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">and a network round trip to Google is acceptable.</text><text x="44" y="444" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Reachability, autoscaling and monitoring all come for free.</text><rect x="476" y="164" width="440" height="300" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">EDGE</text><text x="542" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">runs on YOUR device</text><text x="496" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Model types</text><text x="496" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">MOBILE_TF_VERSATILE_1</text><text x="736" y="238" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the balanced default</text><text x="496" y="258" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">MOBILE_TF_HIGH_ACCURACY_1</text><text x="736" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">accuracy over latency</text><text x="496" y="278" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">MOBILE_TF_LOW_LATENCY_1</text><text x="736" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">latency over accuracy</text><text x="496" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Deployment — export, then ship it yourself</text><text x="496" y="340" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">tflite</text><text x="632" y="340" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">phones, embedded, Coral</text><text x="496" y="357" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">edgetpu-tflite</text><text x="632" y="357" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Edge TPU</text><text x="496" y="374" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">tf-js</text><text x="632" y="374" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">browser</text><text x="496" y="391" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">tf-saved-model</text><text x="632" y="391" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">your own container</text><text x="496" y="408" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">Core ML</text><text x="632" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">iOS / macOS</text><rect x="496" y="428" width="400" height="26" fill="#d93025" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="696" y="445" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">Cannot be deployed to a Vertex AI endpoint</text><rect x="24" y="480" width="892" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="480" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="500" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The asymmetry is total and it is decided at training time: a Cloud model can never leave Google,</text><text x="40" y="516" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">and an Edge model can never be served by Google. Picking Edge and then choosing CLOUD as the</text><text x="40" y="532" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">model type — or expecting to deploy an Edge model to an endpoint — is the classic mistake, and</text><text x="40" y="548" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the only fix is to train again.</text></svg>