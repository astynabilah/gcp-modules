<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Three composable levers for class imbalance in AutoML Tabular"><title>Three composable levers for class imbalance in AutoML Tabular</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Class imbalance in AutoML Tabular - three levers, three problems</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">0.5% fraud. High accuracy, terrible recall. Each lever fixes a different part of that.</text><rect x="24" y="78" width="892" height="74" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="78" width="6" height="74" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">The symptom</text><text x="46" y="124" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A model that predicts &#x27;not fraud&#x27; for every row scores 99.5% accuracy and catches zero fraud.</text><text x="46" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Accuracy is not measuring what you care about, and neither is the default configuration.</text><rect x="28" y="168" width="290" height="316" fill="#ffffff" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="28" y="168" width="290" height="42" fill="#188038" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="28" y="202" width="290" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="44" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">1. Weight column</text><text x="302" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#188038" font-weight="700" text-anchor="end" opacity="1.0">TRAINING</text><text x="44" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Assign higher weights to the</text><text x="44" y="247" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">fraudulent rows and name that</text><text x="44" y="262" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">column as the Weight column.</text><line x1="44" y1="288" x2="302" y2="288" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="44" y="308" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The model pays more attention</text><text x="44" y="323" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">to the rare class while learning.</text><rect x="40" y="380" width="266" height="56" fill="#188038" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="52" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">Fixes: the model ignores</text><text x="52" y="414" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">the minority class.</text><rect x="330" y="168" width="290" height="316" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="330" y="168" width="290" height="42" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="330" y="202" width="290" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="346" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">2. Stratified split</text><text x="604" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#1a73e8" font-weight="700" text-anchor="end" opacity="1.0">EVALUATION</text><text x="346" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Split randomly, but preserve the</text><text x="346" y="247" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">distribution of the target column</text><text x="346" y="262" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">across train / validation / test.</text><line x1="346" y1="288" x2="604" y2="288" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="346" y="308" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A random 10% test set of 0.5%</text><text x="346" y="323" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">fraud may hold almost none.</text><rect x="342" y="380" width="266" height="56" fill="#1a73e8" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="354" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">Fixes: you cannot measure the</text><text x="354" y="414" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">thing you want to improve.</text><rect x="632" y="168" width="290" height="316" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="632" y="168" width="290" height="42" fill="#8430ce" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="632" y="202" width="290" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="648" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">3. AUC-PR objective</text><text x="906" y="188" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#8430ce" font-weight="700" text-anchor="end" opacity="1.0">OPTIMISATION</text><text x="648" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Set the optimisation objective to</text><text x="648" y="247" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">maximize-au-prc instead of the</text><text x="648" y="262" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">default AUC-ROC.</text><line x1="648" y1="288" x2="906" y2="288" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="648" y="308" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">AUC-ROC looks excellent on</text><text x="648" y="323" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">imbalanced data even when almost</text><text x="648" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">no fraud is caught.</text><rect x="644" y="380" width="266" height="56" fill="#8430ce" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="656" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">Fixes: optimising for the</text><text x="656" y="414" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">wrong target.</text><text x="470" y="462" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">these are complementary, not alternatives</text><rect x="24" y="496" width="892" height="80" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="496" width="3.5" height="80" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="516" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">An exam makes you pick one. Real fraud work uses all three, because they address different</text><text x="40" y="532" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">failure points: the weight column changes what the model learns, the stratified split changes</text><text x="40" y="548" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">what you can measure, and the objective changes what the search optimises for. Fixing only</text><text x="40" y="564" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">one leaves the other two quietly broken.</text></svg>