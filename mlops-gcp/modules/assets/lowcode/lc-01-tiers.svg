<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="Four tiers of low-code AI on Google Cloud"><title>Four tiers of low-code AI on Google Cloud</title><rect width="940" height="520" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="519" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Four tiers of low-code AI — the axis is who supplies what</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Moving right, you supply more and Google supplies less. Effort and control rise together.</text><rect x="28" y="82" width="214" height="316" fill="#ffffff" stroke="#12a4af" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="28" y="82" width="214" height="38" fill="#12a4af" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="28" y="112" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="135" y="107" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">Pretrained API</text><text x="135" y="140" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Google supplies</text><text x="135" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the model AND</text><text x="135" y="170" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the training data</text><line x1="48" y1="196" x2="222" y2="196" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="46" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Vision, Speech,</text><text x="46" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Translation,</text><text x="46" y="252" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Natural Language,</text><text x="46" y="269" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Document AI</text><rect x="42" y="306" width="186" height="46" fill="#12a4af" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="135" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="600" text-anchor="middle" opacity="1.0">You supply:</text><text x="135" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="600" text-anchor="middle" opacity="1.0">nothing but input</text><rect x="254" y="82" width="214" height="316" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="254" y="82" width="214" height="38" fill="#8430ce" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="254" y="112" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="361" y="107" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">Generative</text><text x="361" y="140" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Google supplies</text><text x="361" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the model; you</text><text x="361" y="170" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">supply the question</text><line x1="274" y1="196" x2="448" y2="196" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="272" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Gemini via</text><text x="272" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">AI.GENERATE,</text><text x="272" y="252" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Model Garden</text><rect x="268" y="306" width="186" height="46" fill="#8430ce" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="361" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="middle" opacity="1.0">You supply:</text><text x="361" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8430ce" font-weight="600" text-anchor="middle" opacity="1.0">a prompt + schema</text><rect x="480" y="82" width="214" height="316" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="480" y="82" width="214" height="38" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="480" y="112" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="587" y="107" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">AutoML</text><text x="587" y="140" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Google supplies</text><text x="587" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the architecture</text><text x="587" y="170" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">search</text><line x1="500" y1="196" x2="674" y2="196" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="498" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Tabular, image,</text><text x="498" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">text, video</text><text x="498" y="252" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cloud or Edge</text><rect x="494" y="306" width="186" height="46" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="587" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">You supply:</text><text x="587" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="600" text-anchor="middle" opacity="1.0">labelled data</text><rect x="706" y="82" width="214" height="316" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="706" y="82" width="214" height="38" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="706" y="112" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="813" y="107" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">BigQuery ML</text><text x="813" y="140" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">You pick the</text><text x="813" y="155" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">algorithm; SQL</text><text x="813" y="170" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">does the rest</text><line x1="726" y1="196" x2="900" y2="196" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="724" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">CREATE MODEL</text><text x="724" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Boosted trees,</text><text x="724" y="252" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">logistic, k-means,</text><text x="724" y="269" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">ARIMA</text><rect x="720" y="306" width="186" height="46" fill="#1a73e8" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="813" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="middle" opacity="1.0">You supply:</text><text x="813" y="338" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="600" text-anchor="middle" opacity="1.0">data + model type</text><line x1="28" y1="416" x2="916" y2="416" stroke="#5f6368" stroke-width="1.4" opacity="1.0"/><text x="28" y="436" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#12a4af" font-weight="600" text-anchor="start" opacity="1.0">less effort, less control</text><text x="916" y="436" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a73e8" font-weight="600" text-anchor="end" opacity="1.0">more effort, more control</text><rect x="24" y="452" width="892" height="48" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="452" width="3.5" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="472" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Custom training sits off the right edge of this diagram — it is not low-code at all. The habit</text><text x="40" y="488" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">worth building is to try each tier left-to-right and stop at the first one that clears the bar.</text></svg>