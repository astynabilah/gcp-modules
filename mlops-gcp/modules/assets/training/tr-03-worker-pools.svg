<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="The four worker pools of a Vertex AI custom training job"><title>The four worker pools of a Vertex AI custom training job</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">What &#x27;distributed training&#x27; looks like — up to four worker pools</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A custom training job is a set of machine groups. Each pool has a job.</text><rect x="28" y="82" width="214" height="168" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="28" y="82" width="214" height="34" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="28" y="108" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="42" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">Pool 0</text><text x="135" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Primary replica</text><text x="42" y="163" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">replica_count = 1 — always exactly one.</text><text x="42" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The chief: coordinates and usually checkpoints.</text><rect x="254" y="82" width="214" height="168" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="254" y="82" width="214" height="34" fill="#8430ce" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="254" y="108" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="268" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">Pool 1</text><text x="361" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Workers</text><text x="268" y="163" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The rest of the training machines.</text><text x="268" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">1 primary + 7 workers = 8 GPU workers.</text><rect x="480" y="82" width="214" height="168" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="480" y="82" width="214" height="34" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="480" y="108" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="494" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">Pool 2</text><text x="587" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Reduction Server</text><text x="587" y="151" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">or parameter servers</text><text x="494" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Reducers for the all-reduce step.</text><text x="494" y="193" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cheap CPU machines — bandwidth is what matters.</text><rect x="706" y="82" width="214" height="168" fill="#ffffff" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="706" y="82" width="214" height="34" fill="#188038" stroke="none" stroke-width="1" rx="10" opacity="0.14"/><rect x="706" y="108" width="214" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="720" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">Pool 3</text><text x="813" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Evaluators</text><text x="720" y="163" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Optional. Runs evaluation</text><text x="720" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">alongside training.</text><text x="24" y="288" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Reduction Server, in one sentence</text><text x="24" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">In data-parallel training every worker computes gradients, and then they all have to agree on the average.</text><text x="24" y="328" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">That all-reduce step is network-bound, not GPU-bound. Reduction Server adds cheap CPU machines whose only</text><text x="24" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">job is doing that averaging efficiently — raising throughput and cutting latency without adding a single GPU.</text><rect x="24" y="376" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="376" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="396" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Before you reach for any of this: one machine with several GPUs is simpler than several machines</text><text x="40" y="412" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">with one GPU each, and it avoids the network entirely. Scale up before you scale out. Multi-node</text><text x="40" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">is for when the model or the data genuinely will not fit on one box — not for a faster epoch.</text></svg>