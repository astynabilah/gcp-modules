<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-label="How Vertex AI passes hyperparameters and receives metrics"><title>How Vertex AI passes hyperparameters and receives metrics</title><rect width="940" height="720" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="719" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Hyperparameter tuning: two channels your code must implement</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Neither is automatic, and each has a plausible-sounding wrong answer.</text><rect x="390" y="92" width="200" height="52" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="490.0" y="113.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">HyperparameterTuningJob</text><text x="490.0" y="130.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Bayesian search</text><rect x="390" y="300" width="200" height="52" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="490.0" y="321.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">your training container</text><text x="490.0" y="338.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">one trial</text><line x1="390" y1="118" x2="300" y2="118" stroke="#188038" stroke-width="2" opacity="1.0"/><line x1="300" y1="118" x2="300" y2="326" stroke="#188038" stroke-width="2" opacity="1.0"/><line x1="300" y1="326" x2="384" y2="326" stroke="#188038" stroke-width="2" opacity="1.0"/><path d="M 390 326 L 382 320 L 382 332 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="40" y="168" width="236" height="100" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="158" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">IN: command-line arguments</text><text x="56" y="218" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">--learning-rate 0.031</text><text x="56" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">--num-layers 5</text><text x="158" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">argparse. That is the whole mechanism.</text><line x1="590" y1="326" x2="700" y2="326" stroke="#e37400" stroke-width="2" opacity="1.0"/><line x1="700" y1="326" x2="700" y2="118" stroke="#e37400" stroke-width="2" opacity="1.0"/><line x1="700" y1="118" x2="596" y2="118" stroke="#e37400" stroke-width="2" opacity="1.0"/><path d="M 590 118 L 598 112 L 598 124 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="722" y="168" width="194" height="100" fill="#fff8e6" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><text x="819" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">OUT: cloudml-hypertune</text><text x="736" y="218" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">hpt.report_hyper</text><text x="736" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">parameter_tuning_metric</text><text x="819" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">tag must match metric_spec</text><text x="24" y="396" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Four ways people expect it to work, and it does not</text><rect x="24" y="414" width="892" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="414" width="5" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="441" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Environment variables</text><text x="330" y="441" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Vertex passes hyperparameter values on the COMMAND LINE.</text><rect x="24" y="464" width="892" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="464" width="5" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="491" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">TF_CONFIG</text><text x="330" y="491" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">That is the DISTRIBUTED TRAINING cluster spec - chief, workers. Different thing.</text><rect x="24" y="514" width="892" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="514" width="5" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="541" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A config file Vertex writes per trial</text><text x="330" y="541" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">No such file is generated. Nothing appears in your container to read.</text><rect x="24" y="564" width="892" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="564" width="5" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="591" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Metrics scraped from Cloud Logging</text><text x="330" y="591" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Nothing reads your logs. cloudml-hypertune is the only channel.</text><rect x="24" y="620" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="620" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="640" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">And the container chooses itself: a proprietary library that is not pip-installable from a</text><text x="40" y="656" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">prebuilt image forces a custom one. Bake dependencies into the image rather than installing</text><text x="40" y="672" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">them at job start - install-at-runtime is a dev convenience and a production failure mode.</text></svg>