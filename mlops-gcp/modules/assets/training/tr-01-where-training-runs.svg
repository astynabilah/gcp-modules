<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Five places model training can run on Google Cloud"><title>Five places model training can run on Google Cloud</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Five places model training can actually run</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">They are not tiers of sophistication. They are different answers to &#x27;where does the compute live?&#x27;</text><rect x="24" y="78" width="892" height="82" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="78" width="6" height="82" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">BigQuery ML</text><rect x="143.6" y="92" width="91.08" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="152.6" y="105.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">CREATE MODEL</text><text x="46" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Inside the warehouse. No container, no cluster, no machine to pick.</text><text x="46" y="146" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Tabular problems on data already in BigQuery. Labs 2 and 5.</text><rect x="24" y="168" width="892" height="82" fill="#ffffff" stroke="#5f6368" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="168" width="6" height="82" fill="#5f6368" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The notebook kernel</text><rect x="204.4" y="182" width="121.53" height="20" fill="#5f6368" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="213.4" y="195.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Workbench / Colab</text><text x="46" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">On the VM your notebook is running on. Interactive, and capped by that VM.</text><text x="46" y="236" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Prototyping. Where you start, and where you should stop.</text><rect x="24" y="258" width="892" height="82" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="258" width="6" height="82" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="284" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The notebook executor</text><rect x="219.6" y="272" width="188.51999999999998" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="228.6" y="285.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">Workbench -&gt; custom training</text><text x="46" y="306" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Submits the .ipynb itself as a training job on different hardware.</text><text x="46" y="326" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Scaling up WITHOUT leaving the notebook. The bridge.</text><rect x="24" y="348" width="892" height="82" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="348" width="6" height="82" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="374" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A custom training job</text><rect x="219.6" y="362" width="164.16" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="228.6" y="375.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">CustomJob / worker pools</text><text x="46" y="396" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Your container, your machines, up to four worker pools.</text><text x="46" y="416" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Distributed training, long runs, anything reproducible.</text><rect x="24" y="438" width="892" height="82" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="438" width="6" height="82" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="464" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A pipeline step</text><rect x="174.0" y="452" width="133.70999999999998" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="183.0" y="465.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">Vertex AI Pipelines</text><text x="46" y="486" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The same custom training, wrapped as a DAG node.</text><text x="46" y="506" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">When training is one step among many. See the KFP module.</text><rect x="24" y="532" width="892" height="48" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="532" width="3.5" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The jump people find hardest is row 2 to row 4 — from &#x27;it runs in my notebook&#x27; to &#x27;it runs</text><text x="40" y="568" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">in a container somewhere else&#x27;. Row 3 exists precisely to make that jump smaller.</text></svg>