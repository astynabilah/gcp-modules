<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" role="img" aria-label="The five BigQuery ML data validation functions"><title>The five BigQuery ML data validation functions</title><rect width="940" height="660" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="659" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Five functions: two describe, three validate</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">All GA since 19 September 2024. What each one takes and what it hands back.</text><rect x="24" y="82" width="440" height="218" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">DESCRIBE  -  compute statistics</text><rect x="44" y="126" width="190" height="70" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="139.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML.DESCRIBE_DATA</text><text x="139.0" y="173.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a table or query</text><rect x="254" y="126" width="190" height="70" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="349.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">one row per column</text><text x="349.0" y="173.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">readable: nulls, min,</text><text x="349" y="186" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">max, mean, quantiles</text><line x1="234" y1="161" x2="247.0" y2="161.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 254.0 161.0 L 245.8 164.7 L 245.8 157.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="44" y="212" width="190" height="70" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="139.0" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML.TFDV_DESCRIBE</text><text x="139.0" y="259.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a table or query</text><rect x="254" y="212" width="190" height="70" fill="#fff8e6" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="349.0" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ONE JSON blob</text><text x="349.0" y="259.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a TFDV protobuf,</text><text x="349" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">not per-column rows</text><line x1="234" y1="247" x2="247.0" y2="247.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 254.0 247.0 L 245.8 250.7 L 245.8 243.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="476" y="82" width="440" height="218" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">VALIDATE  -  compare and flag</text><rect x="496" y="126" width="200" height="46" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="596.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML.VALIDATE_DATA_SKEW</text><text x="716" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">MODEL  +  serving table</text><text x="716" y="160" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">training stats live in the model</text><rect x="496" y="182" width="200" height="46" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="596.0" y="209.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML.VALIDATE_DATA_DRIFT</text><text x="716" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">two tables, no model</text><text x="716" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">any two windows of data</text><rect x="496" y="238" width="200" height="46" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="596.0" y="265.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">ML.TFDV_VALIDATE</text><text x="716" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">two JSON stats blobs</text><text x="716" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">returns an Anomalies protobuf</text><text x="24" y="336" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The output that is actually useful</text><rect x="24" y="352" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="352" width="892" height="132" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="369.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">input</text><text x="234" y="369.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">metric</text><line x1="224" y1="352" x2="224" y2="484" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="534" y="369.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">threshold</text><line x1="524" y1="352" x2="524" y2="484" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="664" y="369.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">value</text><line x1="654" y1="352" x2="654" y2="484" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="794" y="369.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">is_anomaly</text><line x1="784" y1="352" x2="784" y2="484" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="380" x2="916" y2="380" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="397.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tenure_months</text><text x="234" y="397.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">JENSEN_SHANNON_DIVERGENCE</text><text x="534" y="397.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.3</text><text x="664" y="397.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.041</text><text x="794" y="397.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">false</text><rect x="24" y="406" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="423.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">monthly_charges</text><text x="234" y="423.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">JENSEN_SHANNON_DIVERGENCE</text><text x="534" y="423.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.3</text><text x="664" y="423.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.088</text><text x="794" y="423.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">false</text><line x1="24" y1="406" x2="916" y2="406" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="449.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">contract</text><text x="234" y="449.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">L_INFTY</text><text x="534" y="449.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.2</text><text x="664" y="449.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.310</text><text x="794" y="449.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#fce8e6" font-weight="400" text-anchor="start" opacity="1.0">TRUE</text><line x1="24" y1="432" x2="916" y2="432" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="458" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="475.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">payment_method</text><text x="234" y="475.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">L_INFTY</text><text x="534" y="475.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.2</text><text x="664" y="475.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">0.052</text><text x="794" y="475.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">false</text><line x1="24" y1="458" x2="916" y2="458" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="24" y="502" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">is_anomaly is just  value &gt; threshold.  Nothing cleverer.</text><rect x="24" y="526" width="892" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="526" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="546" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">ML.TFDV_VALIDATE is the family&#x27;s odd one out: it takes POSITIONAL arguments, not a STRUCT,</text><text x="40" y="562" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">and supplying any optional argument means supplying every argument before it. Its</text><text x="40" y="578" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">detection_type accepts exactly two values - &#x27;SKEW&#x27; and &#x27;DRIFT&#x27;. There is no &#x27;STATS&#x27;.</text><text x="40" y="594" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Unless you need TFDV artifacts, the two VALIDATE_DATA_* functions give you rows instead.</text></svg>