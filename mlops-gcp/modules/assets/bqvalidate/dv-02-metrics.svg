<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Jensen-Shannon for numerical, L-infinity for categorical"><title>Jensen-Shannon for numerical, L-infinity for categorical</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Same metrics as Vertex AI Model Monitoring, reached from SQL</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Not a coincidence - the visualization links point into the same console.</text><rect x="24" y="84" width="440" height="200" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">NUMERICAL COLUMNS</text><rect x="44" y="128" width="400" height="56" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="244.0" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">JENSEN_SHANNON_DIVERGENCE</text><text x="244.0" y="168.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the only allowed value</text><text x="244" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">You cannot change it. Numerical distributions can be</text><text x="244" y="228" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">binned and ordered, so a divergence measure applies.</text><text x="244" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">default threshold  0.3</text><rect x="476" y="84" width="440" height="200" fill="#faf5ff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">CATEGORICAL COLUMNS</text><rect x="496" y="128" width="196" height="56" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="594.0" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">L_INFTY</text><text x="594.0" y="168.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the default</text><rect x="712" y="128" width="196" height="56" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="810.0" y="151.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">JENSEN_SHANNON</text><text x="810.0" y="168.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">optional override</text><text x="696" y="212" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">No order, no distance - north is not closer to south</text><text x="696" y="228" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">than to west. All you have is proportions.</text><text x="696" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="middle" opacity="1.0">default threshold  0.3</text><text x="24" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Skew or drift - the maths is identical, the baseline is not</text><rect x="40" y="348" width="210" height="60" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="145.0" y="373.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">training statistics</text><text x="145.0" y="390.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">stored in the MODEL</text><rect x="365" y="348" width="210" height="60" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="382.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">current serving data</text><rect x="690" y="348" width="210" height="60" fill="#fff8e6" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="795.0" y="373.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">an earlier window</text><text x="795.0" y="390.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">another TABLE</text><line x1="250" y1="378" x2="358.0" y2="378.0" stroke="#188038" stroke-width="1.8" opacity="1.0"/><path d="M 365.0 378.0 L 356.8 381.7 L 356.8 374.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="307.5" y="368" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">SKEW</text><line x1="690" y1="378" x2="582.0" y2="378.0" stroke="#e37400" stroke-width="1.8" opacity="1.0"/><path d="M 575.0 378.0 L 583.2 374.3 L 583.2 381.7 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="632.5" y="368" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">DRIFT</text><text x="470" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">VALIDATE_DATA_SKEW needs the model, not the training table.</text><text x="470" y="450" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">VALIDATE_DATA_DRIFT needs no model at all.</text><rect x="24" y="474" width="892" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="474" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="494" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Models created before 28 March 2024, or with WARM_START, carry no stored training</text><text x="40" y="510" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">statistics - skew detection cannot work on them and nothing can backfill it. Retrain.</text></svg>