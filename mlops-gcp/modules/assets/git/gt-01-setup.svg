<svg xmlns="http://www.w3.org/2000/svg" width="940" height="656" viewBox="0 0 940 656" role="img" aria-label="Configuring Git and SSH on a Workbench instance"><title>Configuring Git and SSH on a Workbench instance</title><rect width="940" height="656" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="655" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Workbench to GitHub over SSH — the whole setup</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Every step happens INSIDE the instance. Nothing is configured in the Google Cloud console.</text><rect x="24" y="82" width="892" height="112" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="82" width="6" height="112" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><circle cx="56" cy="110" r="14" fill="#1a73e8" stroke="none" stroke-width="1" opacity="0.16"/><text x="56" y="115" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">1</text><text x="82" y="115" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Identify yourself</text><rect x="82" y="128" width="810" height="44" fill="#f8f9fa" stroke="none" stroke-width="1" rx="5" opacity="1.0"/><text x="96" y="145" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">git config --global user.name  &quot;you&quot;</text><text x="96" y="163" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">git config --global user.email &quot;you@example.com&quot;</text><text x="82" y="186" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Without this, commits are rejected or attributed to nobody.</text><rect x="24" y="202" width="892" height="112" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="202" width="6" height="112" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><circle cx="56" cy="230" r="14" fill="#188038" stroke="none" stroke-width="1" opacity="0.16"/><text x="56" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">2</text><text x="82" y="235" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Generate a key IN the instance</text><rect x="82" y="248" width="810" height="44" fill="#f8f9fa" stroke="none" stroke-width="1" rx="5" opacity="1.0"/><text x="96" y="265" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">ssh-keygen -t ed25519 -C &quot;you@example.com&quot;</text><text x="96" y="283" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cat ~/.ssh/id_ed25519.pub</text><text x="82" y="306" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Generate it here. Do not copy a key in from your laptop or a bucket.</text><rect x="24" y="322" width="892" height="112" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="322" width="6" height="112" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><circle cx="56" cy="350" r="14" fill="#8430ce" stroke="none" stroke-width="1" opacity="0.16"/><text x="56" y="355" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">3</text><text x="82" y="355" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Add the PUBLIC key to GitHub</text><rect x="82" y="368" width="810" height="44" fill="#f8f9fa" stroke="none" stroke-width="1" rx="5" opacity="1.0"/><text x="96" y="385" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">GitHub &gt; Settings &gt; SSH and GPG keys &gt; New SSH key</text><text x="96" y="403" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">paste the contents of id_ed25519.pub</text><text x="82" y="426" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The private key never leaves the instance. Only the .pub half travels.</text><rect x="24" y="442" width="892" height="112" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="442" width="6" height="112" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><circle cx="56" cy="470" r="14" fill="#e37400" stroke="none" stroke-width="1" opacity="0.16"/><text x="56" y="475" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">4</text><text x="82" y="475" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Clone, commit, push</text><rect x="82" y="488" width="810" height="44" fill="#f8f9fa" stroke="none" stroke-width="1" rx="5" opacity="1.0"/><text x="96" y="505" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">git clone git@github.com:org/repo.git</text><text x="96" y="523" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">git add -A &amp;&amp; git commit -m &quot;...&quot; &amp;&amp; git push</text><text x="82" y="546" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Or use the preinstalled jupyterlab-git panel for the same operations.</text><rect x="24" y="566" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="566" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="586" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">There is no console-based OAuth integration between Workbench and GitHub, and third-party</text><text x="40" y="602" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">JupyterLab extensions are not supported. The jupyterlab-git extension is already installed —</text><text x="40" y="618" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">you configure credentials with ordinary git commands in the terminal.</text></svg>