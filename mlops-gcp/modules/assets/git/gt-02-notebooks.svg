<svg xmlns="http://www.w3.org/2000/svg" width="940" height="612" viewBox="0 0 940 612" role="img" aria-label="Why notebooks diff badly in Git and how to fix it"><title>Why notebooks diff badly in Git and how to fix it</title><rect width="940" height="612" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="611" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why notebooks are bad in Git — and the three fixes</text><rect x="24" y="62" width="892" height="128" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="86" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">THE PROBLEM</text><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A .ipynb file is JSON, not code. One changed cell can produce a thousand-line diff.</text><text x="44" y="132" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">- Outputs are stored in the file - images become base64 blobs, dataframes become HTML.</text><text x="44" y="147" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">- Execution counts change on every run, so the file is dirty even when the code is not.</text><text x="44" y="162" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">- Merge conflicts land inside JSON and are close to unresolvable by hand.</text><text x="44" y="177" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">- Anything printed is committed - including tokens, connection strings and customer rows.</text><rect x="24" y="208" width="892" height="100" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="208" width="6" height="100" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="234" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nbstripout</text><rect x="160" y="222" width="158.07" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="169" y="235.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">strip outputs on commit</text><text x="46" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A git filter that removes output cells as you commit.</text><text x="46" y="273" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The notebook keeps its outputs locally; the repo only ever sees code.</text><rect x="46" y="282" width="846" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><text x="58" y="296" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">pip install nbstripout &amp;&amp; nbstripout --install</text><rect x="24" y="316" width="892" height="100" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="316" width="6" height="100" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="342" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">jupytext</text><rect x="160" y="330" width="145.89" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="169" y="343.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">pair with a text file</text><text x="46" y="364" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Keeps a .py or .md twin in sync with the notebook.</text><text x="46" y="381" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">You commit the readable twin and can ignore the .ipynb entirely.</text><rect x="46" y="390" width="846" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><text x="58" y="404" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">jupytext --set-formats ipynb,py:percent notebook.ipynb</text><rect x="24" y="424" width="892" height="100" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="424" width="6" height="100" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="450" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nbdime</text><rect x="160" y="438" width="158.07" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="169" y="451.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">diff notebooks properly</text><text x="46" y="472" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Notebook-aware diff and merge, cell by cell.</text><text x="46" y="489" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Use when you must keep outputs and still review changes.</text><rect x="46" y="498" width="846" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><text x="58" y="512" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">pip install nbdime &amp;&amp; nbdime config-git --enable</text><rect x="24" y="536" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="536" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="556" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The strongest habit is not a tool: keep the real logic OUT of notebooks. SQL in .sql files,</text><text x="40" y="572" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">transforms in .py modules, notebooks as thin drivers. Then the notebook diff barely matters</text><text x="40" y="588" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">because the notebook barely matters.</text></svg>