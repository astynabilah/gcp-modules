<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Health checks on VM backends versus serverless NEG backends"><title>Health checks on VM backends versus serverless NEG backends</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Health checks — and why serverless backends do not have them</text><rect x="24" y="66" width="440" height="330" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">VM / INSTANCE GROUP BACKENDS</text><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">You run the machines, so you prove they are alive.</text><rect x="44" y="126" width="150" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="119.0" y="146.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Health checker</text><text x="119.0" y="163.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Google probes</text><rect x="292" y="126" width="150" height="50" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="367.0" y="146.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Your VM</text><text x="367.0" y="163.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">port 8080 /healthz</text><line x1="194" y1="151" x2="285.0" y2="151.0" stroke="#1a73e8" stroke-width="1.6" opacity="1.0"/><path d="M 292.0 151.0 L 283.8 154.7 L 283.8 147.3 Z" fill="#1a73e8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="243" y="143" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9" fill="#5f6368" font-weight="500" text-anchor="middle" opacity="1.0">every 10s</text><rect x="44" y="194" width="398" height="62" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><text x="60" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">You MUST allow the probe ranges in your firewall:</text><text x="60" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">35.191.0.0/16     130.211.0.0/22</text><text x="44" y="282" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Forget the firewall rule and every backend reads as</text><text x="44" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">UNHEALTHY — the implied-deny rule silently blocks the</text><text x="44" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">probes. This is the classic &#x27;my load balancer is broken&#x27;</text><text x="44" y="333" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">and it is the reason those two ranges are worth memorising.</text><rect x="476" y="66" width="440" height="330" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="10" opacity="1.0"/><text x="496" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">SERVERLESS NEG BACKENDS</text><text x="496" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cloud Run, Cloud Run functions, App Engine.</text><rect x="496" y="126" width="150" height="50" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="571.0" y="146.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Health checker</text><text x="571.0" y="163.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">not used</text><rect x="744" y="126" width="150" height="50" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="819.0" y="146.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud Run</text><text x="819.0" y="163.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Google runs it</text><line x1="646" y1="151" x2="744" y2="151" stroke="#d93025" stroke-width="1.8" stroke-dasharray="5 4" opacity="1.0"/><circle cx="695" cy="151" r="13" fill="#ffffff" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="688" y1="144" x2="702" y2="158" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="702" y1="144" x2="688" y2="158" stroke="#d93025" stroke-width="2" opacity="1.0"/><rect x="496" y="194" width="398" height="62" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="512" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">Health checks are NOT SUPPORTED here.</text><text x="512" y="238" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">No firewall rule needed either — there is no VM to protect.</text><text x="496" y="282" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Google already manages the health of the underlying</text><text x="496" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">infrastructure. Attaching a health check to a backend</text><text x="496" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">service with serverless NEGs is a configuration error,</text><text x="496" y="333" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">not a safety net. Omit it.</text><rect x="24" y="412" width="892" height="80" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="412" width="3.5" height="80" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="432" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">If you still want per-backend failure handling on serverless, the feature is OUTLIER DETECTION,</text><text x="40" y="448" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">not health checks: it watches real request outcomes and steers new requests away from a</text><text x="40" y="464" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">misbehaving backend. Available on the global external ALB and the cross-region internal ALB —</text><text x="40" y="480" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">not on the classic Application Load Balancer.</text></svg>