<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="The path of a prediction request"><title>The path of a prediction request</title><rect width="940" height="470" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="469" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">What actually happens when someone calls your model</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Five steps. If you know only this diagram, most of the rest follows.</text><rect x="30" y="92" width="156" height="58" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="108.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Your app</text><text x="108.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">POST predict.acme.com</text><line x1="186" y1="121" x2="201.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 208.0 121.0 L 199.8 124.7 L 199.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="208" y="92" width="156" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="286.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">DNS</text><text x="286.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">name -&gt; IP address</text><line x1="364" y1="121" x2="379.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 386.0 121.0 L 377.8 124.7 L 377.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="386" y="92" width="156" height="58" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="464.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Anycast IP</text><text x="464.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">one IP, many locations</text><line x1="542" y1="121" x2="557.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 564.0 121.0 L 555.8 124.7 L 555.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="564" y="92" width="156" height="58" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="8" opacity="1.0"/><text x="642.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Google edge</text><text x="642.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">nearest of 180+ POPs</text><line x1="720" y1="121" x2="735.0" y2="121.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 742.0 121.0 L 733.8 124.7 L 733.8 117.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="742" y="92" width="156" height="58" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="820.0" y="116.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Load balancer</text><text x="820.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">picks a backend</text><text x="30" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">…then the load balancer forwards to whichever backend is closest and healthy:</text><rect x="180" y="214" width="240" height="66" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="300.0" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud Run — us-central1</text><text x="300.0" y="259.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">serving your model</text><rect x="520" y="214" width="240" height="66" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="640.0" y="242.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud Run — europe-west1</text><text x="640.0" y="259.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">same container, other region</text><path d="M 470 150 C 470 180 300 184 300 212" fill="none" stroke="#188038" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 470 150 C 470 180 640 184 640 212" fill="none" stroke="#188038" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" opacity="1.0"/><text x="300" y="300" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a user in Chicago lands here</text><text x="640" y="300" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a user in Berlin lands here</text><rect x="24" y="326" width="892" height="80" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="326" width="3.5" height="80" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The single most counter-intuitive part: there is ONE IP address, and it is announced from</text><text x="40" y="362" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">every Google edge location at once. Your user does not choose a region and neither do you —</text><text x="40" y="378" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the internet&#x27;s own routing delivers them to the nearest edge, and Google carries it from</text><text x="40" y="394" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">there. That is why &#x27;route to the closest region&#x27; needs no code and no DNS trickery.</text></svg>