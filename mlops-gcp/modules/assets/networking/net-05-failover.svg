<svg xmlns="http://www.w3.org/2000/svg" width="940" height="790" viewBox="0 0 940 790" role="img" aria-label="Active-active versus active-passive load balancing"><title>Active-active versus active-passive load balancing</title><rect width="940" height="790" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="789" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Active-active and active-passive are different architectures</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">One load balancer cannot do both. Read the requirement before you pick the shape.</text><rect x="24" y="82" width="440" height="246" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">ACTIVE-ACTIVE  -  route everyone to their nearest</text><rect x="44" y="128" width="180" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="134.0" y="154.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">one anycast IP</text><rect x="44" y="186" width="180" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="134.0" y="212.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">global external ALB</text><rect x="44" y="244" width="180" height="44" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="134.0" y="270.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Premium Tier</text><rect x="268" y="142" width="172" height="40" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="354.0" y="166.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">us-east1</text><rect x="268" y="194" width="172" height="40" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="354.0" y="218.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">us-west1</text><rect x="268" y="246" width="172" height="40" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="354.0" y="270.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">asia-east1</text><path d="M 224 208 C 246 208 248 162 268 162" fill="none" stroke="#188038" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 224 208 C 246 208 248 214 268 214" fill="none" stroke="#188038" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 224 208 C 246 208 248 266 268 266" fill="none" stroke="#188038" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="244" y="312" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">all serving, all the time</text><rect x="476" y="82" width="440" height="246" fill="#faf5ff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">ACTIVE-PASSIVE  -  use this one unless it is gone</text><rect x="496" y="128" width="180" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="586.0" y="154.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud DNS record</text><rect x="496" y="186" width="180" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="586.0" y="212.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">failover policy</text><rect x="496" y="244" width="180" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="586.0" y="270.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">health check</text><rect x="720" y="150" width="180" height="44" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="810.0" y="176.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">PRIMARY  us-east1</text><rect x="720" y="224" width="180" height="44" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="810.0" y="250.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BACKUP  us-west1</text><path d="M 676 208 C 700 208 700 172 720 172" fill="none" stroke="#188038" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 676 208 C 700 208 700 246 720 246" fill="none" stroke="#bdc1c6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" opacity="1.0"/><text x="810" y="292" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">idle until the primary fails</text><text x="696" y="312" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">regional external ALBs - only these can be a backup</text><text x="24" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Three constraints on the failover setup</text><rect x="24" y="384" width="892" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="384" width="5" height="52" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="406" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Only regional external ALBs can be the BACKUP</text><text x="44" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The primary may be global, regional or classic. The standby target must be regional.</text><rect x="24" y="444" width="892" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="444" width="5" height="52" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The health check needs EXACTLY three source regions</text><text x="44" y="484" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Three vantage points separate a real regional outage from one unlucky probe path.</text><rect x="24" y="504" width="892" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="504" width="5" height="52" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="526" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Failover is not instant</text><text x="44" y="544" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">outage  =  DNS TTL  +  (check interval x unhealthy threshold).  Set TTL to 30-60s.</text><text x="24" y="588" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">And what does NOT give you active-passive</text><rect x="24" y="604" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="604" width="892" height="158" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="621.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Reached for</text><text x="280" y="621.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">What it really does</text><line x1="270" y1="604" x2="270" y2="762" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="632" x2="916" y2="632" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="649.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">capacityScaler = 0</text><text x="280" y="649.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">removes the backend entirely - nothing left to fail over to</text><rect x="24" y="658" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="675.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">outlier detection</text><text x="280" y="675.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">active-active: steers away from backends returning errors</text><line x1="24" y1="658" x2="916" y2="658" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="701.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">STRICT traffic isolation</text><text x="280" y="701.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the opposite - blocks cross-region failover, requests just fail</text><line x1="24" y1="684" x2="916" y2="684" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="710" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="727.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cross-region internal ALB</text><text x="280" y="727.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">internal only - external client traffic never reaches it</text><line x1="24" y1="710" x2="916" y2="710" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="753.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cloud DNS geolocation</text><text x="280" y="753.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">active-active: routes by where the client is, not by preference</text><line x1="24" y1="736" x2="916" y2="736" stroke="#dadce0" stroke-width="1" opacity="0.55"/></svg>