<svg xmlns="http://www.w3.org/2000/svg" width="940" height="556" viewBox="0 0 940 556" role="img" aria-label="How to decode Google Cloud load balancer names"><title>How to decode Google Cloud load balancer names</title><rect width="940" height="556" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="555" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Decoding the load balancer names — three questions, one name</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Every Google Cloud load balancer name is these three answers concatenated.</text><rect x="24" y="82" width="892" height="112" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="82" width="6" height="112" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">1. How far?</text><text x="200" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Global</text><text x="360" y="128" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">one IP worldwide, routes to nearest region</text><text x="200" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Regional</text><text x="360" y="154" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">lives in one region only</text><text x="200" y="180" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cross-region</text><text x="360" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">internal, but spans regions</text><rect x="24" y="204" width="892" height="86" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="204" width="6" height="86" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="228" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">2. Who reaches it?</text><text x="200" y="250" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">External</text><text x="360" y="250" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">reachable from the internet</text><text x="200" y="276" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Internal</text><text x="360" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">reachable only inside your VPC</text><rect x="24" y="300" width="892" height="86" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="300" width="6" height="86" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">3. What layer?</text><text x="200" y="346" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Application (L7)</text><text x="360" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">understands HTTP: paths, headers, TLS</text><text x="200" y="372" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Network (L4)</text><text x="360" y="372" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">just moves packets: TCP/UDP, faster, dumber</text><text x="24" y="418" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">So the one you want for a multi-region Cloud Run model:</text><rect x="24" y="428" width="892" height="40" fill="#188038" stroke="none" stroke-width="1" rx="8" opacity="0.13"/><text x="46" y="454" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="14" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">global   external   Application Load Balancer</text><text x="600" y="454" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">= one worldwide IP, public, HTTP-aware</text><rect x="24" y="484" width="892" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="484" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="504" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Serverless NEGs work only with Application Load Balancers — never with Network Load Balancers,</text><text x="40" y="520" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">proxy or passthrough. If a tutorial has you attaching Cloud Run to an NLB, it is wrong.</text></svg>