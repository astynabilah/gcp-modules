<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="The five objects of a global external ALB"><title>The five objects of a global external ALB</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">A load balancer is not one object — it is five, chained</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">You create them in this order, and each one points at the next.</text><rect x="30" y="92" width="156" height="96" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="9" opacity="1.0"/><rect x="30" y="92" width="156" height="30" fill="#1a73e8" stroke="none" stroke-width="1" rx="9" opacity="0.14"/><rect x="30" y="114" width="156" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="108" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Forwarding rule</text><text x="108" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the IP + port</text><text x="108" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">34.120.0.5:443</text><line x1="186" y1="140" x2="201.0" y2="140.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 208.0 140.0 L 199.8 143.7 L 199.8 136.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="208" y="92" width="156" height="96" fill="#ffffff" stroke="#8430ce" stroke-width="1.6" rx="9" opacity="1.0"/><rect x="208" y="92" width="156" height="30" fill="#8430ce" stroke="none" stroke-width="1" rx="9" opacity="0.14"/><rect x="208" y="114" width="156" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="286" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Target proxy</text><text x="286" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">terminates TLS</text><text x="286" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">holds the certificate</text><line x1="364" y1="140" x2="379.0" y2="140.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 386.0 140.0 L 377.8 143.7 L 377.8 136.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="386" y="92" width="156" height="96" fill="#ffffff" stroke="#12a4af" stroke-width="1.6" rx="9" opacity="1.0"/><rect x="386" y="92" width="156" height="30" fill="#12a4af" stroke="none" stroke-width="1" rx="9" opacity="0.14"/><rect x="386" y="114" width="156" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="464" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">URL map</text><text x="464" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">routing rules</text><text x="464" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">/predict -&gt; which backend</text><line x1="542" y1="140" x2="557.0" y2="140.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 564.0 140.0 L 555.8 143.7 L 555.8 136.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="564" y="92" width="156" height="96" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="9" opacity="1.0"/><rect x="564" y="92" width="156" height="30" fill="#e37400" stroke="none" stroke-width="1" rx="9" opacity="0.14"/><rect x="564" y="114" width="156" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="642" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Backend service</text><text x="642" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the policy: timeouts,</text><text x="642" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">CDN, Cloud Armor</text><line x1="720" y1="140" x2="735.0" y2="140.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 742.0 140.0 L 733.8 143.7 L 733.8 136.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="742" y="92" width="156" height="96" fill="#ffffff" stroke="#188038" stroke-width="1.6" rx="9" opacity="1.0"/><rect x="742" y="92" width="156" height="30" fill="#188038" stroke="none" stroke-width="1" rx="9" opacity="0.14"/><rect x="742" y="114" width="156" height="8" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="820" y="112" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="600" text-anchor="middle" opacity="1.0">Backend (NEG)</text><text x="820" y="144" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the actual thing</text><text x="820" y="159" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">that serves</text><text x="30" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">The mental shortcut</text><text x="30" y="254" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">Forwarding rule</text><text x="196" y="254" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">WHERE clients connect — the front door&#x27;s address</text><text x="30" y="276" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">Target proxy</text><text x="196" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">WHAT protocol, and who holds the TLS certificate</text><text x="30" y="298" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">URL map</text><text x="196" y="298" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">WHICH backend, based on host and path</text><text x="30" y="320" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">Backend service</text><text x="196" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">HOW to treat the traffic — timeout, CDN, WAF, session affinity</text><text x="30" y="342" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">Backend / NEG</text><text x="196" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">WHO actually answers</text><rect x="24" y="380" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="380" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">This is why a &#x27;simple&#x27; load balancer takes five gcloud commands, and why error messages name</text><text x="40" y="416" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">objects you did not know existed. Nothing here is optional — the chain is the load balancer.</text><text x="40" y="432" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Read an error like &#x27;backend service X has no health check&#x27; by finding X in this chain first.</text></svg>