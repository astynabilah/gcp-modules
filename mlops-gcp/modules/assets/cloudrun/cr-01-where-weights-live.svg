<svg xmlns="http://www.w3.org/2000/svg" width="940" height="664" viewBox="0 0 940 664" role="img" aria-label="Four places to store model weights for Cloud Run"><title>Four places to store model weights for Cloud Run</title><rect width="940" height="664" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="663" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Four places model weights can live — and the size threshold that decides</text><rect x="24" y="62" width="892" height="118" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="62" width="6" height="118" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">In the container image</text><rect x="716" y="77" width="103.25999999999999" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="725" y="90.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">GOOD  &lt; ~10 GB</text><text x="46" y="114" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Weights are baked into the image and materialised by Cloud Run&#x27;s optimised</text><text x="46" y="133" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">CONTAINER STREAMING infrastructure — no separate download step at all.</text><text x="46" y="158" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cost: rebuild the image to change the model; copies pile up in Artifact Registry.</text><rect x="24" y="188" width="892" height="118" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="188" width="6" height="118" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="216" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Cloud Storage via SDK / CLI</text><rect x="716" y="203" width="115.44" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="725" y="216.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">GOOGLE&#x27;S DEFAULT</text><text x="46" y="240" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Downloaded during container startup, using Google&#x27;s network optimisations.</text><text x="46" y="259" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">One copy of the model, decoupled from the image. Scales past image limits.</text><text x="46" y="284" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cost: a real download on every cold start; you own the retry logic.</text><rect x="24" y="314" width="892" height="118" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="314" width="6" height="118" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Cloud Storage FUSE mount</text><rect x="716" y="329" width="72.81" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="725" y="342.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">SOMETIMES</text><text x="46" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Mounted as a volume; no Dockerfile changes. Supports file caching via</text><text x="46" y="385" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cache-dir on an in-memory volume, and enable-buffered-read for prefetch.</text><text x="46" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cost: FUSE overhead; lazy first-read means the first user pays.</text><rect x="24" y="440" width="892" height="118" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="440" width="6" height="118" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="468" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Internet (e.g. a model hub)</text><rect x="716" y="455" width="48.45" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="725" y="468.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">AVOID</text><text x="46" y="492" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Downloaded from outside Google Cloud on every cold start.</text><text x="46" y="511" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Slowest and least reliable; an external dependency in your startup path.</text><text x="46" y="536" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Cost: someone else&#x27;s uptime is now your uptime.</text><rect x="24" y="572" width="892" height="80" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="572" width="3.5" height="80" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="592" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The discriminator is SIZE, not preference. Under ~10 GB the image path wins because container</text><text x="40" y="608" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">streaming removes the download entirely. Past that, image pull and registry overhead become the</text><text x="40" y="624" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">bottleneck and streaming weights from Cloud Storage is the better trade. A 2 GB BERT model sits</text><text x="40" y="640" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">comfortably in the first case.</text></svg>