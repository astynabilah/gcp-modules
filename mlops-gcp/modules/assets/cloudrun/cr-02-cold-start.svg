<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" role="img" aria-label="The stages of a Cloud Run cold start and what shortens each"><title>The stages of a Cloud Run cold start and what shortens each</title><rect width="940" height="540" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="539" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Anatomy of a cold start — and which stage each option attacks</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A request arrives with no warm instance. Everything below happens before it gets an answer.</text><rect x="28" y="92" width="134" height="56" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="95.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Schedule</text><text x="95.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">find capacity</text><line x1="162" y1="120" x2="169.0" y2="120.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 176.0 120.0 L 167.8 123.7 L 167.8 116.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="176" y="92" width="134" height="56" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="243.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Pull image</text><text x="243.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">container streaming</text><line x1="310" y1="120" x2="317.0" y2="120.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 324.0 120.0 L 315.8 123.7 L 315.8 116.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="324" y="92" width="134" height="56" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="391.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Start process</text><text x="391.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">python, imports</text><line x1="458" y1="120" x2="465.0" y2="120.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 472.0 120.0 L 463.8 123.7 L 463.8 116.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="472" y="92" width="134" height="56" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="539.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Get weights</text><text x="539.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the variable part</text><line x1="606" y1="120" x2="613.0" y2="120.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 620.0 120.0 L 611.8 123.7 L 611.8 116.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="620" y="92" width="134" height="56" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="687.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Load to memory</text><text x="687.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">deserialise</text><line x1="754" y1="120" x2="761.0" y2="120.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 768.0 120.0 L 759.8 123.7 L 759.8 116.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="768" y="92" width="134" height="56" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="8" opacity="1.0"/><text x="835.0" y="115.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Serve</text><text x="835.0" y="132.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">finally</text><rect x="472" y="168" width="148" height="26" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.18"/><text x="546" y="186" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">this is the one</text><text x="546" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">you actually control</text><text x="24" y="250" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">What each lever does</text><rect x="24" y="264" width="4" height="18" fill="#188038" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Weights in the image</text><text x="250" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Removes the &#x27;get weights&#x27; stage entirely - it arrives with the image.</text><rect x="24" y="290" width="4" height="18" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="302" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Startup CPU boost</text><text x="250" y="302" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">More CPU during startup only. Helps the process-start and load stages.</text><rect x="24" y="316" width="4" height="18" fill="#8430ce" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="328" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">min instances &gt; 0</text><text x="250" y="328" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Keeps warm instances so some requests never cold-start at all. Costs money when idle.</text><rect x="24" y="342" width="4" height="18" fill="#12a4af" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="354" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Concurrency</text><text x="250" y="354" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Higher concurrency means fewer instances for the same traffic - so fewer cold starts.</text><rect x="24" y="368" width="4" height="18" fill="#e37400" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="380" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Smaller weights</text><text x="250" y="380" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Quantisation and formats like safetensors cut both transfer and deserialise time.</text><rect x="24" y="418" width="892" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="8" opacity="0.1"/><text x="44" y="438" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">Lazy-loading on first request does not reduce cold start.</text><text x="44" y="454" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">It moves the cost onto the first user, who now waits for the whole model load inside their request.</text><rect x="24" y="474" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="474" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="494" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cold start is not one number you tune - it is a sequence, and each lever shortens a different</text><text x="40" y="510" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">part of it. Measure which stage dominates before optimising the wrong one.</text></svg>