<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" role="img" aria-label="Prompting, few-shot, RAG and fine-tuning in order of cost"><title>Prompting, few-shot, RAG and fine-tuning in order of cost</title><rect width="940" height="580" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="579" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Tuning is the fourth thing to try, not the first</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Each rung costs more and is harder to undo. Stop at the first one that works.</text><rect x="24" y="88" width="892" height="62" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="88" width="5" height="62" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="114" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">1.  Prompt engineering</text><text x="46" y="134" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">changes the instruction</text><rect x="700" y="108" width="48.45" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="709" y="121.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">~free</text><rect x="24" y="160" width="892" height="62" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="160" width="5" height="62" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="186" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">2.  Few-shot prompting</text><text x="46" y="206" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">changes the examples in the prompt</text><rect x="700" y="180" width="54.54" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="709" y="193.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">tokens</text><rect x="24" y="232" width="892" height="62" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="232" width="5" height="62" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">3.  RAG / grounding</text><text x="46" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">changes what the model can SEE</text><rect x="700" y="252" width="109.35" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="709" y="265.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">retrieval infra</text><rect x="24" y="304" width="892" height="62" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="304" width="5" height="62" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="330" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">4.  Supervised fine-tuning</text><text x="46" y="350" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">changes the model&#x27;s WEIGHTS</text><rect x="700" y="324" width="151.98" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="709" y="337.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">a tuning job + serving</text><text x="24" y="402" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The question that tells you which one you need</text><rect x="24" y="418" width="440" height="92" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="244" y="444" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">Missing FACTS?</text><text x="244" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">your catalogue, this quarter&#x27;s policy, the wiki</text><text x="244" y="488" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">-&gt; that is RETRIEVAL. Tuning stores facts badly.</text><rect x="476" y="418" width="440" height="92" fill="#faf5ff" stroke="#8430ce" stroke-width="1.4" rx="8" opacity="1.0"/><text x="696" y="444" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">Missing BEHAVIOUR?</text><text x="696" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">house tone, rigid structure, refusal patterns</text><text x="696" y="488" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">-&gt; that is what TUNING is for.</text></svg>