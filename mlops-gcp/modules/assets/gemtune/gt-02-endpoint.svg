<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="Tuned Gemini models deploy only to shared public endpoints"><title>Tuned Gemini models deploy only to shared public endpoints</title><rect width="940" height="520" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="519" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">A tuned Gemini model gets exactly one endpoint type</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The instinct - make it private - is good architecture and an unsupported configuration.</text><rect x="24" y="84" width="892" height="60" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="84" width="5" height="60" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Shared public endpoint</text><rect x="300" y="98" width="72.81" height="20" fill="#e6f4ea" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="309" y="111.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">SUPPORTED</text><text x="46" y="130" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The only target. Tuning deploys here automatically when the job finishes.</text><rect x="24" y="152" width="892" height="60" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="152" width="5" height="60" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Dedicated public endpoint</text><rect x="300" y="166" width="97.17" height="20" fill="#fce8e6" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="309" y="179.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">not supported</text><text x="46" y="198" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Higher limits and gRPC for custom-trained models. Not for tuned Gemini.</text><rect x="24" y="220" width="892" height="60" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="220" width="5" height="60" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="246" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Private Service Connect</text><rect x="300" y="234" width="97.17" height="20" fill="#fce8e6" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="309" y="247.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">not supported</text><text x="46" y="266" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The normal private answer, with a projectAllowlist. Refused for tuned Gemini.</text><rect x="24" y="288" width="892" height="60" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="288" width="5" height="60" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="314" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Private services access</text><rect x="300" y="302" width="97.17" height="20" fill="#fce8e6" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="309" y="315.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">not supported</text><text x="46" y="334" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The older VPC Network Peering path. Also refused.</text><text x="24" y="382" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">So the corporate-network requirement is met differently</text><rect x="40" y="398" width="250" height="56" fill="#fff8e6" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="165.0" y="421.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Shared public endpoint</text><text x="165.0" y="438.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the only option</text><rect x="350" y="398" width="250" height="56" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="475.0" y="421.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">VPC Service Controls</text><text x="475.0" y="438.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">perimeter</text><rect x="660" y="398" width="240" height="56" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="780.0" y="421.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Access level</text><text x="780.0" y="438.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">corporate IP ranges</text><line x1="290" y1="426" x2="343.0" y2="426.0" stroke="#bdc1c6" stroke-width="1.5" opacity="1.0"/><path d="M 350.0 426.0 L 341.8 429.7 L 341.8 422.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="600" y1="426" x2="653.0" y2="426.0" stroke="#bdc1c6" stroke-width="1.5" opacity="1.0"/><path d="M 660.0 426.0 L 651.8 429.7 L 651.8 422.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="470" y="480" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">public in name, unusable from anywhere but your network</text><text x="470" y="498" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">and IAP is not an option - it does not front Vertex endpoints</text></svg>