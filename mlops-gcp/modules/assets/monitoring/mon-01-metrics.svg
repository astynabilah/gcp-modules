<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Jensen-Shannon for numerical features, L-infinity for categorical"><title>Jensen-Shannon for numerical features, L-infinity for categorical</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Two feature types, two distance metrics</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">This is the single most-tested fact about Model Monitoring — and it is not arbitrary.</text><rect x="24" y="78" width="440" height="360" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="24" y="78" width="440" height="46" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="24" y="114" width="440" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="44" y="100" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">NUMERICAL</text><text x="130" y="100" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">age, income, monthly_charges</text><text x="44" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Jensen-Shannon divergence</text><line x1="60" y1="294" x2="432" y2="294" stroke="#5f6368" stroke-width="1.3" opacity="1.0"/><path d