.9 L 78.6 293.9 L 84.8 293.8 L 91.0 293.7 L 97.2 293.6 L 103.4 293.4 L 109.6 293.2 L 115.8 292.9 L 122.0 292.4 L 128.2 291.9 L 134.4 291.1 L 140.6 290.1 L 146.8 288.9 L 153.0 287.3 L 159.2 285.4 L 165.4 283.1 L 171.6 280.3 L 177.8 277.0 L 184.0 273.1 L 190.2 268.7 L 196.4 263.7 L 202.6 258.2 L 208.8 252.3 L 215.0 245.9 L 221.2 239.3 L 227.4 232.4 L 233.6 225.6 L 239.8 219.0 L 246.0 212.7 L 252.2 207.0 L 258.4 202.1 L 264.6 198.0 L 270.8 195.0 L 277.0 193.1 L 283.2 192.5 L 289.4 193.1 L 295.6 195.0 L 301.8 198.0 L 308.0 202.1 L 314.2 207.0 L 320.4 212.7 L 326.6 219.0 L 332.8 225.6 L 339.0 232.4 L 345.2 239.3 L 351.4 245.9 L 357.6 252.3 L 363.8 258.2 L 370.0 263.7 L 376.2 268.7 L 382.4 273.1 L 388.6 277.0 L 394.8 280.3 L 401.0 283.1 L 407.2 285.4 L 413.4 287.3 L 419.6 288.9 L 425.8 290.1 L 432.0 291.1 L 432.0 294.0 L 60.0 294.0 Z" fill="#d93025" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/><path d="M 60.0 294.0 L 66.2 293.9 L 72.4 293.9 L 78.6 293.9 L 84.8 293.8 L 91.0 293.7 L 97.2 293.6 L 103.4 293.4 L 109.6 293.2 L 115.8 292.9 L 122.0 292.4 L 128.2 291.9 L 134.4 291.1 L 140.6 290.1 L 146.8 288.9 L 153.0 287.3 L 159.2 285.4 L 165.4 283.1 L 171.6 280.3 L 177.8 277.0 L 184.0 273.1 L 190.2 268.7 L 196.4 263.7 L 202.6 258.2 L 208.8 252.3 L 215.0 245.9 L 221.2 239.3 L 227.4 232.4 L 233.6 225.6 L 239.8 219.0 L 246.0 212.7 L 252.2 207.0 L 258.4 202.1 L 264.6 198.0 L 270.8 195.0 L 277.0 193.1 L 283.2 192.5 L 289.4 193.1 L 295.6 195.0 L 301.8 198.0 L 308.0 202.1 L 314.2 207.0 L 320.4 212.7 L 326.6 219.0 L 332.8 225.6 L 339.0 232.4 L 345.2 239.3 L 351.4 245.9 L 357.6 252.3 L 363.8 258.2 L 370.0 263.7 L 376.2 268.7 L 382.4 273.1 L 388.6 277.0 L 394.8 280.3 L 401.0 283.1 L 407.2 285.4 L 413.4 287.3 L 419.6 288.9 L 425.8 290.1 L 432.0 291.1" fill="none" stroke="#d93025" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="60" y="306" width="11" height="11" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="78" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">training distribution</text><rect x="220" y="306" width="11" height="11" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="238" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">serving distribution</text><text x="44" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Values are binned into a histogram, then the two</text><text x="44" y="359" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">distributions are compared as a whole.</text><text x="44" y="376" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Bounded 0–1, symmetric, and defined even where one</text><text x="44" y="393" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">distribution has zero mass — which is why it is used</text><text x="44" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">here and plain KL divergence is not.</text><rect x="44" y="430" width="400" height="0.1" fill="none" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="476" y="78" width="440" height="360" fill="#ffffff" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><rect x="476" y="78" width="440" height="46" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.13"/><rect x="476" y="114" width="440" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="496" y="100" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">CATEGORICAL</text><text x="596" y="100" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">region, product_category, contract</text><text x="496" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">L-infinity distance</text><line x1="504" y1="284" x2="888" y2="284" stroke="#5f6368" stroke-width="1.3" opacity="1.0"/><rect x="512" y="212.0" width="28" height="72.0" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="544" y="221.6" width="28" height="62.400000000000006" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="542" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">north</text><rect x="608" y="224.0" width="28" height="60.0" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="640" y="233.6" width="28" height="50.4" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="638" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">south</text><rect x="704" y="216.8" width="28" height="67.2" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="736" y="255.2" width="28" height="28.799999999999997" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="734" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">east</text><rect x="800" y="243.2" width="28" height="40.800000000000004" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><rect x="832" y="185.60000000000002" width="28" height="98.39999999999998" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="830" y="299" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">west</text><line x1="868" y1="243.2" x2="868" y2="185.60000000000002" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="864" y1="243.2" x2="872" y2="243.2" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="864" y1="185.60000000000002" x2="872" y2="185.60000000000002" stroke="#d93025" stroke-width="2" opacity="1.0"/><text x="876" y="218.4" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">0.24</text><rect x="512" y="306" width="11" height="11" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="530" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">training share</text><rect x="652" y="306" width="11" height="11" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="670" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">serving share</text><text x="496" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The proportion of each category is compared, and the</text><text x="496" y="359" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">score is the single LARGEST gap — here &#x27;west&#x27;, 0.24.</text><text x="496" y="376" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">No binning is needed and no ordering is assumed,</text><text x="496" y="393" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">which matters: categories have no natural distance,</text><text x="496" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">so &#x27;north&#x27; is not nearer &#x27;south&#x27; than to &#x27;west&#x27;.</text><rect x="24" y="452" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="452" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="472" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Reversing the two is the classic exam trap. The mapping follows from the data: numerical values</text><text x="40" y="488" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">have an order and a shape you can bin, so you compare whole distributions. Categories have</text><text x="40" y="504" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">neither, so you compare proportions and report the worst single discrepancy.</text></svg>