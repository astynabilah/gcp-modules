<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-label="Training-serving skew versus drift"><title>Training-serving skew versus drift</title><rect width="940" height="440" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="439" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Skew vs. drift — same maths, different baseline</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The metric never changes. What you compare production against does.</text><rect x="24" y="78" width="440" height="216" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">TRAINING-SERVING SKEW</text><rect x="44" y="118" width="168" height="52" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="128.0" y="139.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Training data</text><text x="128.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the baseline</text><rect x="268" y="118" width="168" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="352.0" y="139.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Production</text><text x="352.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">recent requests</text><line x1="212" y1="144" x2="261.0" y2="144.0" stroke="#d93025" stroke-width="1.6" opacity="1.0"/><path d="M 268.0 144.0 L 259.8 147.7 L 259.8 140.3 Z" fill="#d93025" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="240" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="600" text-anchor="middle" opacity="1.0">vs</text><text x="44" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Catches: a pipeline that preprocesses differently</text><text x="44" y="211" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">in production than it did in training. Sends</text><text x="44" y="228" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">&quot;Month-to-Month&quot; where the model learned</text><text x="44" y="245" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">&quot;Month-to-month&quot;. Present from day one.</text><rect x="476" y="78" width="440" height="216" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="10" opacity="1.0"/><text x="496" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">PREDICTION / FEATURE DRIFT</text><rect x="496" y="118" width="168" height="52" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="580.0" y="139.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Earlier production</text><text x="580.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the baseline</text><rect x="720" y="118" width="168" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="804.0" y="139.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Recent production</text><text x="804.0" y="156.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">latest window</text><line x1="664" y1="144" x2="713.0" y2="144.0" stroke="#e37400" stroke-width="1.6" opacity="1.0"/><path d="M 720.0 144.0 L 711.8 147.7 L 711.8 140.3 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="692" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="600" text-anchor="middle" opacity="1.0">vs</text><text x="496" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Catches: the world changing after you deployed.</text><text x="496" y="211" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A pricing change, a new market, a marketing</text><text x="496" y="228" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">campaign that shifts who shows up. Appears</text><text x="496" y="245" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">gradually, weeks or months in.</text><rect x="24" y="312" width="892" height="80" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="312" width="3.5" height="80" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="332" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Skew is a bug you introduced; drift is the world moving. Both are measured with Jensen-Shannon</text><text x="40" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">(numerical) or L-infinity (categorical) against a threshold you set — the only difference is</text><text x="40" y="364" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">which distribution sits on the left of the comparison. Configure skew first: it is the one that</text><text x="40" y="380" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">is already wrong on the day you launch, and the one nobody notices without monitoring.</text></svg>