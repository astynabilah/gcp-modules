<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="The three things Model Monitoring can watch"><title>The three things Model Monitoring can watch</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">What you can monitor, and what each one catches</text><rect x="24" y="62" width="892" height="96" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="62" width="6" height="96" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Input feature skew / drift</text><rect x="249.79999999999998" y="78" width="115.44" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="258.79999999999995" y="91.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">the inputs moved</text><text x="46" y="114" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Compares each feature&#x27;s distribution against the baseline.</text><text x="46" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cheapest and most common. Start here.</text><rect x="24" y="168" width="892" height="96" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="168" width="6" height="96" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Prediction drift</text><rect x="176.8" y="184" width="121.53" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="185.8" y="197.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">the outputs moved</text><text x="46" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Compares the distribution of predictions over time.</text><text x="46" y="242" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Catches problems no input feature shows individually — and needs no ground truth.</text><rect x="24" y="274" width="892" height="96" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="274" width="6" height="96" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="302" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Feature attribution skew / drift</text><rect x="293.6" y="290" width="133.70999999999998" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="302.6" y="303.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">the reasoning moved</text><text x="46" y="326" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Compares how much each feature contributed to predictions.</text><text x="46" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Requires explainability configured on the model. Catches a shift in which feature drives the answer, even when every</text><text x="46" y="362" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">input distribution looks stable.</text><rect x="24" y="384" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="384" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="404" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">None of these measure accuracy, and that is not a limitation — it is the point. Ground truth</text><text x="40" y="420" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">for churn arrives months later, so monitoring watches the things observable today: what goes</text><text x="40" y="436" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">in, what comes out, and why. Accuracy is measured separately, when labels finally land.</text></svg>