<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Decision map for choosing a GCP ML path"><title>Decision map for choosing a GCP ML path</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Which GCP path — decided by your data and your constraint, not by what sounds impressive</text><rect x="330" y="66" width="280" height="54" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="90" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Can a simple rule already do the</text><text x="470.0" y="104" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">job?</text><rect x="60" y="158" width="226" height="56" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="173.0" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Ship the rule</text><text x="173.0" y="198.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">and measure it honestly</text><line x1="400" y1="120" x2="179.90393371068112" y2="156.844275414071" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 173.0 158.0 L 180.5 153.0 L 181.7 160.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="255" y="138" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">yes</text><rect x="330" y="158" width="280" height="54" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="182" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Is the data tabular and already in</text><text x="470.0" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery?</text><line x1="470" y1="120" x2="470.0" y2="151.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 470.0 158.0 L 466.3 149.8 L 473.7 149.8 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="482" y="141" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">no</text><rect x="330" y="254" width="280" height="54" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Do you need text, images, or</text><text x="470.0" y="292" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">generation?</text><line x1="470" y1="212" x2="470.0" y2="247.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 470.0 254.0 L 466.3 245.8 L 473.7 245.8 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="482" y="237" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">yes</text><rect x="654" y="158" width="262" height="56" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="785.0" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Vertex custom training</text><text x="785.0" y="198.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">your framework, your container</text><line x1="610" y1="185" x2="647.0" y2="185.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 654.0 185.0 L 645.8 188.7 L 645.8 181.3 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="632" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">no</text><rect x="654" y="254" width="262" height="56" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="785.0" y="277.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">AI.GENERATE in BigQuery</text><text x="785.0" y="294.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Gemini, called from SQL</text><line x1="610" y1="281" x2="647.0" y2="281.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 654.0 281.0 L 645.8 284.7 L 645.8 277.3 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="632" y="274" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">yes</text><rect x="330" y="350" width="280" height="54" fill="#fffaf0" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="374" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Does something wait on the answer</text><text x="470.0" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">in real time?</text><line x1="470" y1="308" x2="470.0" y2="343.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 470.0 350.0 L 466.3 341.8 L 473.7 341.8 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="482" y="333" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">no</text><rect x="60" y="350" width="226" height="56" fill="#f4f8ff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="173.0" y="373.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery ML + scheduled query</text><text x="173.0" y="390.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">batch scoring into a table</text><line x1="330" y1="377" x2="293.0" y2="377.0" stroke="#1a73e8" stroke-width="1.6" opacity="1.0"/><path d="M 286.0 377.0 L 294.2 373.3 L 294.2 380.7 Z" fill="#1a73e8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="308" y="370" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">no</text><rect x="654" y="350" width="262" height="56" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="785.0" y="373.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery ML + endpoint</text><text x="785.0" y="390.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">train in SQL, serve online</text><line x1="610" y1="377" x2="647.0" y2="377.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 654.0 377.0 L 645.8 380.7 L 645.8 373.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="632" y="370" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">yes</text><rect x="24" y="440" width="892" height="80" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="440" width="3.5" height="80" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="460" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Two questions do most of the work. The first one — can a rule do this? — is the one teams</text><text x="40" y="476" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">skip, and it is the one that most often ends the project happily. The last one — is anything</text><text x="40" y="492" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">actually waiting? — decides whether you rent a node 24 hours a day or run a query at 3 a.m.</text><text x="40" y="508" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Everything between is a matter of where your data already lives.</text></svg>