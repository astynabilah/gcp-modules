<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="The five stages of scaling a prototype"><title>The five stages of scaling a prototype</title><rect width="940" height="520" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="519" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The five stages — each one fixes what the previous one broke</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">You do not climb this ladder because it exists. You climb one rung when the failure named below actually starts hurting.</text><rect x="24" y="80" width="168" height="380" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="24" y="80" width="168" height="46" fill="#5f6368" stroke="none" stroke-width="1" rx="10" opacity="0.12"/><rect x="24" y="116" width="168" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><circle cx="50" cy="104" r="13" fill="#5f6368" stroke="none" stroke-width="1" opacity="1.0"/><text x="50" y="108.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0">0</text><text x="72" y="109" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Prototype</text><text x="38" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">YOU HAVE</text><text x="38" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Notebook, Colab, a CSV on</text><text x="38" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">someone&#x27;s laptop.</text><text x="38" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">WHAT BREAKS NEXT</text><text x="38" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Nobody else can reproduce</text><text x="38" y="286" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">it.</text><text x="38" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">GCP</text><rect x="38" y="352" width="45.55" height="19" fill="#5f6368" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="47" y="365.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Colab</text><rect x="38" y="376" width="100.64999999999999" height="19" fill="#5f6368" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="47" y="389.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">BigQuery ad-hoc</text><line x1="193" y1="104" x2="198.0" y2="104.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 205.0 104.0 L 196.8 107.7 L 196.8 100.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="206" y="80" width="168" height="380" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="206" y="80" width="168" height="46" fill="#1a73e8" stroke="none" stroke-width="1" rx="10" opacity="0.12"/><rect x="206" y="116" width="168" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><circle cx="232" cy="104" r="13" fill="#1a73e8" stroke="none" stroke-width="1" opacity="1.0"/><text x="232" y="108.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0">1</text><text x="254" y="109" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Reproducible</text><text x="220" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">YOU HAVE</text><text x="220" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">SQL and config in git.</text><text x="220" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">One command rebuilds</text><text x="220" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">everything from source</text><text x="220" y="206" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">data.</text><text x="220" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">WHAT BREAKS NEXT</text><text x="220" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Someone still has to</text><text x="220" y="286" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">remember to run it.</text><text x="220" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">GCP</text><rect x="220" y="352" width="62.08" height="19" fill="#1a73e8" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="229" y="365.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">BigQuery</text><rect x="220" y="376" width="62.08" height="19" fill="#1a73e8" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="229" y="389.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">Dataform</text><rect x="220" y="400" width="34.53" height="19" fill="#1a73e8" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="229" y="413.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">git</text><line x1="375" y1="104" x2="380.0" y2="104.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 387.0 104.0 L 378.8 107.7 L 378.8 100.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="388" y="80" width="168" height="380" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="388" y="80" width="168" height="46" fill="#12a4af" stroke="none" stroke-width="1" rx="10" opacity="0.12"/><rect x="388" y="116" width="168" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><circle cx="414" cy="104" r="13" fill="#12a4af" stroke="none" stroke-width="1" opacity="1.0"/><text x="414" y="108.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0">2</text><text x="436" y="109" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Scheduled</text><text x="402" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">YOU HAVE</text><text x="402" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">It runs itself on a</text><text x="402" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">schedule and writes to a</text><text x="402" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">partitioned table.</text><text x="402" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">WHAT BREAKS NEXT</text><text x="402" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Nobody knows whether the</text><text x="402" y="286" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">output is still correct.</text><text x="402" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">GCP</text><rect x="402" y="352" width="111.67" height="19" fill="#12a4af" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="411" y="365.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="500" text-anchor="start" opacity="1.0">Scheduled queries</text><rect x="402" y="376" width="100.64999999999999" height="19" fill="#12a4af" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="411" y="389.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="500" text-anchor="start" opacity="1.0">Cloud Scheduler</text><rect x="402" y="400" width="67.59" height="19" fill="#12a4af" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="411" y="413.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#12a4af" font-weight="500" text-anchor="start" opacity="1.0">Workflows</text><line x1="557" y1="104" x2="562.0" y2="104.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 569.0 104.0 L 560.8 107.7 L 560.8 100.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="570" y="80" width="168" height="380" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="570" y="80" width="168" height="46" fill="#e37400" stroke="none" stroke-width="1" rx="10" opacity="0.12"/><rect x="570" y="116" width="168" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><circle cx="596" cy="104" r="13" fill="#e37400" stroke="none" stroke-width="1" opacity="1.0"/><text x="596" y="108.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0">3</text><text x="618" y="109" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Observed</text><text x="584" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">YOU HAVE</text><text x="584" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Evaluation, drift</text><text x="584" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">monitoring, lineage, and</text><text x="584" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">alerts on failure.</text><text x="584" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">WHAT BREAKS NEXT</text><text x="584" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Only batch consumers can</text><text x="584" y="286" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">use it.</text><text x="584" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">GCP</text><rect x="584" y="352" width="78.61" height="19" fill="#e37400" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="593" y="365.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">ML.EVALUATE</text><rect x="584" y="376" width="106.16" height="19" fill="#e37400" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="593" y="389.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">Model Monitoring</text><rect x="584" y="400" width="106.16" height="19" fill="#e37400" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="593" y="413.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">Dataplex lineage</text><line x1="739" y1="104" x2="744.0" y2="104.0" stroke="#bdc1c6" stroke-width="1.8" opacity="1.0"/><path d="M 751.0 104.0 L 742.8 107.7 L 742.8 100.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="752" y="80" width="168" height="380" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="752" y="80" width="168" height="46" fill="#188038" stroke="none" stroke-width="1" rx="10" opacity="0.12"/><rect x="752" y="116" width="168" height="10" fill="#ffffff" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><circle cx="778" cy="104" r="13" fill="#188038" stroke="none" stroke-width="1" opacity="1.0"/><text x="778" y="108.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0">4</text><text x="800" y="109" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Served &amp; governed</text><text x="766" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">YOU HAVE</text><text x="766" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Online endpoint,</text><text x="766" y="178" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">versioned registry, safe</text><text x="766" y="192" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">rollout, retraining path.</text><text x="766" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d93025" font-weight="600" text-anchor="start" opacity="1.0">WHAT BREAKS NEXT</text><text x="766" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">— this is production.</text><text x="766" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">GCP</text><rect x="766" y="352" width="95.14" height="19" fill="#188038" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="775" y="365.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">Agent Platform</text><rect x="766" y="376" width="62.08" height="19" fill="#188038" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="775" y="389.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">Registry</text><rect x="766" y="400" width="67.59" height="19" fill="#188038" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="775" y="413.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">Endpoints</text><rect x="766" y="424" width="67.59" height="19" fill="#188038" stroke="none" stroke-width="1" rx="9.5" opacity="1.0"/><text x="775" y="437.1" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">Pipelines</text></svg>