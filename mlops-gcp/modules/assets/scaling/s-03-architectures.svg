m,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Looker Studio</text><rect x="24" y="190" width="892" height="108" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="9" opacity="1.0"/><circle cx="48" cy="216" r="13" fill="#188038" stroke="none" stroke-width="1" opacity="0.16"/><text x="48" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">B</text><text x="70" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Application serving</text><text x="226.4" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">when a request is blocked on the answer</text><rect x="48" y="238" width="152" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="124.0" y="264.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Source tables</text><line x1="200" y1="260" x2="215.0" y2="260.0" stroke="#188038" stroke-width="1.5" opacity="1.0"/><path d="M 222.0 260.0 L 213.8 263.7 L 213.8 256.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="222" y="238" width="152" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="298.0" y="264.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">BigQuery ML</text><line x1="374" y1="260" x2="389.0" y2="260.0" stroke="#188038" stroke-width="1.5" opacity="1.0"/><path d="M 396.0 260.0 L 387.8 263.7 L 387.8 256.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="396" y="238" width="152" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="472.0" y="264.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Model registry</text><line x1="548" y1="260" x2="563.0" y2="260.0" stroke="#188038" stroke-width="1.5" opacity="1.0"/><path d="M 570.0 260.0 L 561.8 263.7 L 561.8 256.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="570" y="238" width="152" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="646.0" y="264.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Online endpoint</text><line x1="722" y1="260" x2="737.0" y2="260.0" stroke="#188038" stroke-width="1.5" opacity="1.0"/><path d="M 744.0 260.0 L 735.8 263.7 L 735.8 256.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="744" y="238" width="152" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="820.0" y="264.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Your app</text><rect x="24" y="312" width="892" height="108" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="9" opacity="1.0"/><circle cx="48" cy="338" r="13" fill="#8430ce" stroke="none" stroke-width="1" opacity="0.16"/><text x="48" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">C</text><text x="70" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Generative enrichment</text><text x="241.6" y="342" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">unstructured text or images in the warehouse</text><rect x="48" y="360" width="152" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="124.0" y="386.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Raw text / objects</text><line x1="200" y1="382" x2="215.0" y2="382.0" stroke="#8430ce" stroke-width="1.5" opacity="1.0"/><path d="M 222.0 382.0 L 213.8 385.7 L 213.8 378.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="222" y="360" width="152" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="298.0" y="386.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">AI.GENERATE</text><line x1="374" y1="382" x2="389.0" y2="382.0" stroke="#8430ce" stroke-width="1.5" opacity="1.0"/><path d="M 396.0 382.0 L 387.8 385.7 L 387.8 378.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="396" y="360" width="152" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="472.0" y="386.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Typed columns</text><line x1="548" y1="382" x2="563.0" y2="382.0" stroke="#8430ce" stroke-width="1.5" opacity="1.0"/><path d="M 570.0 382.0 L 561.8 385.7 L 561.8 378.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="570" y="360" width="152" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="646.0" y="386.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Aggregate + join</text><line x1="722" y1="382" x2="737.0" y2="382.0" stroke="#8430ce" stroke-width="1.5" opacity="1.0"/><path d="M 744.0 382.0 L 735.8 385.7 L 735.8 378.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="744" y="360" width="152" height="44" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="820.0" y="386.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Dashboard</text><rect x="24" y="438" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="438" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="458" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Architecture A is where most work should end. B adds one box — and that box is the only one</text><text x="40" y="474" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">in any of these diagrams that bills you while it does nothing. C is A with the extraction</text><text x="40" y="490" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">step replaced by a model call, which is why generative work fits the warehouse so naturally.</text></svg>