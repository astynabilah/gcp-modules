<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="How to read a Google Cloud machine type name"><title>How to read a Google Cloud machine type name</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Machine type names are systematic, not cryptic</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Three fields, always in the same order.</text><rect x="24" y="82" width="892" height="130" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><text x="80" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="30" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">n1</text><text x="148" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="30" fill="#bdc1c6" font-weight="400" text-anchor="start" opacity="1.0">-</text><text x="172" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="30" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">standard</text><text x="392" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="30" fill="#bdc1c6" font-weight="400" text-anchor="start" opacity="1.0">-</text><text x="416" y="128" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="30" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">4</text><line x1="96" y1="144" x2="96" y2="164" stroke="#1a73e8" stroke-width="1.4" opacity="1.0"/><text x="96" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">family</text><text x="96" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">generation + purpose</text><line x1="280" y1="144" x2="280" y2="164" stroke="#8430ce" stroke-width="1.4" opacity="1.0"/><text x="280" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">memory profile</text><text x="280" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">~3.75 GB per vCPU</text><line x1="426" y1="144" x2="426" y2="164" stroke="#188038" stroke-width="1.4" opacity="1.0"/><text x="426" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">size</text><text x="426" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">4 vCPUs</text><text x="560" y="116" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">so:  4 vCPUs, about 15 GB RAM,</text><text x="560" y="136" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">general-purpose, no accelerator.</text><text x="24" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The families worth recognising</text><rect x="24" y="260" width="816" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="260" width="816" height="184" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="277.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Prefix</text><text x="160" y="277.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Family</text><line x1="150" y1="260" x2="150" y2="444" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="350" y="277.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Accelerator</text><line x1="340" y1="260" x2="340" y2="444" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="508" y="277.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Reach for it when</text><line x1="498" y1="260" x2="498" y2="444" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="288" x2="840" y2="288" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">e2 n1 n2 n4</text><text x="160" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">general purpose</text><text x="350" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">attached, optional</text><text x="508" y="305.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">data prep, serving, CPU training</text><rect x="24" y="314" width="816" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="331.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">c2 c3 c4</text><text x="160" y="331.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">compute optimised</text><text x="350" y="331.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">none</text><text x="508" y="331.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">CPU-bound work, high clock</text><line x1="24" y1="314" x2="840" y2="314" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="357.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">m1 m2 m3</text><text x="160" y="357.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">memory optimised</text><text x="350" y="357.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">none</text><text x="508" y="357.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">huge in-memory datasets</text><line x1="24" y1="340" x2="840" y2="340" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="366" width="816" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">g2</text><text x="160" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">accelerator (L4)</text><text x="350" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">BUILT IN</text><text x="508" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">modern mid-tier GPU work</text><line x1="24" y1="366" x2="840" y2="366" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a2 a3 a4</text><text x="160" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">accelerator (NVIDIA)</text><text x="350" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">BUILT IN</text><text x="508" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A100 / H100 serious training</text><line x1="24" y1="392" x2="840" y2="392" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="418" width="816" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">ct5lp- ct6e-</text><text x="160" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cloud TPU</text><text x="350" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">IS the TPU</text><text x="508" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">large TensorFlow / JAX training</text><line x1="24" y1="418" x2="840" y2="418" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="24" y="462" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Memory suffix</text><rect x="24" y="478" width="286" height="52" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><text x="40" y="502" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">highcpu</text><text x="40" y="520" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~0.9 GB per vCPU</text><rect x="324" y="478" width="286" height="52" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><text x="340" y="502" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">standard</text><text x="340" y="520" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~3.75 GB per vCPU</text><rect x="624" y="478" width="286" height="52" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><text x="640" y="502" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">highmem</text><text x="640" y="520" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">~6.5 GB per vCPU</text></svg>