<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" role="img" aria-label="The MXU is a 128x128 systolic array, so dimensions should be multiples of 128"><title>The MXU is a 128x128 systolic array, so dimensions should be multiples of 128</title><rect width="940" height="660" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="659" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why 128 is the number that makes a TPU fast</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The MXU is a 128x128 grid. Work is tiled into it, and padding is billed like real work.</text><rect x="24" y="84" width="440" height="268" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">DIMENSION 256  -  two full tiles</text><rect x="60" y="130" width="180" height="180" fill="#e6f4ea" stroke="#188038" stroke-width="1.4" rx="6" opacity="1.0"/><line x1="60" y1="160" x2="240" y2="160" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="90" y1="130" x2="90" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="60" y1="190" x2="240" y2="190" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="120" y1="130" x2="120" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="60" y1="220" x2="240" y2="220" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="150" y1="130" x2="150" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="60" y1="250" x2="240" y2="250" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="180" y1="130" x2="180" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="60" y1="280" x2="240" y2="280" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="210" y1="130" x2="210" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><text x="150" y="226" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">128 x 128</text><text x="150" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">100% used</text><rect x="250" y="130" width="180" height="180" fill="#e6f4ea" stroke="#188038" stroke-width="1.4" rx="6" opacity="1.0"/><line x1="250" y1="160" x2="430" y2="160" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="280" y1="130" x2="280" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="250" y1="190" x2="430" y2="190" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="310" y1="130" x2="310" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="250" y1="220" x2="430" y2="220" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="340" y1="130" x2="340" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="250" y1="250" x2="430" y2="250" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="370" y1="130" x2="370" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="250" y1="280" x2="430" y2="280" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="400" y1="130" x2="400" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><text x="340" y="226" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">128 x 128</text><text x="340" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">100% used</text><text x="244" y="336" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">you pay for 256, you use 256</text><rect x="476" y="84" width="440" height="268" fill="#fff8f7" stroke="#d93025" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">DIMENSION 129  -  still two tiles</text><rect x="512" y="130" width="180" height="180" fill="#e6f4ea" stroke="#188038" stroke-width="1.4" rx="6" opacity="1.0"/><line x1="512" y1="160" x2="692" y2="160" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="542" y1="130" x2="542" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="512" y1="190" x2="692" y2="190" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="572" y1="130" x2="572" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="512" y1="220" x2="692" y2="220" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="602" y1="130" x2="602" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="512" y1="250" x2="692" y2="250" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="632" y1="130" x2="632" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="512" y1="280" x2="692" y2="280" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><line x1="662" y1="130" x2="662" y2="310" stroke="#a8dab5" stroke-width="1" opacity="1.0"/><text x="602" y="226" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">128 x 128</text><text x="602" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">100% used</text><rect x="702" y="130" width="180" height="180" fill="#fce8e6" stroke="#d93025" stroke-width="1.4" rx="6" opacity="1.0"/><rect x="702" y="130" width="30" height="180" fill="#f6aea9" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="702" y1="160" x2="882" y2="160" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="732" y1="130" x2="732" y2="310" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="702" y1="190" x2="882" y2="190" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="762" y1="130" x2="762" y2="310" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="702" y1="220" x2="882" y2="220" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="792" y1="130" x2="792" y2="310" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="702" y1="250" x2="882" y2="250" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="822" y1="130" x2="822" y2="310" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="702" y1="280" x2="882" y2="280" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><line x1="852" y1="130" x2="852" y2="310" stroke="#f6aea9" stroke-width="1" opacity="1.0"/><text x="807" y="226" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">1 column used</text><text x="807" y="244" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">127 columns of zeros</text><text x="696" y="336" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">you pay for 256, you use 129</text><text x="24" y="394" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The two levers, and what each is actually for</text><rect x="24" y="412" width="892" height="46" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="412" width="5" height="46" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="432" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Multiples of 128</text><text x="212" y="432" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Batch size, hidden dim, embedding size, sequence length.</text><text x="212" y="448" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Rounding 200 up to 256 can train FASTER despite being a bigger model.</text><rect x="24" y="462" width="892" height="46" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="462" width="5" height="46" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="482" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">bfloat16 activations</text><text x="212" y="482" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Same exponent range as float32, fewer mantissa bits.</text><text x="212" y="498" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Halves memory traffic. Many ops are bandwidth-bound, not compute-bound.</text><rect x="24" y="512" width="892" height="46" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="512" width="5" height="46" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="532" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">TF_XLA_FLAGS</text><text x="212" y="532" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Does nothing - XLA is already on for every TPU workload.</text><text x="212" y="548" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">TPUs only execute XLA-compiled programs. There is nothing to enable.</text><rect x="24" y="562" width="892" height="46" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="562" width="5" height="46" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="582" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Precision.HIGHEST</text><text x="212" y="582" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Actively slower.</text><text x="212" y="598" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">It emulates float32 by making MULTIPLE MXU passes. DEFAULT is the fast path.</text><rect x="24" y="612" width="892" height="46" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="612" width="5" height="46" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="632" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Twisted topology / ICI</text><text x="212" y="632" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Right tool, wrong problem.</text><text x="212" y="648" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Those tune chip-TO-chip traffic. MXU utilisation is inside one chip.</text></svg>