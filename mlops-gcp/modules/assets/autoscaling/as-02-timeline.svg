<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="The lag between traffic arriving and capacity arriving"><title>The lag between traffic arriving and capacity arriving</title><rect width="940" height="470" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="469" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why scaling is never instant</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Traffic arrives in milliseconds. A replica arrives in minutes. That gap is the whole problem.</text><line x1="70" y1="240" x2="890" y2="240" stroke="#5f6368" stroke-width="1.4" opacity="1.0"/><text x="46" y="100" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="end" opacity="1.0">load</text><path d="M 70.0 202.5 L 78.2 202.5 L 86.4 202.5 L 94.6 202.5 L 102.8 202.5 L 111.0 202.5 L 119.2 202.5 L 127.4 202.5 L 135.6 202.5 L 143.8 202.5 L 152.0 202.5 L 160.2 202.5 L 168.4 202.5 L 176.6 202.5 L 184.8 202.5 L 193.0 202.5 L 201.2 202.5 L 209.4 202.5 L 217.6 202.5 L 225.8 202.5 L 234.0 202.5 L 242.2 202.5 L 250.4 202.5 L 258.6 191.2 L 266.8 180.0 L 275.0 168.8 L 283.2 157.5 L 291.4 146.2 L 299.6 135.0 L 307.8 123.8 L 316.0 112.5 L 324.2 112.5 L 332.4 112.5 L 340.6 112.5 L 348.8 112.5 L 357.0 112.5 L 365.2 112.5 L 373.4 112.5 L 381.6 112.5 L 389.8 112.5 L 398.0 112.5 L 406.2 112.5 L 414.4 112.5 L 422.6 112.5 L 430.8 112.5 L 439.0 112.5 L 447.2 112.5 L 455.4 112.5 L 463.6 112.5 L 471.8 112.5 L 480.0 112.5 L 488.2 112.5 L 496.4 112.5 L 504.6 112.5 L 512.8 112.5 L 521.0 112.5 L 529.2 112.5 L 537.4 112.5 L 545.6 112.5 L 553.8 112.5 L 562.0 112.5 L 570.2 112.5 L 578.4 112.5 L 586.6 112.5 L 594.8 112.5 L 603.0 112.5 L 611.2 112.5 L 619.4 112.5 L 627.6 112.5 L 635.8 112.5 L 644.0 112.5 L 652.2 112.5 L 660.4 112.5 L 668.6 112.5 L 676.8 112.5 L 685.0 112.5 L 693.2 112.5 L 701.4 112.5 L 709.6 112.5 L 717.8 112.5 L 726.0 112.5 L 734.2 112.5 L 742.4 112.5 L 750.6 112.5 L 758.8 112.5 L 767.0 112.5 L 775.2 112.5 L 783.4 112.5 L 791.6 112.5 L 799.8 112.5 L 808.0 112.5 L 816.2 112.5 L 824.4 112.5 L 832.6 112.5 L 840.8 112.5 L 849.0 112.5 L 857.2 112.5 L 865.4 112.5 L 873.6 112.5 L 881.8 112.5 L 890.0 112.5" fill="none" stroke="#e37400" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="152.0" y="192.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#e37400" font-weight="600" text-anchor="start" opacity="1.0">incoming traffic</text><line x1="70.0" y1="187.5" x2="496.40000000000003" y2="187.5" stroke="#188038" stroke-width="2.4" opacity="1.0"/><line x1="496.40000000000003" y1="135.0" x2="709.6" y2="135.0" stroke="#188038" stroke-width="2.4" opacity="1.0"/><line x1="496.40000000000003" y1="187.5" x2="496.40000000000003" y2="135.0" stroke="#188038" stroke-width="2.4" opacity="1.0"/><line x1="709.6" y1="82.5" x2="890.0" y2="82.5" stroke="#188038" stroke-width="2.4" opacity="1.0"/><line x1="709.6" y1="135.0" x2="709.6" y2="82.5" stroke="#188038" stroke-width="2.4" opacity="1.0"/><text x="119.19999999999999" y="177.5" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">capacity (replicas)</text><line x1="283.20000000000005" y1="84" x2="283.20000000000005" y2="240" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" opacity="1.0"/><text x="283.20000000000005" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">metric crosses 60%</text><line x1="381.6" y1="84" x2="381.6" y2="240" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" opacity="1.0"/><text x="381.6" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">decision made</text><line x1="496.40000000000003" y1="84" x2="496.40000000000003" y2="240" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" opacity="1.0"/><text x="496.40000000000003" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">replica booting</text><line x1="709.6" y1="84" x2="709.6" y2="240" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" opacity="1.0"/><text x="709.6" y="258" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">serving traffic</text><rect x="283.20000000000005" y="270" width="426.40000000000003" height="22" fill="#d93025" stroke="none" stroke-width="1" rx="5" opacity="0.14"/><text x="496.40000000000003" y="285" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="600" text-anchor="middle" opacity="1.0">you are under-provisioned for this whole window — seconds to minutes</text><text x="24" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">What fills that gap</text><rect x="24" y="333" width="4" height="16" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="344" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Metric collection</text><text x="220" y="344" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the signal is averaged over a window before it is acted on</text><rect x="24" y="355" width="4" height="16" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Cooldown</text><text x="220" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">a deliberate delay so the endpoint does not oscillate</text><rect x="24" y="377" width="4" height="16" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Node provisioning</text><text x="220" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">a machine has to be allocated</text><rect x="24" y="399" width="4" height="16" fill="#1a73e8" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="38" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">Container + model load</text><text x="220" y="410" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">30 seconds to several minutes, depending on model size</text><rect x="24" y="436" width="892" height="32" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="436" width="3.5" height="32" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="456" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">This is why minReplicaCount matters more than any target tuning: it is the only setting that buys headroom BEFORE the spike.</text></svg>