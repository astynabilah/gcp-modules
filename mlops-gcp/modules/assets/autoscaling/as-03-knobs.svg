<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Vertex AI autoscaling configuration knobs"><title>Vertex AI autoscaling configuration knobs</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The knobs, and which one to reach for</text><rect x="24" y="62" width="892" height="82" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="62" width="6" height="82" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="88" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">minReplicaCount</text><rect x="171.0" y="76" width="72.81" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="180.0" y="89.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">the floor</text><text x="46" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">How many replicas always run. 0 enables scale-to-zero (v1beta1).</text><text x="46" y="130" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Your latency insurance AND your baseline bill. The most consequential setting.</text><rect x="24" y="152" width="892" height="82" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="152" width="6" height="82" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="178" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">maxReplicaCount</text><rect x="171.0" y="166" width="84.99" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="180.0" y="179.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">the ceiling</text><text x="46" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The most replicas autoscaling may create.</text><text x="46" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Your blast radius. A retry storm scales you to this number and bills for it.</text><rect x="24" y="242" width="892" height="82" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="242" width="6" height="82" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="268" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">machineSpec</text><rect x="141.4" y="256" width="72.81" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="150.4" y="269.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="500" text-anchor="start" opacity="1.0">the shape</text><text x="46" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Machine type, accelerator type and count.</text><text x="46" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">accelerator_count &gt; 0 is what turns on dual-metric autoscaling in the first place.</text><rect x="24" y="332" width="892" height="82" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="332" width="6" height="82" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="358" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">autoscalingMetricSpecs</text><rect x="222.8" y="346" width="84.99" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="231.8" y="359.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="500" text-anchor="start" opacity="1.0">the trigger</text><text x="46" y="380" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Override which metric and what target. Default target is 60 for both.</text><text x="46" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Only needed when the default OR misfires — e.g. CPU-heavy preprocessing.</text><rect x="24" y="422" width="892" height="82" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="422" width="6" height="82" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="448" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">DedicatedResources</text><rect x="193.20000000000002" y="436" width="66.72" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="202.20000000000002" y="449.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">the mode</text><text x="46" y="470" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The config block that exposes all of the above.</text><text x="46" y="490" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">AutomaticResources cannot express custom metrics — use DedicatedResources.</text><rect x="24" y="516" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="516" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="536" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Reach for them in this order: get minReplicaCount right first (it decides both your worst-case</text><text x="40" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">latency and your floor cost), cap maxReplicaCount so a bug cannot bankrupt you, and only then</text><text x="40" y="568" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">consider touching the metric targets. Most &#x27;autoscaling problems&#x27; are a minReplicaCount of 1.</text></svg>