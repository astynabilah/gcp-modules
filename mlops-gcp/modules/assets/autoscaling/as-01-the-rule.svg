<svg xmlns="http://www.w3.org/2000/svg" width="940" height="584" viewBox="0 0 940 584" role="img" aria-label="Scale up on either metric, scale down only when both are below target"><title>Scale up on either metric, scale down only when both are below target</title><rect width="940" height="584" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="583" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The one rule — asymmetric on purpose</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">With a GPU attached, Vertex AI watches TWO metrics. Scale-up and scale-down use different logic.</text><rect x="24" y="78" width="440" height="190" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">SCALE UP  —  logical OR</text><text x="44" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Adds a replica when EITHER metric is above its target.</text><text x="44" y="146" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">CPU utilisation</text><rect x="44" y="152" width="300" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="44" y="152" width="90.0" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="224.0" y1="148" x2="224.0" y2="176" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3" opacity="1.0"/><text x="354" y="166" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">30%</text><text x="44" y="202" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">GPU duty cycle</text><rect x="44" y="208" width="300" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="44" y="208" width="255.0" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="224.0" y1="204" x2="224.0" y2="232" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3" opacity="1.0"/><text x="354" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">85%</text><rect x="392" y="148" width="56" height="82" fill="#188038" stroke="none" stroke-width="1" rx="8" opacity="0.16"/><text x="420" y="182" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">SCALE</text><text x="420" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">UP</text><rect x="476" y="78" width="440" height="190" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="10" opacity="1.0"/><text x="496" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">SCALE DOWN  —  logical AND</text><text x="496" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Removes a replica only when BOTH are below target.</text><text x="496" y="146" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">CPU utilisation</text><rect x="496" y="152" width="300" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="496" y="152" width="90.0" height="20" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="676.0" y1="148" x2="676.0" y2="176" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3" opacity="1.0"/><text x="806" y="166" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">30%</text><text x="496" y="202" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">GPU duty cycle</text><rect x="496" y="208" width="300" height="20" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="496" y="208" width="135.0" height="20" fill="#8430ce" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="676.0" y1="204" x2="676.0" y2="232" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3" opacity="1.0"/><text x="806" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">45%</text><rect x="844" y="148" width="56" height="82" fill="#d93025" stroke="none" stroke-width="1" rx="8" opacity="0.14"/><text x="872" y="182" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">SCALE</text><text x="872" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">DOWN</text><text x="24" y="300" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">The same rule produces two opposite complaints</text><rect x="24" y="322" width="440" height="158" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="24" y="322" width="6" height="158" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">“It scales too often!”</text><text x="46" y="364" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">CPU-heavy preprocessing, GPU-light inference</text><text x="46" y="398" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">CPU</text><rect x="86" y="384" width="240" height="18" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="86" y="384" width="196.8" height="18" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="230" y1="381" x2="230" y2="405" stroke="#d93025" stroke-width="1.6" stroke-dasharray="3 3" opacity="1.0"/><text x="336" y="397" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">82%</text><text x="46" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">GPU</text><rect x="86" y="414" width="240" height="18" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="86" y="414" width="48.0" height="18" fill="#8430ce" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="230" y1="411" x2="230" y2="435" stroke="#d93025" stroke-width="1.6" stroke-dasharray="3 3" opacity="1.0"/><text x="336" y="427" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">20%</text><text x="46" y="452" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">CPU alone crosses 60% -&gt; OR fires -&gt; a replica is added</text><text x="46" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">while the GPU sits idle. Working as designed, not a bug.</text><rect x="476" y="322" width="440" height="158" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="476" y="322" width="6" height="158" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="498" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">“It won&#x27;t scale up!”</text><text x="498" y="364" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">GPU-heavy inference, CPU-light</text><text x="498" y="398" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">CPU</text><rect x="538" y="384" width="240" height="18" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="538" y="384" width="72.0" height="18" fill="#1a73e8" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="682" y1="381" x2="682" y2="405" stroke="#d93025" stroke-width="1.6" stroke-dasharray="3 3" opacity="1.0"/><text x="788" y="397" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">30%</text><text x="498" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="600" text-anchor="start" opacity="1.0">GPU</text><rect x="538" y="414" width="240" height="18" fill="#f8f9fa" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><rect x="538" y="414" width="204.0" height="18" fill="#8430ce" stroke="none" stroke-width="1" rx="4" opacity="1.0"/><line x1="682" y1="411" x2="682" y2="435" stroke="#d93025" stroke-width="1.6" stroke-dasharray="3 3" opacity="1.0"/><text x="788" y="427" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">85%</text><text x="498" y="452" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">GPU alone crosses 60% -&gt; OR fires -&gt; it SHOULD scale.</text><text x="498" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">If it isn&#x27;t, the default was overridden somewhere.</text><text x="470" y="502" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#d93025" font-weight="500" text-anchor="middle" opacity="1.0">red dashed line = the 60% default target</text><rect x="24" y="514" width="892" height="48" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="514" width="3.5" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="534" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Both complaints come from the same OR. Diagnose by asking which metric crossed 60% — not</text><text x="40" y="550" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">by assuming autoscaling is broken.</text></svg>