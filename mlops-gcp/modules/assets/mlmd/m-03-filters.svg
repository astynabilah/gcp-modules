<svg xmlns="http://www.w3.org/2000/svg" width="940" height="606" viewBox="0 0 940 606" role="img" aria-label="Vertex ML Metadata filter cheat sheet"><title>Vertex ML Metadata filter cheat sheet</title><rect width="940" height="606" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="605" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Filter cheat sheet — the grammar is AIP-160</text><rect x="24" y="62" width="892" height="50" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="91.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Attribute</text><text x="180" y="91.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">display_name = &quot;churn-model&quot;</text><text x="614" y="82" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">name, display_name, uri, state,</text><text x="614" y="96" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">schema_title, create_time, update_time</text><rect x="24" y="118" width="892" height="50" fill="#fcfcfd" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="147.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Comparison</text><text x="180" y="147.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">create_time &gt; &quot;2026-08-01T00:00:00-00:00&quot;</text><text x="614" y="138" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">=  !=  &lt;  &gt;  &lt;=  &gt;=</text><text x="614" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">times are RFC-3339</text><rect x="24" y="174" width="892" height="40" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="198.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Numeric metadata</text><text x="180" y="198.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">metadata.accuracy.number_value &gt; 0.85</text><text x="614" y="198.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">doubles only — no int_value</text><rect x="24" y="220" width="892" height="40" fill="#fcfcfd" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="244.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">String metadata</text><text x="180" y="244.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">metadata.framework.string_value = &quot;xgboost&quot;</text><text x="614" y="244.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">exact match</text><rect x="24" y="266" width="892" height="40" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="290.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Boolean metadata</text><text x="180" y="290.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">metadata.tuned.bool_value = true</text><text x="614" y="290.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">unquoted true / false</text><rect x="24" y="312" width="892" height="50" fill="#fcfcfd" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="341.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Nested metadata</text><text x="180" y="341.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">metadata.cfg.struct_value.lr.number_value = 0.1</text><text x="614" y="332" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">traverse via struct_value</text><text x="614" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">max nesting depth 5</text><rect x="24" y="368" width="892" height="40" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="392.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Special characters</text><text x="180" y="392.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">metadata.&quot;field:1&quot;.number_value = 10.0</text><text x="614" y="392.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">quote the field name</text><rect x="24" y="414" width="892" height="40" fill="#fcfcfd" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="438.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Context membership</text><text x="180" y="438.0" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">in_context(&quot;projects/…/contexts/RUN_ID&quot;)</text><text x="614" y="438.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">full resource name</text><rect x="24" y="460" width="892" height="50" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="40" y="489.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">Combined</text><text x="180" y="480" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">schema_title = &quot;system.Model&quot; AND</text><text x="180" y="495" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">  metadata.accuracy.number_value &gt;= 0.9</text><text x="614" y="489.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">AND / OR</text><rect x="24" y="522" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="522" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="542" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The same grammar works for artifacts, executions and contexts, in the REST API and in the</text><text x="40" y="558" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Python SDK&#x27;s .list(filter=...). If a filter silently returns nothing, check the type suffix</text><text x="40" y="574" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">first — metadata.accuracy = 0.9 without .number_value matches nothing rather than erroring.</text></svg>