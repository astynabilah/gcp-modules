<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Vertex ML Metadata data model"><title>Vertex ML Metadata data model</title><rect width="940" height="470" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="469" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The Vertex ML Metadata data model — five resource types</text><rect x="24" y="60" width="892" height="250" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.3" rx="10" opacity="1.0"/><text x="44" y="84" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">MetadataStore   (one per project + region, named &#x27;default&#x27;)</text><rect x="44" y="100" width="852" height="106" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><text x="62" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">Context   — a queryable grouping: one pipeline run, one experiment</text><rect x="78" y="138" width="176" height="52" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="8" opacity="1.0"/><text x="166.0" y="159.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Execution</text><text x="166.0" y="176.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a step that ran</text><rect x="384" y="138" width="176" height="52" fill="#ffffff" stroke="#12a4af" stroke-width="1.5" rx="8" opacity="1.0"/><text x="472.0" y="159.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Execution</text><text x="472.0" y="176.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a step that ran</text><rect x="238" y="236" width="176" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="326.0" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Artifact</text><text x="326.0" y="274.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">dataset / model / metrics</text><rect x="560" y="236" width="176" height="52" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="648.0" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Artifact</text><text x="648.0" y="274.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">dataset / model / metrics</text><line x1="200" y1="192" x2="283.65671802003317" y2="231.03980174268213" stroke="#5f6368" stroke-width="1.5" opacity="1.0"/><path d="M 290.0 234.0 L 281.0 233.9 L 284.1 227.2 Z" fill="#5f6368" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="196" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">OUTPUT</text><line x1="340" y1="234" x2="413.8022146801344" y2="195.25383729292943" stroke="#5f6368" stroke-width="1.5" opacity="1.0"/><path d="M 420.0 192.0 L 414.4 199.1 L 411.0 192.6 Z" fill="#5f6368" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="404" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">INPUT</text><line x1="500" y1="192" x2="593.5461252607485" y2="231.28937260951434" stroke="#5f6368" stroke-width="1.5" opacity="1.0"/><path d="M 600.0 234.0 L 591.0 234.2 L 593.8 227.4 Z" fill="#5f6368" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="508" y="222" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#5f6368" font-weight="600" text-anchor="start" opacity="1.0">OUTPUT</text><rect x="760" y="130" width="156" height="68" fill="#188038" stroke="none" stroke-width="1" rx="8" opacity="0.12"/><text x="838" y="154" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">Event</text><text x="838" y="172" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">the arrows themselves —</text><text x="838" y="185" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">INPUT or OUTPUT</text><text x="44" y="300" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">MetadataSchema — the &#x27;type&#x27; of a resource, named in its schema_title field (system.Dataset, system.Model, system.Metrics, …)</text><rect x="24" y="326" width="892" height="64" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="326" width="3.5" height="64" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="346" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Artifacts are nouns, Executions are verbs, Events are the edges between them, and a Context is</text><text x="40" y="362" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">the box you draw around one run. Lineage is just walking those edges — which is why the question</text><text x="40" y="378" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&#x27;which dataset produced this model?&#x27; is answerable at all, and why it survives you leaving the team.</text></svg>