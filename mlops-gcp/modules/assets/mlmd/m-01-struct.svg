<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-label="How protobuf Struct storage produces the number_value filter path"><title>How protobuf Struct storage produces the number_value filter path</title><rect width="940" height="620" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="619" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why the path is metadata.&lt;field&gt;.number_value</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Three layers. Each one explains the next.</text><rect x="24" y="74" width="892" height="92" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="74" width="6" height="92" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="98" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a73e8" font-weight="600" text-anchor="start" opacity="1.0">1.  What you write</text><text x="46" y="132" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">artifact.metadata = {</text><text x="46" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">&quot;accuracy&quot;</text><text x="112.2" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">: </text><text x="125.44" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#b06000" font-weight="400" text-anchor="start" opacity="1.0">0.8734</text><text x="262" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">&quot;framework&quot;</text><text x="334.82" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">: </text><text x="348.06" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#0d652d" font-weight="400" text-anchor="start" opacity="1.0">&quot;xgboost&quot;</text><text x="478" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">&quot;tuned&quot;</text><text x="524.34" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">: </text><text x="537.58" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#1967d2" font-weight="400" text-anchor="start" opacity="1.0">true</text><text x="694" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">&quot;epochs&quot;</text><text x="746.96" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">: </text><text x="760.2" y="154" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#b06000" font-weight="400" text-anchor="start" opacity="1.0">10</text><line x1="470" y1="172" x2="470.0" y2="189.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 470.0 196.0 L 466.3 187.8 L 473.7 187.8 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="486" y="190" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">stored by the API as</text><rect x="24" y="200" width="892" height="176" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="200" width="6" height="176" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="224" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#8430ce" font-weight="600" text-anchor="start" opacity="1.0">2.  How Vertex stores it — google.protobuf.Struct</text><text x="46" y="248" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">message Struct {</text><text x="46" y="261" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">    map&lt;string, Value&gt; fields = 1;      // key -&gt; Value</text><text x="46" y="274" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">}</text><text x="46" y="287" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"></text><text x="46" y="300" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">message Value {                          // a oneof: exactly one is set</text><text x="46" y="313" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">    oneof kind {</text><text x="46" y="326" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">        NullValue null_value;   double number_value;   string string_value;</text><text x="46" y="339" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">        bool bool_value;        Struct struct_value;   ListValue list_value;</text><text x="46" y="352" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">    }</text><text x="46" y="365" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">}</text><rect x="636" y="244" width="278" height="60" fill="#e37400" stroke="none" stroke-width="1" rx="7" opacity="0.14"/><text x="775" y="266" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">There is no int_value.</text><text x="775" y="284" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">number_value is a double —</text><text x="775" y="297" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">epochs 10 comes back as 10.0</text><line x1="470" y1="382" x2="470.0" y2="399.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 470.0 406.0 L 466.3 397.8 L 473.7 397.8 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="486" y="400" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">therefore the filter path is</text><rect x="24" y="410" width="892" height="132" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="410" width="6" height="132" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#188038" font-weight="600" text-anchor="start" opacity="1.0">3.  How you query it — metadata.&lt;fieldName&gt;.&lt;typeValue&gt;</text><text x="46" y="460" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">metadata.accuracy</text><text x="158.54000000000002" y="460" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#b06000" font-weight="400" text-anchor="start" opacity="1.0">.number_value</text><text x="244.6" y="460" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"> &gt; 0.85</text><text x="46" y="480" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">metadata.framework</text><text x="165.16" y="480" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#0d652d" font-weight="400" text-anchor="start" opacity="1.0">.string_value</text><text x="251.22" y="480" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"> = &quot;xgboost&quot;</text><text x="46" y="500" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">metadata.tuned</text><text x="138.68" y="500" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#1967d2" font-weight="400" text-anchor="start" opacity="1.0">.bool_value</text><text x="211.5" y="500" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"> = true</text><text x="46" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">metadata.epochs</text><text x="145.3" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#b06000" font-weight="400" text-anchor="start" opacity="1.0">.number_value</text><text x="231.36" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0"> = 10          &lt;- not int_value</text><rect x="24" y="556" width="892" height="48" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="556" width="3.5" height="48" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="576" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The traversal is not a Vertex quirk — it is protobuf&#x27;s JSON-in-proto representation showing</text><text x="40" y="592" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">through the filter grammar. Once you know metadata is a Struct, the path is forced.</text></svg>