<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="Google Cloud launch stages and their guarantees"><title>Google Cloud launch stages and their guarantees</title><rect width="940" height="500" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="499" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Launch stages — what each one actually promises you</text><line x1="60" y1="96" x2="880" y2="96" stroke="#dadce0" stroke-width="2" opacity="1.0"/><circle cx="76.4" cy="96" r="9" fill="#5f6368" stroke="none" stroke-width="1" opacity="1.0"/><text x="76.4" y="74" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5f6368" font-weight="700" text-anchor="middle" opacity="1.0">Experimental</text><text x="76.4" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a prototype</text><circle cx="289.6" cy="96" r="9" fill="#e37400" stroke="none" stroke-width="1" opacity="1.0"/><text x="289.6" y="74" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">Preview</text><text x="289.6" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">v1beta1 lives here</text><circle cx="519.2" cy="96" r="9" fill="#188038" stroke="none" stroke-width="1" opacity="1.0"/><text x="519.2" y="74" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">GA</text><text x="519.2" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">v1 lives here</text><circle cx="732.4" cy="96" r="9" fill="#d93025" stroke="none" stroke-width="1" opacity="1.0"/><text x="732.4" y="74" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">Deprecated</text><text x="732.4" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">12-month notice</text><text x="880" y="74" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="end" opacity="1.0">Decommissioned</text><rect x="24" y="160" width="892" height="30" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="160" width="892" height="214" fill="none" stroke="#dadce0" stroke-width="1" rx="4" opacity="1.0"/><text x="36" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">Stage</text><text x="166" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">SLA</text><line x1="154" y1="160" x2="154" y2="374" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="236" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">Support</text><line x1="224" y1="160" x2="224" y2="374" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="326" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">Deprecation policy</text><line x1="314" y1="160" x2="314" y2="374" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="476" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">What it means</text><line x1="464" y1="160" x2="464" y2="374" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="190" x2="916" y2="190" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="36" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">Experimental</text><text x="166" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="236" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="326" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="476" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A prototype for feedback. May change or vanish.</text><rect x="24" y="236" width="892" height="46" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="236" x2="916" y2="236" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">Preview</text><text x="166" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="236" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="326" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">no</text><text x="476" y="264" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Test environments only. Not feature-complete. ~6 months typical.</text><line x1="24" y1="282" x2="916" y2="282" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">GA</text><text x="166" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">YES</text><text x="236" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">YES</text><text x="326" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">YES</text><text x="476" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Production-ready. Console, CLI and API support.</text><rect x="24" y="328" width="892" height="46" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><line x1="24" y1="328" x2="916" y2="328" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="36" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">Deprecated</text><text x="166" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">—</text><text x="236" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">—</text><text x="326" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="700" text-anchor="start" opacity="1.0">12 mo</text><text x="476" y="356" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Still works; stop using it. At least 12 months before shutdown.</text><rect x="24" y="392" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="392" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="412" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The line that matters for real work: Preview offerings carry no SLA and no support commitment,</text><text x="40" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">and Google states they are intended for test environments. That is not legal boilerplate — it</text><text x="40" y="444" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">means a v1beta1 feature can change shape under you between releases with no notice period.</text></svg>