<svg xmlns="http://www.w3.org/2000/svg" width="940" height="688" viewBox="0 0 940 688" role="img" aria-label="Four independent meanings of &#x27;version&#x27;"><title>Four independent meanings of &#x27;version&#x27;</title><rect width="940" height="688" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="687" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Four different things are all called &#x27;version&#x27;</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">This is the actual source of the confusion. They are independent of one another.</text><rect x="24" y="80" width="892" height="122" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="80" width="6" height="122" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="106" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">1. API version</text><text x="210" y="106" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">v1  ·  v1beta1</text><text x="46" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The stability contract of the REST/gRPC surface.</text><text x="46" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">v1      = GA. SLA, 12-month deprecation notice.</text><text x="46" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">v1beta1 = Preview. No SLA, may change, test only.</text><text x="46" y="180" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">New features usually land in v1beta1 first.</text><rect x="624" y="138" width="292" height="30" fill="#1a73e8" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="770" y="158" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">Ask: is this feature stable?</text><rect x="24" y="210" width="892" height="122" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="210" width="6" height="122" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="236" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">2. Feature generation</text><text x="210" y="236" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">Model Monitoring v2  ·  GCPC v1 / preview</text><text x="46" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A redesign of a product, numbered by its maker.</text><text x="46" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Model Monitoring &#x27;v2&#x27; is a NEW DESIGN of the</text><text x="46" y="294" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">feature - not the v2 of an API. It is reached</text><text x="46" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">through the same v1 / v1beta1 endpoints.</text><rect x="624" y="268" width="292" height="30" fill="#8430ce" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="770" y="288" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">Ask: which generation of the product?</text><rect x="24" y="340" width="892" height="122" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="340" width="6" height="122" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">3. SDK / library version</text><text x="210" y="366" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">kfp 2.x  ·  google-cloud-aiplatform 1.x</text><text x="46" y="386" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Ordinary Python package semver.</text><text x="46" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">KFP SDK v2 is a library major version.</text><text x="46" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">It is unrelated to API v1 vs v1beta1.</text><text x="46" y="440" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A 2.x SDK can call a v1beta1 endpoint.</text><rect x="624" y="398" width="292" height="30" fill="#e37400" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="770" y="418" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">Ask: which package release?</text><rect x="24" y="470" width="892" height="122" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="9" opacity="1.0"/><rect x="24" y="470" width="6" height="122" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="496" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">4. Model version</text><text x="210" y="496" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">churn-model v1, v2, v3</text><text x="46" y="516" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Your own model revisions in the registry.</text><text x="46" y="538" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Incremented every time you re-register.</text><text x="46" y="554" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Nothing to do with any of the above.</text><rect x="624" y="528" width="292" height="30" fill="#188038" stroke="none" stroke-width="1" rx="6" opacity="0.1"/><text x="770" y="548" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">Ask: which trained artifact?</text><rect x="24" y="604" width="892" height="64" fill="#e8f0fe" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="604" width="3.5" height="64" fill="#1a73e8" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="624" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&#x27;Use Model Monitoring v2&#x27; and &#x27;use the v1beta1 API&#x27; are not the same sentence and do not</text><text x="40" y="640" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">conflict. The first picks a product generation; the second picks a stability contract. Read</text><text x="40" y="656" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">any version number by first asking which of these four things it is numbering.</text></svg>