<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" role="img" aria-label="Selecting an API version in each surface"><title>Selecting an API version in each surface</title><rect width="940" height="700" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="699" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">How you actually select a version, in each surface</text><rect x="24" y="66" width="892" height="104" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="66" width="6" height="104" fill="#1a73e8" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="92" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">REST endpoint</text><text x="46" y="116" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">https://LOCATION-aiplatform.googleapis.com/v1/projects/...</text><text x="46" y="136" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">https://LOCATION-aiplatform.googleapis.com/v1beta1/projects/...</text><text x="46" y="160" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The version is a path segment. Nothing else changes.</text><rect x="24" y="182" width="892" height="104" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="182" width="6" height="104" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="208" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Python — high level</text><text x="46" y="232" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">from google.cloud import aiplatform</text><text x="46" y="252" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">aiplatform.Model, aiplatform.PipelineJob, aiplatform.Endpoint</text><text x="46" y="276" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The curated SDK. Try this first — it is easier and more concise.</text><rect x="24" y="298" width="892" height="104" fill="#ffffff" stroke="#8430ce" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="298" width="6" height="104" fill="#8430ce" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="324" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Python — generated (GAPIC)</text><text x="46" y="348" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">from google.cloud import aiplatform_v1</text><text x="46" y="368" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">from google.cloud import aiplatform_v1beta1</text><text x="46" y="392" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">One package per API version. Drop here only for what the SDK lacks.</text><rect x="24" y="414" width="892" height="104" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="414" width="6" height="104" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="440" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">gcloud</text><text x="46" y="464" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">gcloud ai ...            # GA surface</text><text x="46" y="484" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">gcloud beta ai ...       # preview surface</text><text x="46" y="508" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The release track is the word after gcloud.</text><text x="24" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The order to try things</text><text x="24" y="576" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#188038" font-weight="400" text-anchor="start" opacity="1.0">1.  google.cloud.aiplatform  — the curated SDK</text><text x="24" y="594" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">2.  aiplatform_v1            — generated GA client, if the SDK lacks it</text><text x="24" y="612" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#e37400" font-weight="400" text-anchor="start" opacity="1.0">3.  aiplatform_v1beta1       — only if the feature exists nowhere else</text><rect x="24" y="638" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="638" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="658" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Prefer the stable client unless you need a beta-only feature. Reaching for v1beta1 first is</text><text x="40" y="674" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">how preview surface quietly ends up in production code that nobody meant to ship.</text></svg>