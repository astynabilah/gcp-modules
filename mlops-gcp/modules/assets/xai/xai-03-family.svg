<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Local versus global explanation techniques"><title>Local versus global explanation techniques</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The relatives, and the split that matters</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Local answers &quot;why this prediction&quot;. Global answers &quot;what does the model rely on&quot;. They get swapped constantly.</text><rect x="24" y="84" width="440" height="274" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">LOCAL  -  about ONE prediction</text><rect x="44" y="130" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="58" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Shapley values  /  SHAP</text><text x="58" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">how much did each feature contribute</text><rect x="44" y="176" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="58" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Integrated gradients</text><text x="58" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">same question, gradient-based</text><rect x="44" y="222" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="58" y="240" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">LIME</text><text x="58" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">what simple model behaves like this one, here</text><rect x="44" y="268" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="58" y="286" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Counterfactuals</text><text x="58" y="302" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">what would have had to DIFFER</text><rect x="44" y="314" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="58" y="332" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Example-based</text><text x="58" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">which training examples does this resemble</text><rect x="476" y="84" width="440" height="274" fill="#faf5ff" stroke="#8430ce" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">GLOBAL  -  about the MODEL</text><rect x="496" y="130" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="510" y="148" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Permutation importance</text><text x="510" y="164" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">shuffle a column, watch performance drop</text><rect x="496" y="176" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="510" y="194" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Partial dependence  /  ICE</text><text x="510" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">how the prediction moves as one feature varies</text><rect x="496" y="222" width="400" height="42" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="510" y="240" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Surrogate models</text><text x="510" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">what simple model approximates this everywhere</text><text x="696" y="288" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">&quot;Income matters most in our model&quot;</text><text x="696" y="306" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="middle" opacity="1.0">is NOT why this applicant was declined.</text><text x="24" y="392" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Three worth knowing the catch on</text><rect x="24" y="410" width="892" height="44" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="410" width="5" height="44" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="429" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">LIME</text><text x="220" y="429" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Fast and model-agnostic - and only as good as the neighbourhood you sampled.</text><text x="220" y="445" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">No uniqueness guarantee: two LIME runs can disagree.</text><rect x="24" y="460" width="892" height="44" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="460" width="5" height="44" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="479" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Permutation importance</text><text x="220" y="479" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cheap, intuitive, global - and it misleads with correlated features.</text><text x="220" y="495" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Shuffle one of two correlated predictors and the other carries the model. Both look useless.</text><rect x="24" y="510" width="892" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="510" width="5" height="44" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="529" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Example-based</text><text x="220" y="529" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Needs a model that produces an EMBEDDING. Tree models are not supported.</text><text x="220" y="545" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The exact inverse of sampled Shapley - and the one thing SHAP and LIME do not replace.</text></svg>