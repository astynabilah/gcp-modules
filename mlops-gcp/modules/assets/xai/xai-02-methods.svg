<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" role="img" aria-label="Choosing an attribution method by model type"><title>Choosing an attribution method by model type</title><rect width="940" height="700" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="699" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The method is chosen by the model, not by preference</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Ask one question first: can you take a gradient of this model?</text><rect x="370" y="84" width="200" height="50" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="113.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Differentiable?</text><rect x="60" y="176" width="260" height="60" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="190.0" y="201.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">SAMPLED SHAPLEY</text><text x="190.0" y="218.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">black box - needs nothing</text><path d="M 370 118 C 300 130 180 150 180 172" fill="none" stroke="#188038" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="250" y="152" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">NO</text><rect x="620" y="152" width="260" height="50" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="750.0" y="172.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Tabular?  INTEGRATED</text><text x="750.0" y="189.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">GRADIENTS</text><rect x="620" y="216" width="260" height="50" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="750.0" y="245.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Natural image?  XRAI</text><path d="M 570 118 C 640 130 700 140 720 148" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="660" y="122" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">YES</text><line x1="750" y1="202" x2="750" y2="216" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><text x="190" y="262" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">the ONLY option for tree ensembles</text><text x="190" y="278" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">and ensembles of trees + neural nets</text><text x="24" y="322" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Side by side</text><rect x="24" y="338" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="338" width="892" height="158" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="355.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0"></text><text x="184" y="355.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Sampled Shapley</text><line x1="174" y1="338" x2="174" y2="496" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="434" y="355.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Integrated gradients</text><line x1="424" y1="338" x2="424" y2="496" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="684" y="355.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">XRAI</text><line x1="674" y1="338" x2="674" y2="496" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="366" x2="916" y2="366" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Needs</text><text x="184" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nothing - black box</text><text x="434" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">differentiable model</text><text x="684" y="383.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">differentiable model</text><rect x="24" y="392" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Modality</text><text x="184" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tabular</text><text x="434" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tabular AND image</text><text x="684" y="409.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">IMAGE ONLY</text><line x1="24" y1="392" x2="916" y2="392" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Knob</text><text x="184" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">pathCount</text><text x="434" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">stepCount</text><text x="684" y="435.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">stepCount</text><line x1="24" y1="418" x2="916" y2="418" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="444" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="461.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Range</text><text x="184" y="461.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">[1, 50]</text><text x="434" y="461.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">[1, 100]</text><text x="684" y="461.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">[1, 100]</text><line x1="24" y1="444" x2="916" y2="444" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="487.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Extra baselines</text><text x="184" y="487.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">FREE - no latency cost</text><text x="434" y="487.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cost one path integral each</text><text x="684" y="487.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">cost one path integral each</text><line x1="24" y1="470" x2="916" y2="470" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="24" y="512" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">When approximationError exceeds 0.05</text><rect x="24" y="528" width="440" height="82" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="44" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">1.  Fix the baseline first</text><text x="44" y="572" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Costs nothing. It is a different reference point,</text><text x="44" y="588" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">not more compute - and it is often the cause.</text><rect x="476" y="528" width="440" height="82" fill="#fff8e6" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><text x="496" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">2.  Then raise the iteration count</text><text x="496" y="572" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Linear runtime: double pathCount, double the</text><text x="496" y="588" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">latency. And it stops helping at the cap.</text><rect x="24" y="624" width="892" height="64" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="624" width="3.5" height="64" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="644" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">An ensemble containing decision trees is not differentiable - the trees make it</text><text x="40" y="660" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">piecewise-constant - so integrated gradients and XRAI are unavailable no matter how you</text><text x="40" y="676" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">tune them. That is a capability boundary, not a quality trade-off.</text></svg>