<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" role="img" aria-label="Default versus per-trigger service accounts for Artifact Registry"><title>Default versus per-trigger service accounts for Artifact Registry</title><rect width="940" height="660" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="659" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">The default service account is the whole problem</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Three ML teams, three repositories. What each build can actually reach.</text><rect x="24" y="78" width="440" height="220" fill="#fff8f7" stroke="#d93025" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">DEFAULT CLOUD BUILD SERVICE ACCOUNT</text><text x="44" y="120" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Permissions granted at the PROJECT level.</text><rect x="44" y="136" width="150" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="119.0" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team A trigger</text><rect x="44" y="188" width="150" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="119.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team B trigger</text><rect x="44" y="240" width="150" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="119.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team C trigger</text><rect x="232" y="188" width="106" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="285.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">default SA</text><path d="M 194 158 C 212 158 214 210 232 210" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 194 210 C 212 210 214 210 232 210" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 194 262 C 212 262 214 210 232 210" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="360" y="136" width="84" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="402.0" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo A</text><path d="M 338 210 C 350 210 348 158 360 158" fill="none" stroke="#d93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="360" y="188" width="84" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="402.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo B</text><path d="M 338 210 C 350 210 348 210 360 210" fill="none" stroke="#d93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="360" y="240" width="84" height="44" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="402.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo C</text><path d="M 338 210 C 350 210 348 262 360 262" fill="none" stroke="#d93025" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="244" y="306" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">every build can push to every repository</text><rect x="476" y="78" width="440" height="220" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">PER-TRIGGER SERVICE ACCOUNTS</text><text x="496" y="120" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">artifactregistry.writer on ONE repository each.</text><rect x="496" y="136" width="138" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="565.0" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team A trigger</text><rect x="652" y="136" width="116" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="710.0" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">sa-team-a</text><rect x="786" y="136" width="84" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="828.0" y="162.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo A</text><line x1="634" y1="158" x2="645.0" y2="158.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 652.0 158.0 L 643.8 161.7 L 643.8 154.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="768" y1="158" x2="779.0" y2="158.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 786.0 158.0 L 777.8 161.7 L 777.8 154.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="496" y="188" width="138" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="565.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team B trigger</text><rect x="652" y="188" width="116" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="710.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">sa-team-b</text><rect x="786" y="188" width="84" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="828.0" y="214.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo B</text><line x1="634" y1="210" x2="645.0" y2="210.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 652.0 210.0 L 643.8 213.7 L 643.8 206.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="768" y1="210" x2="779.0" y2="210.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 786.0 210.0 L 777.8 213.7 L 777.8 206.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="496" y="240" width="138" height="44" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="565.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Team C trigger</text><rect x="652" y="240" width="116" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="710.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">sa-team-c</text><rect x="786" y="240" width="84" height="44" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="828.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">repo C</text><line x1="634" y1="262" x2="645.0" y2="262.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 652.0 262.0 L 643.8 265.7 L 643.8 258.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="768" y1="262" x2="779.0" y2="262.0" stroke="#188038" stroke-width="1.6" opacity="1.0"/><path d="M 786.0 262.0 L 777.8 265.7 L 777.8 258.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="696" y="306" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">a compromised build reaches exactly one repository</text><text x="24" y="350" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Why the alternatives do not isolate</text><rect x="24" y="374" width="892" height="62" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="374" width="5" height="62" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="396" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">VPC Service Controls</text><text x="44" y="414" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A network perimeter, not an IAM boundary. It stops data leaving the perimeter;</text><text x="44" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">it does not stop Team A&#x27;s build pushing into Team B&#x27;s repo inside it.</text><rect x="24" y="444" width="892" height="62" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="444" width="5" height="62" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="466" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">One repo, folder per team</text><text x="44" y="484" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Artifact Registry grants IAM per REPOSITORY. Paths inside one repository share</text><text x="44" y="498" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">its bindings, so a path is a naming convention, not an access boundary.</text><rect x="24" y="514" width="892" height="62" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="514" width="5" height="62" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="536" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A project per team</text><text x="44" y="554" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Genuinely isolates - and is real overhead: quotas, billing, networking, IAM</text><text x="44" y="568" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">in triplicate. Justified by org structure, not by wanting separate repos.</text><rect x="24" y="588" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="588" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="608" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Least privilege here is two settings: a custom service account on the trigger, and a</text><text x="40" y="624" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">repository-scoped role binding rather than a project-scoped one. Neither needs new projects.</text></svg>