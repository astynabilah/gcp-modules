<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="The code pipeline and the model pipeline are separate"><title>The code pipeline and the model pipeline are separate</title><rect width="940" height="520" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="519" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">What an ML build actually does — two pipelines, not one</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">App CI ships code. ML CI ships code AND may retrain a model. Keep them separate.</text><rect x="24" y="78" width="892" height="150" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">1. CODE PIPELINE — on every push</text><rect x="44" y="122" width="156" height="46" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="122.0" y="149.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Lint + test</text><line x1="200" y1="145" x2="209.0" y2="145.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 216.0 145.0 L 207.8 148.7 L 207.8 141.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="216" y="122" width="156" height="46" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="294.0" y="149.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Build image</text><line x1="372" y1="145" x2="381.0" y2="145.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 388.0 145.0 L 379.8 148.7 L 379.8 141.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="388" y="122" width="156" height="46" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="466.0" y="149.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Push to AR</text><line x1="544" y1="145" x2="553.0" y2="145.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 560.0 145.0 L 551.8 148.7 L 551.8 141.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="560" y="122" width="156" height="46" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="638.0" y="149.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Compile pipeline</text><line x1="716" y1="145" x2="725.0" y2="145.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 732.0 145.0 L 723.8 148.7 L 723.8 141.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="732" y="122" width="156" height="46" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="810.0" y="149.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Upload YAML</text><text x="44" y="200" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Fast, runs constantly, and never touches production data. This is ordinary CI.</text><rect x="24" y="244" width="892" height="168" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="268" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8430ce" font-weight="700" text-anchor="start" opacity="1.0">2. MODEL PIPELINE — on a schedule, or on new data</text><rect x="44" y="288" width="156" height="46" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="122.0" y="315.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Rebuild features</text><line x1="200" y1="311" x2="209.0" y2="311.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 216.0 311.0 L 207.8 314.7 L 207.8 307.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="216" y="288" width="156" height="46" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="294.0" y="315.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Train</text><line x1="372" y1="311" x2="381.0" y2="311.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 388.0 311.0 L 379.8 314.7 L 379.8 307.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="388" y="288" width="156" height="46" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="466.0" y="315.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Evaluate</text><line x1="544" y1="311" x2="553.0" y2="311.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 560.0 311.0 L 551.8 314.7 L 551.8 307.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="560" y="288" width="156" height="46" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="638.0" y="315.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Quality gate</text><line x1="716" y1="311" x2="725.0" y2="311.0" stroke="#bdc1c6" stroke-width="1.3" opacity="1.0"/><path d="M 732.0 311.0 L 723.8 314.7 L 723.8 307.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="732" y="288" width="156" height="46" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="810.0" y="315.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Register</text><text x="44" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Slow, expensive, and the gate decides whether the model is allowed to exist.</text><text x="44" y="384" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">This is a Vertex AI Pipeline - CI submits it, CI does not contain it.</text><rect x="24" y="428" width="892" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="428" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="448" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Conflating the two is the usual mistake: a code push should not retrain a model, and a</text><text x="40" y="464" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">retrain should not wait on a linter. Cloud Build compiles and submits the pipeline; the</text><text x="40" y="480" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">pipeline does the ML. Keeping the boundary means a broken test cannot block a retrain, and</text><text x="40" y="496" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a bad model cannot be shipped by a green build.</text></svg>