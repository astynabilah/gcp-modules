<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-label="Autoscaling signals for GPU inference on GKE"><title>Autoscaling signals for GPU inference on GKE</title><rect width="940" height="720" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="719" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why queue size, and not CPU</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Continuous batching is the mechanism. It is also what makes the queue a good signal.</text><rect x="24" y="82" width="440" height="250" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">QUEUE SIZE under rising load</text><line x1="70" y1="280" x2="430" y2="280" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><line x1="70" y1="130" x2="70" y2="280" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 70 278 L 150 276 L 230 273 L 280 268 L 310 250 L 335 200 L 355 150 L 370 134" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="300" y1="130" x2="300" y2="280" stroke="#e37400" stroke-width="1.4" stroke-dasharray="4 4" opacity="1.0"/><text x="300" y="124" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">batch space runs out</text><text x="160" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">near zero while there is room</text><text x="380" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">grows fast</text><text x="244" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">That non-linearity is the spike detector.</text><rect x="476" y="82" width="440" height="250" fill="#fff8f7" stroke="#d93025" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">CPU UTILISATION under the same load</text><line x1="522" y1="280" x2="882" y2="280" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><line x1="522" y1="130" x2="522" y2="280" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 522 250 L 600 247 L 680 249 L 760 246 L 840 248 L 882 247" fill="none" stroke="#d93025" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="696" y="296" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">barely moves - the work is on the GPU</text><text x="696" y="320" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Scale on this and you scale late, or never.</text><text x="24" y="372" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The signals, in the order the docs recommend them</text><rect x="24" y="390" width="892" height="48" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="390" width="5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="411" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Queue size</text><text x="44" y="429" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">tgi_queue_size  ·  vllm:num_requests_waiting</text><text x="370" y="418" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">First choice. Throughput and cost efficiency at once, if it meets your latency target.</text><rect x="24" y="444" width="892" height="48" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="444" width="5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="465" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Batch size</text><text x="44" y="483" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">tgi_batch_current_size  ·  vllm:num_requests_running</text><text x="370" y="472" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">When queue-based scaling is not fast enough. Lower latency, harder threshold to find.</text><rect x="24" y="498" width="892" height="48" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="498" width="5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="519" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">KV cache utilisation</text><text x="44" y="537" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">vllm:gpu_cache_usage_perc</text><text x="370" y="526" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The inference overview ranks this first for latency-sensitive work.</text><rect x="24" y="552" width="892" height="48" fill="#ffffff" stroke="#e37400" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="552" width="5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="573" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">GPU duty cycle</text><text x="44" y="591" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">DCGM_FI_DEV_GPU_UTIL</text><text x="370" y="580" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Measures IF the GPU is busy, not how much work it is doing. Hard to map to latency.</text><rect x="24" y="606" width="892" height="48" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="606" width="5" height="48" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="627" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">GPU memory used</text><text x="44" y="645" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">DCGM_FI_DEV_FB_USED</text><text x="370" y="634" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">TGI and vLLM PRE-ALLOCATE. Scales up and never back down.</text><rect x="24" y="660" width="892" height="48" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="660" width="5" height="48" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="681" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">CPU  /  memory  /  RPS</text><text x="44" y="699" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">the built-in metrics</text><text x="370" y="688" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Not recommended as sole indicators. RPS also ignores that requests vary hugely in cost.</text></svg>