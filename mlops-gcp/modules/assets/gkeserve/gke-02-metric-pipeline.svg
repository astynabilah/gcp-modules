<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="How a model-server metric reaches the Horizontal Pod Autoscaler"><title>How a model-server metric reaches the Horizontal Pod Autoscaler</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Getting a server metric into HPA</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Four hops on the classic path. Since March 2026 there is a shorter one, in preview.</text><rect x="24" y="100" width="148" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="98.0" y="124.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">model server</text><text x="98.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">/metrics</text><line x1="172" y1="129" x2="203.0" y2="129.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 210.0 129.0 L 201.8 132.7 L 201.8 125.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="210" y="100" width="148" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="284.0" y="124.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">PodMonitoring</text><text x="284.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">Managed Prometheus</text><line x1="358" y1="129" x2="389.0" y2="129.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 396.0 129.0 L 387.8 132.7 L 387.8 125.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="396" y="100" width="148" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="470.0" y="133.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud Monitoring</text><line x1="544" y1="129" x2="575.0" y2="129.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 582.0 129.0 L 573.8 132.7 L 573.8 125.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="582" y="100" width="148" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="656.0" y="124.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Metrics adapter</text><text x="656.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">stackdriver</text><line x1="730" y1="129" x2="761.0" y2="129.0" stroke="#bdc1c6" stroke-width="1.4" opacity="1.0"/><path d="M 768.0 129.0 L 759.8 132.7 L 759.8 125.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="768" y="100" width="148" height="58" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="842.0" y="124.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">HPA</text><text x="842.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">scales the Deployment</text><text x="24" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">And the field that trips people up</text><rect x="24" y="212" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="212" width="892" height="106" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="229.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Metric kind</text><text x="194" y="229.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">HPA type</text><line x1="184" y1="212" x2="184" y2="318" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="304" y="229.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Name format</text><line x1="294" y1="212" x2="294" y2="318" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="724" y="229.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Selector</text><line x1="714" y1="212" x2="714" y2="318" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="240" x2="916" y2="240" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">server metric</text><text x="194" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Pods</text><text x="304" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">prometheus.googleapis.com|tgi_queue_size|gauge</text><text x="724" y="257.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">none</text><rect x="24" y="266" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="283.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">GPU metric</text><text x="194" y="283.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">External</text><text x="304" y="283.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">kubernetes.io|container|accelerator|duty_cycle</text><text x="724" y="283.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">resource.labels...</text><line x1="24" y1="266" x2="916" y2="266" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="309.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">DCGM metric</text><text x="194" y="309.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">External</text><text x="304" y="309.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">prometheus.googleapis.com|dcgm_fi_dev_gpu_util|unknown</text><text x="724" y="309.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">must be lowercase</text><line x1="24" y1="292" x2="916" y2="292" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="24" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Picking the target value</text><rect x="24" y="364" width="440" height="96" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="44" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">What the docs say</text><text x="44" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Start between 3 and 5. Load test. Raise it until</text><text x="44" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">latency reaches your target. Below 10, tune the</text><text x="44" y="440" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">scale-up policy to survive spikes.</text><rect x="476" y="364" width="440" height="96" fill="#fff8e6" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><text x="496" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">What people quote</text><text x="496" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">&quot;The knee where throughput stops growing and</text><text x="496" y="424" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">only latency rises.&quot; Sound reasoning - but it is in</text><text x="496" y="440" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Google&#x27;s BLOG posts, not the documentation.</text><rect x="24" y="474" width="892" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="474" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="494" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Mind the tolerance: HPA applies a default 0.1 no-action band around the target. With a</text><text x="40" y="510" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">target of 4, nothing happens between about 3.6 and 4.4 - a wide range for a small number.</text></svg>