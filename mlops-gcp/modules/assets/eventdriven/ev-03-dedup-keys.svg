<svg xmlns="http://www.w3.org/2000/svg" width="940" height="672" viewBox="0 0 940 672" role="img" aria-label="Choosing a deduplication key"><title>Choosing a deduplication key</title><rect width="940" height="672" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="671" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Choosing a deduplication key</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The key decides what counts as &#x27;the same work&#x27;. Get this wrong and you either duplicate or silently skip.</text><rect x="24" y="82" width="892" height="92" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="82" width="6" height="92" fill="#188038" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="110" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">CloudEvent id</text><rect x="792" y="97" width="60.629999999999995" height="20" fill="#188038" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="801" y="110.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">CORRECT</text><text x="46" y="134" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Unchanged across retries of the same event; different for a genuinely new event.</text><text x="46" y="154" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Per the CloudEvents spec, source + id identifies an event uniquely.</text><rect x="24" y="182" width="892" height="92" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="182" width="6" height="92" fill="#d93025" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="210" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">File name</text><rect x="792" y="197" width="48.45" height="20" fill="#d93025" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="801" y="210.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">WRONG</text><text x="46" y="234" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Re-uploading the same file for a legitimate second training run is dropped as a duplicate.</text><text x="46" y="254" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">It identifies the object, not the event about the object.</text><rect x="24" y="282" width="892" height="92" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="282" width="6" height="92" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="310" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">File name + generation</text><rect x="792" y="297" width="72.81" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="801" y="310.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">SOMETIMES</text><text x="46" y="334" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Distinguishes object versions, so a re-upload is a new key.</text><text x="46" y="354" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Reasonable when you truly want once-per-object-version.</text><rect x="24" y="382" width="892" height="92" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="9" opacity="1.0"/><rect x="24" y="382" width="6" height="92" fill="#e37400" stroke="none" stroke-width="1" rx="3" opacity="1.0"/><text x="46" y="410" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Content hash</text><rect x="792" y="397" width="72.81" height="20" fill="#e37400" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="801" y="410.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="500" text-anchor="start" opacity="1.0">SOMETIMES</text><text x="46" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Same bytes are processed once, ever, even under a different name.</text><text x="46" y="454" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Right for expensive dedup of identical payloads; wrong if reprocessing is valid.</text><text x="24" y="506" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Things that look like fixes and are not</text><rect x="24" y="518" width="4" height="26" fill="#d93025" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="40" y="530" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">max instances = 1</text><text x="220" y="530" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Stops CONCURRENCY, not repetition. A sequential retry of the same event still duplicates.</text><rect x="24" y="552" width="4" height="26" fill="#d93025" stroke="none" stroke-width="1" rx="2" opacity="1.0"/><text x="40" y="564" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#d93025" font-weight="400" text-anchor="start" opacity="1.0">turning retries off</text><text x="220" y="564" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Removes duplicates by removing reliability. Transient failures now silently lose work.</text><rect x="24" y="604" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="604" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="624" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Only idempotency solves this. Everything else either reduces throughput, reduces reliability,</text><text x="40" y="640" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">or changes the definition of &#x27;the same work&#x27; in a way you did not intend.</text></svg>