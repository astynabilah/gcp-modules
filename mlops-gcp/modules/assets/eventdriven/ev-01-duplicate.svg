<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="How at-least-once delivery plus a timeout produces duplicate work"><title>How at-least-once delivery plus a timeout produces duplicate work</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Why a timeout creates a duplicate</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The failure is not that the call failed. It is that you do not know whether it succeeded.</text><rect x="24" y="78" width="892" height="176" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="102" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">ATTEMPT 1</text><rect x="44" y="120" width="148" height="52" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="118.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">File lands</text><text x="118.0" y="158.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">finalize event</text><rect x="206" y="120" width="148" height="52" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="280.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Function runs</text><text x="280.0" y="158.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">event id = abc123</text><rect x="368" y="120" width="148" height="52" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="442.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Vertex API call</text><text x="442.0" y="158.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">job IS created</text><rect x="530" y="120" width="148" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="604.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">...timeout</text><text x="604.0" y="158.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">no response</text><rect x="692" y="120" width="148" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="766.0" y="141.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Function fails</text><text x="766.0" y="158.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">retry scheduled</text><line x1="192" y1="146" x2="199.0" y2="146.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 206.0 146.0 L 197.8 149.7 L 197.8 142.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="354" y1="146" x2="361.0" y2="146.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 368.0 146.0 L 359.8 149.7 L 359.8 142.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="516" y1="146" x2="523.0" y2="146.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 530.0 146.0 L 521.8 149.7 L 521.8 142.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="678" y1="146" x2="685.0" y2="146.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 692.0 146.0 L 683.8 149.7 L 683.8 142.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="368" y="190" width="300" height="46" fill="#e37400" stroke="none" stroke-width="1" rx="7" opacity="0.16"/><text x="518" y="210" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">The training job started.</text><text x="518" y="226" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="middle" opacity="1.0">The function has no idea.</text><rect x="24" y="270" width="892" height="150" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><text x="44" y="294" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">ATTEMPT 2 — the retry</text><text x="180" y="294" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">same event, SAME event id abc123</text><rect x="44" y="312" width="148" height="52" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="118.0" y="333.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Same event</text><text x="118.0" y="350.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">id = abc123</text><rect x="206" y="312" width="148" height="52" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="280.0" y="333.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Function runs</text><text x="280.0" y="350.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">again</text><rect x="368" y="312" width="148" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="442.0" y="333.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Vertex API call</text><text x="442.0" y="350.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">job created AGAIN</text><rect x="530" y="312" width="148" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="604.0" y="333.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Firestore write</text><text x="604.0" y="350.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">second entry</text><rect x="692" y="312" width="148" height="52" fill="#ffffff" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="766.0" y="333.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Success</text><text x="766.0" y="350.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">and now wrong</text><line x1="192" y1="338" x2="199.0" y2="338.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 206.0 338.0 L 197.8 341.7 L 197.8 334.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="354" y1="338" x2="361.0" y2="338.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 368.0 338.0 L 359.8 341.7 L 359.8 334.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="516" y1="338" x2="523.0" y2="338.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 530.0 338.0 L 521.8 341.7 L 521.8 334.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="678" y1="338" x2="685.0" y2="338.0" stroke="#bdc1c6" stroke-width="1.6" opacity="1.0"/><path d="M 692.0 338.0 L 683.8 341.7 L 683.8 334.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="470" y="396" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="700" text-anchor="middle" opacity="1.0">two training jobs, two metadata rows, one uploaded file</text><rect x="24" y="436" width="892" height="80" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="436" width="3.5" height="80" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="456" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cloud Functions gives AT-LEAST-ONCE execution for event-driven functions, and Cloud Storage</text><text x="40" y="472" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">delivers events at-least-once too. Retries are not a bug you enabled by accident — they are the</text><text x="40" y="488" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">reliability mechanism. The bug is that the handler is not safe to run twice. The fix is never to</text><text x="40" y="504" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">stop retrying; it is to make running twice harmless.</text></svg>