<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Vertex AI endpoint types and the tuned Gemini restriction"><title>Vertex AI endpoint types and the tuned Gemini restriction</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Four endpoint types, and the one model that only gets one</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The private options are real - for custom-trained models. Tuned Gemini is the exception.</text><rect x="24" y="84" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="84" width="892" height="132" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="101.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Endpoint type</text><text x="264" y="101.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Reached via</text><line x1="254" y1="84" x2="254" y2="216" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="544" y="101.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Custom-trained</text><line x1="534" y1="84" x2="534" y2="216" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="734" y="101.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Tuned Gemini</text><line x1="724" y1="84" x2="724" y2="216" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="112" x2="916" y2="112" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="129.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Shared public</text><text x="264" y="129.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">public googleapis.com</text><text x="544" y="129.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="734" y="129.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6f4ea" font-weight="400" text-anchor="start" opacity="1.0">YES - only option</text><rect x="24" y="138" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Dedicated public</text><text x="264" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a dedicated public DNS name</text><text x="544" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="734" y="155.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#fce8e6" font-weight="400" text-anchor="start" opacity="1.0">no</text><line x1="24" y1="138" x2="916" y2="138" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Private Service Connect</text><text x="264" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">a private IP in your VPC</text><text x="544" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="734" y="181.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#fce8e6" font-weight="400" text-anchor="start" opacity="1.0">no</text><line x1="24" y1="164" x2="916" y2="164" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="190" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Private services access</text><text x="264" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">VPC Network Peering</text><text x="544" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="734" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#fce8e6" font-weight="400" text-anchor="start" opacity="1.0">no</text><line x1="24" y1="190" x2="916" y2="190" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="24" y="250" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">So how do you restrict a tuned Gemini endpoint?</text><rect x="40" y="274" width="250" height="62" fill="#fff8e6" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="165.0" y="300.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Shared public endpoint</text><text x="165.0" y="317.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the only supported target</text><rect x="350" y="274" width="250" height="62" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="475.0" y="300.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">VPC Service Controls</text><text x="475.0" y="317.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">perimeter around the service</text><rect x="660" y="274" width="240" height="62" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="780.0" y="300.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Access level</text><text x="780.0" y="317.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">your corporate IP ranges</text><line x1="290" y1="305" x2="343.0" y2="305.0" stroke="#bdc1c6" stroke-width="1.5" opacity="1.0"/><path d="M 350.0 305.0 L 341.8 308.7 L 341.8 301.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="600" y1="305" x2="653.0" y2="305.0" stroke="#bdc1c6" stroke-width="1.5" opacity="1.0"/><path d="M 660.0 305.0 L 651.8 308.7 L 651.8 301.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="470" y="362" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">public in name, unreachable from anywhere but your network</text><rect x="24" y="386" width="892" height="62" fill="#fff8f7" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="386" width="5" height="62" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Identity-Aware Proxy is not an option here</text><text x="44" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">IAP fronts App Engine, Compute Engine and GKE applications. Vertex AI endpoints do not integrate with it.</text><rect x="24" y="462" width="892" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="462" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="482" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">The instinct - make the endpoint private - is good architecture and an unsupported</text><text x="40" y="498" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">configuration. Check endpoint support before designing around it, not during the review.</text></svg>