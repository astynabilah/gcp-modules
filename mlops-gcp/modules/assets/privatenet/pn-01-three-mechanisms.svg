<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-label="Private Google Access, Cloud NAT and VPC Service Controls"><title>Private Google Access, Cloud NAT and VPC Service Controls</title><rect width="940" height="640" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="639" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Three mechanisms, three different jobs</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">A notebook with no external IP, and everything it is and is not allowed to reach.</text><rect x="24" y="84" width="330" height="300" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a73e8" font-weight="700" text-anchor="start" opacity="1.0">YOUR CUSTOM VPC</text><text x="44" y="128" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">subnet: private google access ON</text><rect x="58" y="148" width="262" height="60" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="189.0" y="173.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Workbench instance</text><text x="189.0" y="190.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">no external IP</text><rect x="58" y="236" width="262" height="52" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="189.0" y="266.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud Router + Cloud NAT</text><text x="189" y="316" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">nothing on the internet can</text><text x="189" y="332" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">open a connection inward</text><circle cx="189" cy="358" r="11" fill="#ffffff" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="183" y1="352" x2="195" y2="364" stroke="#d93025" stroke-width="2" opacity="1.0"/><rect x="560" y="130" width="250" height="56" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="685.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Google APIs</text><text x="685.0" y="170.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">bigquery, storage, aiplatform</text><rect x="560" y="218" width="250" height="56" fill="#fff8e6" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="685.0" y="241.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">The public internet</text><text x="685.0" y="258.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">pypi, github, anywhere</text><rect x="560" y="306" width="250" height="56" fill="#fff8f7" stroke="#d93025" stroke-width="1.5" rx="8" opacity="1.0"/><text x="685.0" y="329.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Another org&#x27;s bucket</text><text x="685.0" y="346.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">exfiltration</text><line x1="354" y1="172" x2="553.0161097365" y2="158.47463331887863" stroke="#188038" stroke-width="1.8" opacity="1.0"/><path d="M 560.0 158.0 L 552.0 162.2 L 551.6 154.9 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="400" y="140" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">Private Google Access</text><line x1="354" y1="262" x2="553.0210190959629" y2="246.5420567692456" stroke="#e37400" stroke-width="1.8" opacity="1.0"/><path d="M 560.0 246.0 L 552.1 250.3 L 551.5 243.0 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="400" y="232" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">Cloud NAT</text><line x1="354" y1="330" x2="540" y2="334" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="4 4" opacity="1.0"/><circle cx="470" cy="332" r="11" fill="#ffffff" stroke="#d93025" stroke-width="2" opacity="1.0"/><line x1="464" y1="326" x2="476" y2="338" stroke="#d93025" stroke-width="2" opacity="1.0"/><text x="400" y="372" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#d93025" font-weight="700" text-anchor="start" opacity="1.0">VPC Service Controls</text><text x="400" y="388" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">refuses it even with valid credentials</text><text x="24" y="434" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Why each is needed, and what it does not do</text><rect x="24" y="450" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="450" width="892" height="132" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="467.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Mechanism</text><text x="280" y="467.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Solves</text><line x1="270" y1="450" x2="270" y2="582" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="610" y="467.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Does NOT</text><line x1="600" y1="450" x2="600" y2="582" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="478" x2="916" y2="478" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="495.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Private Google Access</text><text x="280" y="495.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">reach Google APIs with no external IP</text><text x="610" y="495.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">non-Google hosts; inbound</text><rect x="24" y="504" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="521.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Cloud NAT (on Cloud Router)</text><text x="280" y="521.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">outbound to anywhere, e.g. pip install</text><text x="610" y="521.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">inbound; and it IS internet egress</text><line x1="24" y1="504" x2="916" y2="504" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="547.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">VPC Service Controls</text><text x="280" y="547.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">data leaving the perimeter, credentials or not</text><text x="610" y="547.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">who may do what inside it - that is IAM</text><line x1="24" y1="530" x2="916" y2="530" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="556" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="573.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">IAM</text><text x="280" y="573.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">who may call which API at all</text><text x="610" y="573.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">an authorised user copying data out</text><line x1="24" y1="556" x2="916" y2="556" stroke="#dadce0" stroke-width="1" opacity="0.55"/></svg>