<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Which IAM role actually enables a federated query"><title>Which IAM role actually enables a federated query</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Roles that sound like they would work, and don&#x27;t</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Connection permissions live on the connection. Nothing else grants them by implication.</text><rect x="24" y="92" width="892" height="68" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="92" width="5" height="68" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="118" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">roles/bigquery.dataViewer</text><rect x="400" y="106" width="103.25999999999999" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="409" y="119.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">on the dataset</text><text x="44" y="142" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Read the tables. Says nothing about connections — a federated query still fails.</text><rect x="24" y="170" width="892" height="68" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="170" width="5" height="68" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="196" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">roles/bigquery.user</text><rect x="400" y="184" width="103.25999999999999" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="409" y="197.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">on the project</text><text x="44" y="220" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Run jobs, create datasets. Still no permission to use a connection resource.</text><rect x="24" y="248" width="892" height="68" fill="#ffffff" stroke="#e37400" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="248" width="5" height="68" fill="#e37400" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="274" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">roles/bigquery.admin</text><rect x="400" y="262" width="103.25999999999999" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="409" y="275.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">on the project</text><text x="44" y="298" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Works, because it contains everything — which is exactly why it is the wrong answer.</text><rect x="24" y="326" width="892" height="68" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="326" width="5" height="68" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="352" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">roles/bigquery.connectionUser</text><rect x="400" y="340" width="121.53" height="20" fill="#f1f3f4" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="409" y="353.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">on the connection</text><text x="44" y="376" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The one that grants it, scoped to a single connection. This is the answer.</text><text x="24" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The query it enables</text><rect x="24" y="440" width="892" height="131" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="6" opacity="1.0"/><text x="36" y="464" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">A federated join, from the analyst&#x27;s side</text><rect x="25" y="472" width="34" height="95" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="50" y="486" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#9aa0a6" font-weight="400" text-anchor="end" opacity="1.0">1</text><text x="68" y="486" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">SELECT</text><text x="107.72" y="486" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"> c.customer_id, s.plan_tier, s.monthly_charges</text><text x="50" y="503" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#9aa0a6" font-weight="400" text-anchor="end" opacity="1.0">2</text><text x="68" y="503" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">FROM</text><text x="94.48" y="503" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#137333" font-weight="400" text-anchor="start" opacity="1.0"> `proj.crm.customers`</text><text x="233.5" y="503" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"> AS c</text><text x="50" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#9aa0a6" font-weight="400" text-anchor="end" opacity="1.0">3</text><text x="68" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">JOIN </text><text x="101.1" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#8430ce" font-weight="400" text-anchor="start" opacity="1.0">EXTERNAL_QUERY</text><text x="193.78" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">(</text><text x="200.4" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#0d652d" font-weight="400" text-anchor="start" opacity="1.0">&quot;us-central1.billing-db&quot;</text><text x="359.28" y="520" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">,</text><text x="50" y="537" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#9aa0a6" font-weight="400" text-anchor="end" opacity="1.0">4</text><text x="76" y="537" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#0d652d" font-weight="400" text-anchor="start" opacity="1.0">&quot;SELECT customer_id, plan_tier, monthly_charges FROM subs&quot;</text><text x="459.96" y="537" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">) AS s</text><text x="50" y="554" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#9aa0a6" font-weight="400" text-anchor="end" opacity="1.0">5</text><text x="68" y="554" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#1a73e8" font-weight="400" text-anchor="start" opacity="1.0">USING</text><text x="101.1" y="554" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0"> (customer_id)</text></svg>