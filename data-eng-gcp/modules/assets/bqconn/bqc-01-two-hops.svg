<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="The two IAM grants a federated query needs"><title>The two IAM grants a federated query needs</title><rect width="940" height="600" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="599" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">A federated query is two hops, and they need different grants</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The analyst never touches Cloud SQL. The connection does — using its own service account.</text><rect x="30" y="110" width="150" height="62" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="105.0" y="136.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Analyst</text><text x="105.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a human</text><rect x="258" y="110" width="190" height="62" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="353.0" y="136.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">The connection</text><text x="353.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a BigQuery resource</text><rect x="524" y="110" width="190" height="62" fill="#faf5ff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="619.0" y="136.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Connection SA</text><text x="619.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">auto-created by GCP</text><rect x="766" y="110" width="148" height="62" fill="#f2fbf5" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="840.0" y="136.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">Cloud SQL</text><text x="840.0" y="153.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">the database</text><line x1="180" y1="141" x2="251.0" y2="141.0" stroke="#1a73e8" stroke-width="1.8" opacity="1.0"/><path d="M 258.0 141.0 L 249.8 144.7 L 249.8 137.3 Z" fill="#1a73e8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="448" y1="141" x2="517.0" y2="141.0" stroke="#bdc1c6" stroke-width="1.5" opacity="1.0"/><path d="M 524.0 141.0 L 515.8 144.7 L 515.8 137.3 Z" fill="#bdc1c6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="714" y1="141" x2="759.0" y2="141.0" stroke="#188038" stroke-width="1.8" opacity="1.0"/><path d="M 766.0 141.0 L 757.8 144.7 L 757.8 137.3 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><rect x="190" y="196" width="300" height="74" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.4" rx="8" opacity="1.0"/><text x="340" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a73e8" font-weight="700" text-anchor="middle" opacity="1.0">HOP 1  —  grant to the person</text><text x="340" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">roles/bigquery.connectionUser</text><text x="340" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">on the connection resource</text><rect x="600" y="196" width="314" height="74" fill="#f2fbf5" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><text x="757" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">HOP 2  —  grant to the service account</text><text x="757" y="238" font-family="'Roboto Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">roles/cloudsql.client</text><text x="757" y="256" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">on the Cloud SQL project</text><line x1="340" y1="172" x2="340" y2="196" stroke="#1a73e8" stroke-width="1.3" stroke-dasharray="3 3" opacity="1.0"/><line x1="757" y1="172" x2="757" y2="196" stroke="#188038" stroke-width="1.3" stroke-dasharray="3 3" opacity="1.0"/><text x="24" y="310" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Why the analyst does not get cloudsql.client</text><rect x="24" y="326" width="892" height="68" fill="#fff8f7" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="326" width="5" height="68" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Granting it directly works — and defeats the design</text><text x="44" y="366" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The whole point of a connection is that database credentials live in one managed resource instead of being handed out. Give the analyst</text><text x="44" y="382" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">cloudsql.client and they can now reach that instance from anywhere, by any means, with no connection involved.</text><text x="24" y="428" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">The two roles that are easy to confuse</text><rect x="24" y="444" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="444" width="892" height="80" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="461.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Role</text><text x="334" y="461.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Can run queries through a connection</text><line x1="324" y1="444" x2="324" y2="524" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="634" y="461.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Can create / edit / delete connections</text><line x1="624" y1="444" x2="624" y2="524" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="472" x2="916" y2="472" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="489.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">roles/bigquery.connectionUser</text><text x="334" y="489.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="634" y="489.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">no</text><rect x="24" y="498" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">roles/bigquery.connectionAdmin</text><text x="334" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><text x="634" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">yes</text><line x1="24" y1="498" x2="916" y2="498" stroke="#dadce0" stroke-width="1" opacity="0.55"/><rect x="24" y="532" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="532" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="552" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&quot;Run queries but not manage connections&quot; is connectionUser, every time. connectionAdmin is</text><text x="40" y="568" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">for whoever sets the connection up once - not for the people using it every day.</text></svg>