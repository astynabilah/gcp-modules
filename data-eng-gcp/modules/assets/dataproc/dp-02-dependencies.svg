<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-label="Dependency management options for Dataproc clusters"><title>Dependency management options for Dataproc clusters</title><rect width="940" height="620" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="619" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Four ways to get your Python libraries onto a cluster</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Only two of them are production answers, and they are the two that install nothing at boot.</text><rect x="24" y="84" width="892" height="78" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="84" width="5" height="78" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="110" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">dataproc:pip.packages  /  conda.packages</text><rect x="560" y="98" width="115.44" height="20" fill="#fce8e6" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="569" y="111.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">development only</text><text x="46" y="132" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Downloads from PyPI or conda-forge on EVERY cluster creation.</text><text x="46" y="150" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Startup latency, an external repo in your critical path, and a 10-minute creation timeout.</text><rect x="24" y="170" width="892" height="78" fill="#ffffff" stroke="#d93025" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="170" width="5" height="78" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="196" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Public initialization actions</text><rect x="560" y="184" width="170.25" height="20" fill="#fce8e6" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="569" y="197.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#d93025" font-weight="500" text-anchor="start" opacity="1.0">explicitly warned against</text><text x="46" y="218" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">gs://goog-dataproc-initialization-actions-REGION is a reference implementation.</text><text x="46" y="236" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Google: updates to these scripts &quot;can break your cluster creation&quot;. Copy them to your own bucket.</text><rect x="24" y="256" width="892" height="78" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="256" width="5" height="78" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="282" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A custom image</text><rect x="560" y="270" width="127.62" height="20" fill="#e6f4ea" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="569" y="283.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">the recommendation</text><text x="46" y="304" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">generate_custom_image.py bakes the libraries into a Compute Engine image.</text><text x="46" y="322" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Nothing installs at boot: consistent by construction, and fast every time.</text><rect x="24" y="342" width="892" height="78" fill="#ffffff" stroke="#188038" stroke-width="1.4" rx="8" opacity="1.0"/><rect x="24" y="342" width="5" height="78" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="46" y="368" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">A custom container</text><rect x="560" y="356" width="127.62" height="20" fill="#e6f4ea" stroke="none" stroke-width="1" rx="10.0" opacity="1.0"/><text x="569" y="369.6" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="500" text-anchor="start" opacity="1.0">serverless and GKE</text><text x="46" y="390" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Dependencies in an image passed with --container-image.</text><text x="46" y="408" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Spark is mounted at runtime - do not install it. Needs procps and tini; runs as UID 1099.</text><text x="24" y="454" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">And pin the image version</text><rect x="24" y="470" width="892" height="28" fill="#f8f9fa" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><rect x="24" y="470" width="892" height="106" fill="none" stroke="#dadce0" stroke-width="1" rx="3" opacity="1.0"/><text x="34" y="487.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">You specify</text><text x="264" y="487.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">You get</text><line x1="254" y1="470" x2="254" y2="576" stroke="#dadce0" stroke-width="1" opacity="0.7"/><text x="664" y="487.8" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="500" text-anchor="start" opacity="1.0">Verdict</text><line x1="654" y1="470" x2="654" y2="576" stroke="#dadce0" stroke-width="1" opacity="0.7"/><line x1="24" y1="498" x2="916" y2="498" stroke="#dadce0" stroke-width="1" opacity="1.0"/><text x="34" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">nothing</text><text x="264" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">latest, whatever that becomes</text><text x="664" y="515.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">not for production</text><rect x="24" y="524" width="892" height="26" fill="#fcfcfd" stroke="none" stroke-width="1" rx="0" opacity="1.0"/><text x="34" y="541.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">2.2</text><text x="264" y="541.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">latest 2.2.x - patches, fixed components</text><text x="664" y="541.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6f4ea" font-weight="400" text-anchor="start" opacity="1.0">THE RECOMMENDATION</text><line x1="24" y1="524" x2="916" y2="524" stroke="#dadce0" stroke-width="1" opacity="0.55"/><text x="34" y="567.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">2.2.65-debian12</text><text x="264" y="567.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">exactly that, forever</text><text x="664" y="567.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">reproducible and unpatched</text><line x1="24" y1="550" x2="916" y2="550" stroke="#dadce0" stroke-width="1" opacity="0.55"/></svg>