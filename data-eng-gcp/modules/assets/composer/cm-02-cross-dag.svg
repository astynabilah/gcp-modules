<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-label="Cross-DAG dependency patterns in Airflow"><title>Cross-DAG dependency patterns in Airflow</title><rect width="940" height="620" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="619" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">Two teams, two DAGs, one dependency</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Push or pull. The difference is who has to know about whom.</text><rect x="24" y="82" width="440" height="230" fill="#f2fbf5" stroke="#188038" stroke-width="1.6" rx="10" opacity="1.0"/><text x="44" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#188038" font-weight="700" text-anchor="start" opacity="1.0">PUSH  -  TriggerDagRunOperator</text><text x="44" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">recommended</text><rect x="44" y="142" width="190" height="46" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="139.0" y="160.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">DAG A: preprocess</text><text x="139.0" y="177.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">data eng team</text><rect x="44" y="200" width="190" height="46" fill="#ffffff" stroke="#188038" stroke-width="1.5" rx="8" opacity="1.0"/><text x="139.0" y="218.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">trigger_training</text><text x="139.0" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a task in A</text><line x1="139" y1="188" x2="139" y2="200" stroke="#5f6368" stroke-width="1.4" opacity="1.0"/><rect x="268" y="172" width="176" height="46" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="356.0" y="190.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">DAG B: training</text><text x="356.0" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">ML team</text><line x1="234" y1="223" x2="262.04441401848493" y2="205.67845016505342" stroke="#188038" stroke-width="1.8" opacity="1.0"/><path d="M 268.0 202.0 L 262.9 209.4 L 259.1 203.2 Z" fill="#188038" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="244" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#188038" font-weight="700" text-anchor="middle" opacity="1.0">A knows only B&#x27;s dag_id. No polling. Passes conf.</text><text x="244" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">B needs no schedule of its own.</text><rect x="476" y="82" width="440" height="230" fill="#fff8e6" stroke="#e37400" stroke-width="1.6" rx="10" opacity="1.0"/><text x="496" y="108" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#e37400" font-weight="700" text-anchor="start" opacity="1.0">PULL  -  ExternalTaskSensor</text><text x="496" y="126" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">for multi-upstream cases</text><rect x="496" y="172" width="176" height="46" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="584.0" y="190.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">DAG A: preprocess</text><text x="584.0" y="207.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">data eng team</text><rect x="722" y="142" width="190" height="46" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" rx="8" opacity="1.0"/><text x="817.0" y="160.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">DAG B: training</text><text x="817.0" y="177.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">ML team</text><rect x="722" y="200" width="190" height="46" fill="#ffffff" stroke="#e37400" stroke-width="1.5" rx="8" opacity="1.0"/><text x="817.0" y="218.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">wait_for_...</text><text x="817.0" y="235.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">a task in B</text><line x1="817" y1="188" x2="817" y2="200" stroke="#5f6368" stroke-width="1.4" opacity="1.0"/><line x1="722" y1="223" x2="678.4538747392515" y2="204.71062739048566" stroke="#e37400" stroke-width="1.8" stroke-dasharray="4 3" opacity="1.0"/><path d="M 672.0 202.0 L 681.0 201.8 L 678.2 208.6 Z" fill="#e37400" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="696" y="272" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#e37400" font-weight="700" text-anchor="middle" opacity="1.0">B hard-codes a TASK ID inside A. Polls. Dates must align.</text><text x="696" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">A rename in A leaves B waiting forever.</text><text x="24" y="348" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">And the two that are not answers</text><rect x="24" y="366" width="892" height="56" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="366" width="5" height="56" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="389" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">TaskGroup</text><text x="232" y="389" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Visual grouping inside ONE DAG - a collapsible box in the UI.</text><text x="44" y="409" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">No separate ownership, deployment, schedule or permissions. Merging loses the boundary.</text><rect x="24" y="430" width="892" height="56" fill="#ffffff" stroke="#d93025" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="430" width="5" height="56" fill="#d93025" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="453" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">SubDagOperator</text><text x="232" y="453" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Deprecated in Airflow; Google&#x27;s docs recommend against it.</text><text x="44" y="473" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Ran a nested DAG inside a task and consumed worker slots in ways that deadlocked.</text><rect x="24" y="494" width="892" height="56" fill="#ffffff" stroke="#188038" stroke-width="1.3" rx="8" opacity="1.0"/><rect x="24" y="494" width="5" height="56" fill="#188038" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="517" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Datasets  (Airflow 2.4+)</text><text x="232" y="517" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">A third real option: A declares an outlet, B is scheduled by it.</text><text x="44" y="537" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Coupling is on a shared ARTIFACT, not on either DAG&#x27;s internals. Cleanest boundary.</text><rect x="24" y="564" width="892" height="48" fill="#fef7e0" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="564" width="3.5" height="48" fill="#e37400" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="584" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&quot;Separate logical boundaries for different team ownership&quot; rules out merging before you</text><text x="40" y="600" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">read the rest of the option. TaskGroup draws a box; it does not give a team a repository.</text></svg>