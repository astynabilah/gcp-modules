<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="What a DAG is"><title>What a DAG is</title><rect width="940" height="560" fill="#ffffff"/><rect x="0.5" y="0.5" width="939" height="559" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="10" opacity="1.0"/><text x="24" y="34" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#202124" font-weight="500" text-anchor="start" opacity="1.0">A DAG is three words, each doing work</text><text x="24" y="56" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Directed Acyclic Graph. Boxes, one-way arrows, and no way back to where you started.</text><rect x="24" y="84" width="892" height="190" fill="#f8fbff" stroke="#1a73e8" stroke-width="1.5" rx="10" opacity="1.0"/><rect x="48" y="150" width="140" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="118.0" y="179.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">extract</text><rect x="228" y="150" width="140" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="298.0" y="179.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">validate</text><rect x="408" y="106" width="140" height="50" fill="#ffffff" stroke="#8430ce" stroke-width="1.5" rx="8" opacity="1.0"/><text x="478.0" y="135.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">profile_data</text><rect x="408" y="194" width="140" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="478.0" y="223.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">train</text><rect x="588" y="194" width="140" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="658.0" y="223.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">evaluate</text><rect x="768" y="194" width="130" height="50" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" rx="8" opacity="1.0"/><text x="833.0" y="223.0" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#202124" font-weight="500" text-anchor="middle" opacity="1.0">register</text><line x1="188" y1="175" x2="221.0" y2="175.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 228.0 175.0 L 219.8 178.7 L 219.8 171.3 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="368" y1="168" x2="402.5339183338988" y2="140.37286533288096" stroke="#8430ce" stroke-width="1.6" opacity="1.0"/><path d="M 408.0 136.0 L 403.9 144.0 L 399.3 138.3 Z" fill="#8430ce" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="368" y1="182" x2="402.5339183338988" y2="209.62713466711904" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 408.0 214.0 L 399.3 211.7 L 403.9 206.0 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="548" y1="219" x2="581.0" y2="219.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 588.0 219.0 L 579.8 222.7 L 579.8 215.3 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="728" y1="219" x2="761.0" y2="219.0" stroke="#9aa0a6" stroke-width="1.6" opacity="1.0"/><path d="M 768.0 219.0 L 759.8 222.7 L 759.8 215.3 Z" fill="#9aa0a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="430" y="290" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="middle" opacity="1.0">profile_data and train share an upstream and nothing else - so they run at the same time</text><rect x="24" y="318" width="892" height="44" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><rect x="24" y="318" width="5" height="44" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="345" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Graph</text><text x="150" y="345" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">Boxes with arrows between them. The boxes are tasks.</text><rect x="24" y="370" width="892" height="44" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><rect x="24" y="370" width="5" height="44" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="397" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Directed</text><text x="150" y="397" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">The arrows point one way. extract -&gt; validate is not the reverse.</text><rect x="24" y="422" width="892" height="44" fill="#ffffff" stroke="#dadce0" stroke-width="1" rx="8" opacity="1.0"/><rect x="24" y="422" width="5" height="44" fill="#1a73e8" stroke="none" stroke-width="1" rx="2.5" opacity="1.0"/><text x="44" y="449" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="12" fill="#202124" font-weight="700" text-anchor="start" opacity="1.0">Acyclic</text><text x="150" y="449" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5f6368" font-weight="400" text-anchor="start" opacity="1.0">No path leads back to its own start. This is what makes it runnable: there is always something with no unmet dependency.</text><rect x="24" y="480" width="892" height="48" fill="#e6f4ea" stroke="none" stroke-width="1" rx="6" opacity="1.0"/><rect x="24" y="480" width="3.5" height="48" fill="#188038" stroke="none" stroke-width="1" rx="1.75" opacity="1.0"/><text x="40" y="500" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">Every orchestrator is a DAG engine - Airflow, Kubeflow, Cloud Build, make, Spark&#x27;s plan.</text><text x="40" y="516" font-family="'Google Sans','Roboto',-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#202124" font-weight="400" text-anchor="start" opacity="1.0">&quot;What depends on what, and what can run at once&quot; is the only question they answer.</text></svg>